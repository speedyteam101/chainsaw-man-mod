name: Manga app

on:
  push:
    paths:
      - 'manga-app/**'
      - '.github/workflows/manga-app.yml'
  pull_request:
    paths:
      - 'manga-app/**'
      - '.github/workflows/manga-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manga-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew :core:test :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: manga-no-romance-debug-apk
          path: manga-app/app/build/outputs/apk/debug/*.apk
