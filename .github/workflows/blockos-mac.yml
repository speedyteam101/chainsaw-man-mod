name: BlockOS (Mac and Windows apps)

on:
  push:
    paths:
      - "blockos/**"
      - ".github/workflows/blockos-mac.yml"
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build that's still running (macOS minutes are expensive).
concurrency:
  group: blockos-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: blockos/mac-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build BlockOS.app (Apple Silicon and Intel)
        run: ./build.sh --mac arm64 x64
      - uses: actions/upload-artifact@v4
        with:
          name: blockos-mac
          path: blockos/mac-app/build/BlockOS-mac-*.zip

  windows:
    # Electron's Windows build (including the .exe icon) works from Linux, which is cheaper.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockos/mac-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build BlockOS for Windows (x64 and ARM)
        run: ./build.sh --win x64 arm64
      - uses: actions/upload-artifact@v4
        with:
          name: blockos-windows
          path: blockos/mac-app/build/BlockOS-windows-*.zip

  # Keeps one release called "blockos" with the newest builds, so there's always a
  # simple download link on the repository's Releases page.
  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to the "blockos" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          NOTES="Mac: download BlockOS-mac-arm64.zip for Apple Silicon (M-series chips) or BlockOS-mac-x64.zip for Intel. Unzip it and drag BlockOS.app to Applications. The first time, open System Settings > Privacy & Security and click Open Anyway.

          Windows: download BlockOS-windows-x64.zip (most PCs) or BlockOS-windows-arm64.zip (Windows on ARM). Right-click the zip > Extract All, open the BlockOS folder and run BlockOS.exe. If Windows SmartScreen says it protected your PC, click More info > Run anyway."
          if ! gh release view blockos >/dev/null 2>&1; then
            gh release create blockos --target "$GITHUB_SHA" --prerelease --title "BlockOS for Mac and Windows" --notes "$NOTES"
          else
            gh release edit blockos --title "BlockOS for Mac and Windows" --notes "$NOTES"
          fi
          gh release upload blockos dist/*.zip --clobber
