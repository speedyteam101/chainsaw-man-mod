name: Shadowfall (Roblox)

on:
  push:
    paths:
      - "shadowfall/**"
      - ".github/workflows/shadowfall.yml"
  pull_request:
    paths:
      - "shadowfall/**"
      - ".github/workflows/shadowfall.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shadowfall
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo and luau-lsp
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.6.1/rojo-7.6.1-linux-x86_64.zip
          unzip -o -q rojo.zip -d "$RUNNER_TEMP/bin"
          curl -sSL -o lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/latest/download/luau-lsp-linux-x86_64.zip
          unzip -o -q lsp.zip -d "$RUNNER_TEMP/bin"
          curl -sSL -o "$RUNNER_TEMP/globalTypes.d.luau" https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau
          chmod +x "$RUNNER_TEMP/bin/"*
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Type-check
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --definitions="$RUNNER_TEMP/globalTypes.d.luau" --sourcemap=sourcemap.json src

      - name: Build place file
        run: rojo build -o Shadowfall.rbxlx

      - uses: actions/upload-artifact@v4
        with:
          name: Shadowfall-place
          path: shadowfall/Shadowfall.rbxlx
