<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlockOS</title>
<link rel="icon" href="assets/logo.svg">
<!-- iPhone/iPad: "Add to Home Screen" opens BlockOS full screen with its own icon. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BlockOS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16181b">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="boot" aria-hidden="true">
  <div class="boot-logo">
    <span style="--d:0s;background:#ef4444"></span><span style="--d:.12s;background:#facc15"></span>
    <span style="--d:.24s;background:#3b82f6"></span><span style="--d:.36s;background:#22c55e"></span>
  </div>
  <div class="boot-name">BlockOS</div>
  <div class="boot-bar"><i></i></div>
</div>

<header class="topbar">
  <button id="menuBtn" class="menu-btn" aria-haspopup="true" aria-expanded="false" title="Game Menu (Super key)">
    <span class="menu-studs"><i></i><i></i><i></i><i></i></span>
    <span class="menu-label">MENU</span>
  </button>
  <div class="brand">Block<b>OS</b></div>
  <label class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
    <input id="search" type="search" placeholder="Search games" autocomplete="off" spellcheck="false">
  </label>
  <div class="top-right">
    <button class="online-pill" id="onlinePill" data-page="online" hidden title="You're online">Online</button>
    <button class="bricks" id="bricksBtn" title="Bricks: earn them by playing games, spend them in the Avatar Shop">
      <svg viewBox="0 0 24 24" class="brick-icon"><rect x="3" y="9" width="18" height="11" rx="2"/><rect x="6" y="5" width="4" height="4" rx="1"/><rect x="14" y="5" width="4" height="4" rx="1"/></svg>
      <span id="brickCount">0</span>
    </button>
    <div id="clock" class="clock"></div>
    <button class="icon-btn" id="powerBtn" title="Power">
      <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg>
    </button>
  </div>
</header>

<aside class="sidebar">
  <div class="me" id="meCard"></div>
  <nav id="nav"></nav>
  <div class="sidebar-foot">Built on Debian</div>
</aside>

<main id="page" tabindex="-1"></main>

<!-- The game menu: every game, sorted into categories, opened from the MENU button. -->
<div id="gameMenu" class="game-menu" hidden>
  <div class="gm-side">
    <div class="gm-title">Game Menu</div>
    <div id="gmCats" class="gm-cats"></div>
    <div class="gm-power">
      <button data-power="reboot">Restart</button>
      <button data-power="poweroff">Shut down</button>
    </div>
  </div>
  <div class="gm-main">
    <div class="gm-head">
      <h2 id="gmHeading">All games</h2>
      <label class="search gm-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
        <input id="gmSearch" type="search" placeholder="Find a game" autocomplete="off" spellcheck="false">
      </label>
    </div>
    <div id="gmGrid" class="gm-grid"></div>
  </div>
</div>
<div id="scrim" class="scrim" hidden></div>

<div id="modal" class="modal" hidden></div>

<div id="player" class="player" hidden>
  <iframe id="playerFrame" title="Game" allow="autoplay; fullscreen"></iframe>
  <button id="playerMenuBtn" class="player-menu-btn" title="Game menu (Esc)">
    <span class="menu-studs"><i></i><i></i><i></i><i></i></span>
  </button>
  <div id="playerMenu" class="player-menu" hidden>
    <div class="pm-panel">
      <div class="pm-title" id="pmTitle"></div>
      <button data-pm="resume" class="btn green">Resume</button>
      <button data-pm="restart" class="btn">Reset game</button>
      <button data-pm="leave" class="btn red">Leave game</button>
      <div class="pm-hint">Press Esc to open or close this menu</div>
    </div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="config.js"></script>
<script src="games/catalog.js"></script>
<script src="avatar.js"></script>
<script src="studio/runner.js"></script>
<script src="studio/templates/index.js"></script>
<script src="studio/docs.js"></script>
<script src="studio/studio.js"></script>
<script src="app.js"></script>
</body>
</html>
