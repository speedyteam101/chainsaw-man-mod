<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <pattern id="studs" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="4" fill="#ffffff" fill-opacity=".06"/></pattern>
  </defs>
  <rect width="480" height="270" fill="url(#bg)"/><rect width="480" height="270" fill="url(#studs)"/>
  <!-- periodic table strip -->
  <g opacity=".9">
    <rect x="16" y="16" width="26" height="30" rx="4" fill="#f4f4f5"/><rect x="438" y="16" width="26" height="30" rx="4" fill="#67e8f9"/>
    <rect x="16" y="50" width="26" height="30" rx="4" fill="#8b5cf6"/><rect x="46" y="50" width="26" height="30" rx="4" fill="#2dd4bf"/>
    <rect x="318" y="50" width="26" height="30" rx="4" fill="#3f3f46"/><rect x="348" y="50" width="26" height="30" rx="4" fill="#3b82f6"/>
    <rect x="378" y="50" width="26" height="30" rx="4" fill="#ef4444"/><rect x="408" y="50" width="26" height="30" rx="4" fill="#bef264"/>
    <rect x="438" y="50" width="26" height="30" rx="4" fill="#334155"/>
  </g>
  <!-- water molecule, big -->
  <g stroke-linecap="butt">
    <line x1="240" y1="122" x2="158" y2="190" stroke="#8b929b" stroke-width="14"/>
    <line x1="240" y1="122" x2="322" y2="190" stroke="#8b929b" stroke-width="14"/>
    <line x1="240" y1="122" x2="158" y2="190" stroke="#d1d5db" stroke-width="4"/>
    <line x1="240" y1="122" x2="322" y2="190" stroke="#d1d5db" stroke-width="4"/>
  </g>
  <rect x="207" y="89" width="66" height="66" rx="14" fill="#ef4444"/><rect x="215" y="93" width="50" height="9" fill="#fff" fill-opacity=".3"/><rect x="215" y="143" width="50" height="8" fill="#000" fill-opacity=".22"/>
  <rect x="134" y="166" width="48" height="48" rx="10" fill="#f4f4f5"/><rect x="141" y="170" width="34" height="6" fill="#fff" fill-opacity=".6"/><rect x="141" y="204" width="34" height="6" fill="#000" fill-opacity=".15"/>
  <rect x="298" y="166" width="48" height="48" rx="10" fill="#f4f4f5"/><rect x="305" y="170" width="34" height="6" fill="#fff" fill-opacity=".6"/><rect x="305" y="204" width="34" height="6" fill="#000" fill-opacity=".15"/>
  <!-- carbon dioxide, left -->
  <g transform="translate(70 236)">
    <rect x="-46" y="-4" width="92" height="3" fill="#8b929b"/><rect x="-46" y="4" width="92" height="3" fill="#8b929b"/>
    <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#3f3f46"/>
    <rect x="-62" y="-13" width="26" height="26" rx="6" fill="#ef4444"/><rect x="36" y="-13" width="26" height="26" rx="6" fill="#ef4444"/>
  </g>
  <!-- salt ions, right -->
  <g transform="translate(412 222)">
    <rect x="-44" y="-16" width="32" height="32" rx="7" fill="#8b5cf6"/><circle cx="-12" cy="-20" r="8" fill="#fde047"/><rect x="-16" y="-21" width="8" height="2.5" fill="#111"/><rect x="-13.25" y="-24" width="2.5" height="8" fill="#111"/>
    <rect x="4" y="-22" width="42" height="42" rx="9" fill="#22c55e"/><circle cx="46" cy="-24" r="8" fill="#93c5fd"/><rect x="42" y="-25.25" width="8" height="2.5" fill="#111"/>
  </g>
  <!-- methane, top middle -->
  <g transform="translate(240 42) scale(.62)">
    <rect x="-40" y="-3" width="80" height="6" fill="#8b929b"/><rect x="-3" y="-40" width="6" height="80" fill="#8b929b"/>
    <rect x="-13" y="-13" width="26" height="26" rx="6" fill="#3f3f46"/>
    <rect x="-50" y="-9" width="18" height="18" rx="4" fill="#f4f4f5"/><rect x="32" y="-9" width="18" height="18" rx="4" fill="#f4f4f5"/>
    <rect x="-9" y="-50" width="18" height="18" rx="4" fill="#f4f4f5"/><rect x="-9" y="32" width="18" height="18" rx="4" fill="#f4f4f5"/>
  </g>
  <!-- sparkles -->
  <g fill="#facc15"><rect x="120" y="100" width="8" height="8"/><rect x="350" y="110" width="10" height="10"/><rect x="330" y="236" width="6" height="6"/><rect x="110" y="150" width="5" height="5" fill="#67e8f9"/><rect x="368" y="140" width="6" height="6" fill="#a855f7"/></g>
</svg>
