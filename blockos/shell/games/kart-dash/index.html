<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kart Dash</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script src="../kit.js"></script>
<script>
"use strict";
const ID = "kart-dash";
const { canvas, ctx, W, H } = Kit.stage(960, 540);
const ME = Kit.player();
const badge = (id, name, desc) => Kit.badge(ID, id, name, desc);

const WORLD_W = 2400, WORLD_H = 1600;
const HALF = 78;               // half the asphalt width
const LIMIT = HALF + 52;       // barrier distance from the centre line
const LAPS = 3;
const KART_R = 14;
const TOP_SPEED = 330;

// ---------- track ----------
const CONTROL = [
  [1300, 1450], [800, 1450], [420, 1320], [300, 1000], [340, 620], [520, 320], [860, 210], [1200, 300],
  [1370, 540], [1260, 800], [1380, 1010], [1640, 1070], [1850, 880], [1860, 520], [2070, 230], [2280, 560],
  [2240, 1000], [2120, 1330], [1800, 1450],
];

function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
  return [f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])];
}

const PTS = [];
for (let i = 0; i < CONTROL.length; i++) {
  const n = CONTROL.length;
  const p0 = CONTROL[(i - 1 + n) % n], p1 = CONTROL[i], p2 = CONTROL[(i + 1) % n], p3 = CONTROL[(i + 2) % n];
  const steps = Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 8);
  for (let s = 0; s < steps; s++) PTS.push(catmull(p0, p1, p2, p3, s / steps));
}
const N = PTS.length;
const DIRS = PTS.map((_, i) => {
  const a = PTS[(i - 1 + N) % N], b = PTS[(i + 1) % N];
  const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
  return [(b[0] - a[0]) / d, (b[1] - a[1]) / d];
});
const wrap = (i) => ((i % N) + N) % N;
function trackPoint(idx, lateral) {
  const i = wrap(Math.round(idx)), p = PTS[i], d = DIRS[i];
  return { x: p[0] - d[1] * lateral, y: p[1] + d[0] * lateral, a: Math.atan2(d[1], d[0]) };
}

const PADS = [0.08, 0.36, 0.55, 0.84].map((f, k) => ({ ...trackPoint(f * N, k % 2 ? 34 : -34) }));
const BOXES = [];
for (const f of [0.22, 0.47, 0.72, 0.95])
  for (const lat of [-48, 0, 48]) BOXES.push({ ...trackPoint(f * N, lat), timer: 0 });

// ---------- pre-rendered world ----------
const world = document.createElement("canvas");
world.width = WORLD_W; world.height = WORLD_H;
const mini = document.createElement("canvas");
const MINI_S = 0.085;
mini.width = Math.ceil(WORLD_W * MINI_S); mini.height = Math.ceil(WORLD_H * MINI_S);

function seeded(seed) {
  return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
}

function tracePath(c) {
  c.beginPath();
  PTS.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])));
  c.closePath();
}

function renderWorld() {
  const c = world.getContext("2d");
  c.fillStyle = "#3f8f3a";
  c.fillRect(0, 0, WORLD_W, WORLD_H);
  for (let y = 0; y < WORLD_H; y += 40)
    for (let x = 0; x < WORLD_W; x += 40)
      if ((x + y) / 40 % 2) { c.fillStyle = "#47993f"; c.fillRect(x, y, 40, 40); }
  c.lineJoin = "round";
  c.lineCap = "round";

  // barrier band (red/white blocks), then run-off sand on top of its inner part
  const pc = document.createElement("canvas");
  pc.width = pc.height = 32;
  const px = pc.getContext("2d");
  px.fillStyle = "#f2f4f5"; px.fillRect(0, 0, 32, 32);
  px.fillStyle = "#e03131"; px.fillRect(0, 0, 16, 16); px.fillRect(16, 16, 16, 16);
  px.fillStyle = "rgba(0,0,0,.2)"; px.fillRect(0, 14, 32, 2); px.fillRect(0, 30, 32, 2);
  tracePath(c);
  c.strokeStyle = c.createPattern(pc, "repeat");
  c.lineWidth = LIMIT * 2 + 28;
  c.stroke();
  c.strokeStyle = "#d8b67a";
  c.lineWidth = LIMIT * 2;
  c.stroke();
  c.strokeStyle = "rgba(160,120,60,.35)";
  c.lineWidth = LIMIT * 2 - 30;
  c.stroke();
  // curbs
  c.strokeStyle = "#f2f4f5";
  c.lineWidth = HALF * 2 + 16;
  c.stroke();
  c.strokeStyle = "#e03131";
  c.setLineDash([18, 18]);
  c.stroke();
  c.setLineDash([]);
  // asphalt
  c.strokeStyle = "#4b5260";
  c.lineWidth = HALF * 2;
  c.stroke();
  c.strokeStyle = "rgba(255,255,255,.04)";
  c.lineWidth = HALF * 1.2;
  c.stroke();
  // centre dashes
  c.strokeStyle = "rgba(255,255,255,.5)";
  c.lineWidth = 4;
  c.setLineDash([26, 30]);
  c.stroke();
  c.setLineDash([]);

  // start / finish checker
  const s = trackPoint(0, 0);
  c.save();
  c.translate(s.x, s.y);
  c.rotate(s.a);
  for (let row = 0; row < 2; row++)
    for (let k = -HALF; k < HALF; k += 13) {
      c.fillStyle = ((k + HALF) / 13 + row) % 2 < 1 ? "#111" : "#fff";
      c.fillRect(-13 + row * 13, k, 13, 13);
    }
  c.restore();
  // starting grid marks
  for (let g = 0; g < 4; g++) {
    const gp = trackPoint(N - 6 - g * 6, g % 2 ? 34 : -34);
    c.save(); c.translate(gp.x, gp.y); c.rotate(gp.a);
    c.strokeStyle = "rgba(255,255,255,.6)"; c.lineWidth = 3;
    c.beginPath(); c.moveTo(18, -20); c.lineTo(22, -20); c.lineTo(22, 20); c.lineTo(18, 20); c.stroke();
    c.restore();
  }

  // decorations: blocky trees and rocks well away from the track
  const rnd = seeded(7);
  for (let i = 0; i < 520; i++) {
    const x = rnd() * WORLD_W, y = rnd() * WORLD_H;
    let near = Infinity;
    for (let j = 0; j < N; j += 3) near = Math.min(near, Math.hypot(PTS[j][0] - x, PTS[j][1] - y));
    if (near < LIMIT + 46) continue;
    if (rnd() < 0.8) {
      const sz = 26 + rnd() * 18;
      c.fillStyle = "rgba(0,0,0,.25)";
      c.fillRect(x - sz / 2 + 6, y - sz / 2 + 8, sz, sz);
      Kit.brick(c, x - sz / 2, y - sz / 2, sz, sz, rnd() < 0.5 ? "#1f6f2b" : "#2b8a3e", 6);
      Kit.brick(c, x - sz / 4, y - sz / 4, sz / 2, sz / 2, "#37b24d", 4);
    } else {
      Kit.brick(c, x - 10, y - 8, 20, 16, "#868e96", 4);
    }
  }
  // grandstand next to the start
  const gs = trackPoint(0, -LIMIT - 70);
  c.save(); c.translate(gs.x, gs.y); c.rotate(gs.a);
  Kit.brick(c, -110, -26, 220, 52, "#5c6370", 6);
  const crowd = ["#ef4444", "#3b82f6", "#facc15", "#22c55e", "#a855f7", "#fb923c", "#f2f4f5"];
  for (let k = 0; k < 40; k++) {
    c.fillStyle = crowd[k % crowd.length];
    c.fillRect(-104 + (k % 20) * 10.6, -18 + Math.floor(k / 20) * 18, 7, 7);
  }
  c.restore();

  // minimap
  const m = mini.getContext("2d");
  m.lineJoin = "round";
  m.scale(MINI_S, MINI_S);
  tracePath(m);
  m.strokeStyle = "rgba(0,0,0,.6)";
  m.lineWidth = HALF * 2 + 70;
  m.stroke();
  m.strokeStyle = "#cbd5e1";
  m.lineWidth = HALF * 2;
  m.stroke();
}

// ---------- karts ----------
const KART_COLORS = [
  { body: "#3b82f6", dark: "#1d4ed8", name: ME.name },
  { body: "#ef4444", dark: "#b91c1c", name: "Red" },
  { body: "#facc15", dark: "#a16207", name: "Gold" },
  { body: "#a855f7", dark: "#7e22ce", name: "Violet" },
];
let karts, slicks, particles, state, raceTime, countdown, finishOrder, endTimer, shake, msg, msgT, bumpSfxT;

function makeKart(i) {
  const g = trackPoint(N - 6 - i * 6, i % 2 ? 34 : -34);
  return {
    i, ...KART_COLORS[i], ai: i !== 0, x: g.x, y: g.y, angle: g.a, speed: 0, ex: 0, ey: 0,
    idx: wrap(N - 6 - i * 6), lap: -1, done: false, time: 0,
    boost: 0, spin: 0, shield: 0, item: null, itemT: 0, offTrack: false,
    skill: [1, 0.95, 0.97, 0.93][i], lane: i % 2 ? 30 : -30, laneT: Math.random() * 6,
    face: 1, spun: false,
  };
}

function reset() {
  karts = [0, 1, 2, 3].map(makeKart);
  slicks = [];
  particles = [];
  finishOrder = [];
  raceTime = 0;
  countdown = 3.5;
  state = "countdown";
  endTimer = 0;
  shake = 0;
  msg = ""; msgT = 0;
  bumpSfxT = 0;
  BOXES.forEach((b) => (b.timer = 0));
  updateHud();
}

const player = () => karts[0];
const progress = (k) => (k.done ? 1e6 - k.time : k.lap * N + k.idx);
function places() {
  return [...karts].sort((a, b) => progress(b) - progress(a));
}
function ordinal(n) { return n + (["th", "st", "nd", "rd"][n] || "th"); }
function fmtTime(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${m}:${s.toFixed(2).padStart(5, "0")}`;
}

function updateHud() {
  const p = player();
  const best = Kit.best(ID, undefined, true);
  const place = karts ? places().indexOf(p) + 1 : 1;
  Kit.hud(`Lap ${Kit.clamp(p.lap + 1, 1, LAPS)}/${LAPS} · ${ordinal(place)}<small>${fmtTime(raceTime)} · Best ${best == null ? "-" : fmtTime(best)}</small>`);
}

function nearestIdx(k) {
  let best = k.idx, bd = Infinity;
  for (let j = -30; j <= 30; j++) {
    const i = wrap(k.idx + j);
    const d = (PTS[i][0] - k.x) ** 2 + (PTS[i][1] - k.y) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  return { i: best, d: Math.sqrt(bd) };
}

function useItem(k) {
  if (!k.item || k.spin > 0) return;
  if (k.item === "turbo") { k.boost = 2; if (!k.ai) Kit.sfx("jump"); }
  else if (k.item === "slick") {
    slicks.push({ x: k.x - Math.cos(k.angle) * 30, y: k.y - Math.sin(k.angle) * 30, a: Math.random() * 6, owner: k.i, age: 0 });
    if (!k.ai) Kit.sfx("click");
  } else if (k.item === "shield") { k.shield = 8; if (!k.ai) Kit.sfx("coin"); }
  k.item = null;
}

function spinOut(k) {
  if (k.shield > 0) { k.shield = 0; burst(k.x, k.y, "#93c5fd", 14); if (!k.ai) Kit.sfx("click"); return; }
  k.spin = 1.1;
  k.spun = true;
  k.speed *= 0.25;
  k.boost = 0;
  burst(k.x, k.y, "#facc15", 12);
  if (!k.ai) { Kit.sfx("hit"); shake = 0.3; }
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = Kit.rand(40, 180);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, max: 0.6, color, size: 5 });
  }
}

function aiInput(k) {
  k.laneT += 0.016;
  let lane = Math.sin(k.laneT * 0.7 + k.i) * 36;
  // dodge slick blocks ahead
  for (const s of slicks) {
    const dx = s.x - k.x, dy = s.y - k.y;
    const ahead = dx * Math.cos(k.angle) + dy * Math.sin(k.angle);
    const side = -dx * Math.sin(k.angle) + dy * Math.cos(k.angle);
    if (ahead > 0 && ahead < 170 && Math.abs(side) < 34) lane += side > 0 ? -55 : 55;
  }
  k.lane += (Kit.clamp(lane, -60, 60) - k.lane) * 0.08;
  const look = 12 + Math.floor(k.speed / 40);
  const t = trackPoint(k.idx + look, k.lane);
  let diff = Math.atan2(t.y - k.y, t.x - k.x) - k.angle;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  const steer = Kit.clamp(diff * 2.6, -1, 1);
  const throttle = Math.abs(diff) > 0.7 && k.speed > 170 ? 0 : 1;
  // items
  if (k.item) {
    k.itemT -= 1 / 60;
    if (k.item === "shield" || k.itemT <= 0) useItem(k);
  }
  return { steer, throttle };
}

function updateKart(k, dt) {
  let steer = 0, throttle = 0;
  if (state === "race" || state === "finished") {
    if (k.ai || k.done) ({ steer, throttle } = aiInput(k));
    else {
      steer = (Kit.key("ArrowRight") || Kit.key("KeyD") ? 1 : 0) - (Kit.key("ArrowLeft") || Kit.key("KeyA") ? 1 : 0);
      throttle = (Kit.key("ArrowUp") || Kit.key("KeyW") ? 1 : 0) - (Kit.key("ArrowDown") || Kit.key("KeyS") ? 1 : 0);
    }
  }
  k.boost = Math.max(0, k.boost - dt);
  k.shield = Math.max(0, k.shield - dt);
  if (k.spin > 0) {
    k.spin -= dt;
    k.angle += 11 * dt;
    steer = 0; throttle = 0;
  }

  // rubber band the CPU a little so races stay close
  let skill = k.skill;
  if (k.ai && !k.done) {
    const gap = (progress(player()) - progress(k)) / N;
    skill += Kit.clamp(gap * 0.18, -0.07, 0.09);
  }
  const max = TOP_SPEED * skill * (k.offTrack ? 0.5 : 1) * (k.boost > 0 ? 1.45 : 1);
  if (throttle > 0) {
    if (k.speed < max) k.speed = Math.min(max, k.speed + (k.boost > 0 ? 600 : 270) * dt);
  } else if (throttle < 0) {
    k.speed = Math.max(-120, k.speed - (k.speed > 0 ? 520 : 200) * dt);
  } else {
    k.speed -= k.speed * 1.4 * dt;
  }
  if (k.speed > max) k.speed = Math.max(max, k.speed - 380 * dt);
  const grip = Kit.clamp(Math.abs(k.speed) / 140, 0, 1) * Math.sign(k.speed);
  k.angle += steer * 2.7 * grip * dt;

  k.x += (Math.cos(k.angle) * k.speed + k.ex) * dt;
  k.y += (Math.sin(k.angle) * k.speed + k.ey) * dt;
  const decay = Math.exp(-6 * dt);
  k.ex *= decay; k.ey *= decay;

  // track position, laps and barrier
  const prev = k.idx;
  const near = nearestIdx(k);
  k.idx = near.i;
  if (k.idx - prev < -N / 2) lapCross(k);
  else if (k.idx - prev > N / 2) k.lap--;
  k.offTrack = near.d > HALF + 6;
  if (near.d > LIMIT - KART_R) {
    const p = PTS[near.i];
    const nx = (k.x - p[0]) / near.d, ny = (k.y - p[1]) / near.d;
    k.x = p[0] + nx * (LIMIT - KART_R);
    k.y = p[1] + ny * (LIMIT - KART_R);
    k.speed *= 0.6;
    k.ex = -nx * 90; k.ey = -ny * 90;
    if (!k.ai && bumpSfxT <= 0) { Kit.sfx("hit"); bumpSfxT = 0.4; shake = 0.15; }
  }
  k.x = Kit.clamp(k.x, 20, WORLD_W - 20);
  k.y = Kit.clamp(k.y, 20, WORLD_H - 20);

  // pads, boxes, slicks
  for (const p of PADS) {
    if (Math.hypot(p.x - k.x, p.y - k.y) < 30) {
      if (k.boost < 0.9 && !k.ai) Kit.sfx("jump");
      k.boost = Math.max(k.boost, 1.1);
    }
  }
  for (const b of BOXES) {
    if (b.timer <= 0 && Math.hypot(b.x - k.x, b.y - k.y) < 24) {
      b.timer = 3;
      burst(b.x, b.y, "#f472b6", 10);
      if (!k.item) {
        const place = places().indexOf(k);
        // trailing karts get turbos more often
        const pool = place >= 2 ? ["turbo", "turbo", "shield", "slick"] : ["turbo", "slick", "slick", "shield"];
        k.item = Kit.pick(pool);
        k.itemT = Kit.rand(0.6, 3.5);
        if (!k.ai) Kit.sfx("coin");
      }
    }
  }
  for (const s of slicks) {
    if (s.dead || (s.owner === k.i && s.age < 0.6)) continue;
    if (Math.hypot(s.x - k.x, s.y - k.y) < 22) {
      s.dead = true;
      if (s.owner === 0 && k.ai && k.shield <= 0) badge("slick-trick", "Slick Trick", "Spin out a rival with your oil slick.");
      spinOut(k);
    }
  }
  // dust when off track or boosting
  if ((k.offTrack && Math.abs(k.speed) > 60) || k.boost > 0) {
    if (Math.random() < 0.5) {
      particles.push({
        x: k.x - Math.cos(k.angle) * 16, y: k.y - Math.sin(k.angle) * 16,
        vx: Kit.rand(-30, 30), vy: Kit.rand(-30, 30), life: 0.4, max: 0.4,
        color: k.boost > 0 ? Kit.pick(["#fb923c", "#facc15"]) : "#b08a4f", size: k.boost > 0 ? 6 : 5,
      });
    }
  }
}

function lapCross(k) {
  k.lap++;
  if (k.lap >= LAPS && !k.done) {
    k.done = true;
    k.time = raceTime;
    finishOrder.push(k);
    if (k.i === 0) playerFinished();
  } else if (k.i === 0 && k.lap > 0) {
    msg = k.lap === LAPS - 1 ? "Final lap!" : `Lap ${k.lap + 1}`;
    msgT = 1.5;
    Kit.sfx("score");
  }
}

function playerFinished() {
  state = "finished";
  endTimer = 0;
  const place = finishOrder.indexOf(player()) + 1;
  msg = place === 1 ? "You win!" : `${ordinal(place)} place`;
  msgT = 3;
  Kit.sfx(place === 1 ? "win" : "score");
  badge("finish", "Finish Line", "Finish a race.");
  if (place === 1) {
    badge("first-place", "Kart Champ", "Win a race in 1st place.");
    if (!player().spun) badge("clean-win", "Clean Racer", "Win a race without spinning out once.");
  }
}

async function showResults() {
  state = "results";
  game.stop();
  const p = player();
  const place = finishOrder.indexOf(p) + 1;
  const best = Kit.finish(ID, Math.round(p.time * 100) / 100, true);
  const rows = places().map((k, i) => `${ordinal(i + 1)}  ${k.name}  ${k.done ? fmtTime(k.time) : "still racing"}`);
  await Kit.overlay(place === 1 ? "Victory!" : `${ordinal(place)} place`, `${rows.join("\n")}\n\nYour time: ${fmtTime(p.time)}\nBest time: ${fmtTime(best)}`, "Race again");
  reset();
  game.start();
}

function collideKarts() {
  for (let a = 0; a < karts.length; a++)
    for (let b = a + 1; b < karts.length; b++) {
      const A = karts[a], B = karts[b];
      const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < KART_R * 2) {
        const nx = dx / d, ny = dy / d, push = (KART_R * 2 - d) / 2;
        A.x -= nx * push; A.y -= ny * push;
        B.x += nx * push; B.y += ny * push;
        A.ex -= nx * 70; A.ey -= ny * 70;
        B.ex += nx * 70; B.ey += ny * 70;
        A.speed *= 0.96; B.speed *= 0.96;
        if ((!A.ai || !B.ai) && bumpSfxT <= 0) { Kit.sfx("click"); bumpSfxT = 0.3; }
      }
    }
}

Kit.onKey((code) => {
  if (state !== "race") return;
  if (code === "Space" || code === "ShiftLeft" || code === "ShiftRight" || code === "KeyX") useItem(player());
});

function update(dt) {
  bumpSfxT -= dt;
  shake = Math.max(0, shake - dt);
  msgT = Math.max(0, msgT - dt);
  if (state === "countdown") {
    const before = Math.ceil(countdown);
    countdown -= dt;
    const after = Math.ceil(countdown);
    if (after !== before && after >= 1 && after <= 3) Kit.sfx("click");
    if (countdown <= 0) { state = "race"; msg = "GO!"; msgT = 1; Kit.sfx("score"); }
  } else {
    raceTime += dt;
  }
  for (const k of karts) updateKart(k, dt);
  collideKarts();
  for (const b of BOXES) b.timer = Math.max(0, b.timer - dt);
  for (const s of slicks) { s.age += dt; }
  slicks = slicks.filter((s) => !s.dead && s.age < 40);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter((p) => p.life > 0);
  if (state === "finished") {
    endTimer += dt;
    if (endTimer > 6 || karts.every((k) => k.done)) showResults();
  }
  if (state !== "results") updateHud();
}

// ---------- drawing ----------
function drawKart(k) {
  ctx.save();
  ctx.translate(k.x, k.y);
  ctx.fillStyle = "rgba(0,0,0,.3)";
  ctx.beginPath(); ctx.ellipse(4, 5, 19, 14, k.angle, 0, 7); ctx.fill();
  ctx.rotate(k.angle);
  // wheels
  ctx.fillStyle = "#111";
  for (const [wx, wy] of [[-11, -13], [9, -13], [-11, 9], [9, 9]]) ctx.fillRect(wx - 1, wy, 9, 5);
  Kit.brick(ctx, -16, -10, 32, 20, k.body, 5);
  ctx.fillStyle = k.dark;
  ctx.fillRect(-18, -11, 5, 22);          // rear spoiler
  ctx.fillRect(12, -6, 6, 12);            // nose
  // driver helmet (your kart shows your avatar instead)
  if (k.ai) {
    ctx.fillStyle = "#f2f4f5";
    ctx.fillRect(-6, -6, 12, 12);
    ctx.fillStyle = "#1f2328";
    ctx.fillRect(2, -4, 4, 8);
  } else {
    ctx.fillStyle = "#1f2328";
    ctx.fillRect(-8, -7, 14, 14);   // seat
  }
  ctx.restore();
  if (!k.ai) {
    // your avatar sits upright in the seat (legs tucked inside the kart)
    const c = Math.cos(k.angle);
    if (Math.abs(c) > 0.3) k.face = c > 0 ? 1 : -1;
    ctx.save();
    ctx.beginPath();
    ctx.rect(k.x - 24, k.y - 50, 48, 52);
    ctx.clip();
    const wob = k.spin > 0 ? Math.sin(k.spin * 30) * 0.3 : 0;
    ctx.translate(k.x, k.y + 12);
    ctx.rotate(wob);
    Kit.drawAvatar(ctx, 0, 0, 30, { look: ME.avatar, facing: k.face, walk: 0.9 });
    ctx.restore();
  }
  if (k.shield > 0) {
    ctx.strokeStyle = `rgba(147,197,253,${0.5 + Math.sin(raceTime * 10) * 0.25})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(k.x, k.y, 24, 0, 7); ctx.stroke();
  }
  {
    const up = k.ai ? 0 : 10;   // your tag sits above your avatar's head
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.font = "bold 11px system-ui, sans-serif";
    const tw = ctx.measureText(k.name).width;
    ctx.fillRect(k.x - tw / 2 - 4, k.y - 36 - up, tw + 8, 15);
    ctx.fillStyle = k.ai ? k.body : "#fff";
    ctx.textAlign = "center";
    ctx.fillText(k.name, k.x, k.y - 25 - up);
  }
}

function drawItemIcon(item, x, y, s) {
  if (item === "turbo") {
    ctx.fillStyle = "#fb923c";
    for (let k = 0; k < 2; k++) {
      ctx.beginPath();
      ctx.moveTo(x - s * 0.4 + k * s * 0.35, y - s * 0.4);
      ctx.lineTo(x + k * s * 0.35, y);
      ctx.lineTo(x - s * 0.4 + k * s * 0.35, y + s * 0.4);
      ctx.lineTo(x - s * 0.2 + k * s * 0.35, y);
      ctx.fill();
    }
  } else if (item === "slick") {
    Kit.brick(ctx, x - s * 0.38, y - s * 0.38, s * 0.76, s * 0.76, "#a3e635", 5);
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillRect(x - s * 0.2, y - s * 0.2, s * 0.14, s * 0.14);
  } else if (item === "shield") {
    ctx.strokeStyle = "#60a5fa"; ctx.lineWidth = s * 0.12;
    ctx.beginPath(); ctx.arc(x, y, s * 0.34, 0, 7); ctx.stroke();
    ctx.fillStyle = "rgba(96,165,250,.35)";
    ctx.beginPath(); ctx.arc(x, y, s * 0.28, 0, 7); ctx.fill();
  }
}

function draw() {
  const p = player();
  let cx = Kit.clamp(p.x - W / 2, 0, WORLD_W - W);
  let cy = Kit.clamp(p.y - H / 2, 0, WORLD_H - H);
  if (shake > 0) { cx += Kit.rand(-4, 4); cy += Kit.rand(-4, 4); }
  ctx.drawImage(world, cx, cy, W, H, 0, 0, W, H);
  ctx.save();
  ctx.translate(-cx, -cy);

  // boost pads
  for (const pad of PADS) {
    ctx.save(); ctx.translate(pad.x, pad.y); ctx.rotate(pad.a);
    Kit.brick(ctx, -26, -20, 52, 40, "#0ea5e9", 6);
    const off = (raceTime * 60) % 16;
    ctx.fillStyle = "rgba(255,255,255,.85)";
    for (let k = -1; k < 2; k++) {
      const bx = k * 14 + off - 8;
      ctx.beginPath(); ctx.moveTo(bx - 5, -12); ctx.lineTo(bx + 5, 0); ctx.lineTo(bx - 5, 12); ctx.lineTo(bx - 1, 0); ctx.fill();
    }
    ctx.restore();
  }
  // item boxes
  for (const b of BOXES) {
    if (b.timer > 0) continue;
    const bob = Math.sin(raceTime * 4 + b.x) * 2;
    ctx.save(); ctx.translate(b.x, b.y + bob); ctx.rotate(raceTime * 1.5 + b.y);
    const hue = (raceTime * 120 + b.x) % 360;
    Kit.brick(ctx, -12, -12, 24, 24, `hsl(${hue} 85% 60%)`, 5);
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillRect(-2, -12, 4, 24);
    ctx.fillRect(-12, -2, 24, 4);
    ctx.restore();
  }
  // slick blocks
  for (const s of slicks) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
    ctx.fillStyle = "rgba(163,230,53,.25)";
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 16, 0, 0, 7); ctx.fill();
    Kit.brick(ctx, -11, -11, 22, 22, "#84cc16", 5);
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillRect(-6, -6, 4, 4);
    ctx.restore();
  }
  for (const pt of particles) {
    ctx.globalAlpha = pt.life / pt.max;
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
  const order = [...karts].sort((a, b) => (a === p) - (b === p));
  for (const k of order) drawKart(k);
  ctx.restore();

  drawUI();
}

function drawUI() {
  const p = player();
  // minimap
  ctx.fillStyle = "rgba(15,17,19,.55)";
  ctx.fillRect(10, 10, mini.width + 12, mini.height + 12);
  ctx.drawImage(mini, 16, 16);
  for (const k of karts) {
    ctx.fillStyle = k.body;
    const s = k === p ? 9 : 7;
    ctx.fillRect(16 + k.x * MINI_S - s / 2, 16 + k.y * MINI_S - s / 2, s, s);
  }
  // item slot
  const ix = W / 2 - 30, iy = 12;
  Kit.brick(ctx, ix, iy, 60, 60, "rgba(15,17,19,.6)", 10);
  ctx.strokeStyle = "rgba(255,255,255,.5)";
  ctx.lineWidth = 2;
  ctx.strokeRect(ix + 4, iy + 4, 52, 52);
  if (p.item) drawItemIcon(p.item, W / 2, iy + 30, 44);
  // place + lap
  const place = places().indexOf(p) + 1;
  ctx.textAlign = "left";
  ctx.font = "900 54px system-ui, sans-serif";
  ctx.fillStyle = "rgba(0,0,0,.5)";
  ctx.fillText(ordinal(place), 22, H - 22);
  ctx.fillStyle = ["#facc15", "#facc15", "#e5e7eb", "#fb923c", "#f2f4f5"][place];
  ctx.fillText(ordinal(place), 18, H - 26);
  ctx.font = "bold 20px system-ui, sans-serif";
  ctx.fillStyle = "#fff";
  ctx.fillText(`Lap ${Kit.clamp(p.lap + 1, 1, LAPS)}/${LAPS}`, 128, H - 32);
  // speedometer
  const sp = Math.max(0, p.speed) / (TOP_SPEED * 1.45);
  ctx.fillStyle = "rgba(0,0,0,.5)";
  ctx.fillRect(W - 200, H - 36, 184, 20);
  ctx.fillStyle = p.boost > 0 ? "#fb923c" : "#22c55e";
  ctx.fillRect(W - 197, H - 33, 178 * sp, 14);

  // countdown / messages
  ctx.textAlign = "center";
  if (state === "countdown") {
    const n = Math.ceil(countdown);
    const text = n > 3 ? "Ready" : String(n);
    ctx.font = "900 96px system-ui, sans-serif";
    ctx.fillStyle = "rgba(0,0,0,.5)";
    ctx.fillText(text, W / 2 + 4, H / 2 + 36);
    ctx.fillStyle = n > 3 ? "#f2f4f5" : ["", "#22c55e", "#facc15", "#ef4444"][n];
    ctx.fillText(text, W / 2, H / 2 + 32);
  } else if (msgT > 0) {
    ctx.globalAlpha = Math.min(1, msgT * 2);
    ctx.font = "900 64px system-ui, sans-serif";
    ctx.fillStyle = "rgba(0,0,0,.5)";
    ctx.fillText(msg, W / 2 + 3, H / 2 - 37);
    ctx.fillStyle = "#facc15";
    ctx.fillText(msg, W / 2, H / 2 - 40);
    ctx.globalAlpha = 1;
  }
}

renderWorld();
reset();
const game = Kit.loop(update, draw);
draw();
Kit.overlay("Kart Dash", "Three laps against three CPU karts.\nBlue pads give a speed burst. Drive through gift boxes for an item:\nTurbo (boost), Slick Block (drop it behind you), Shield (blocks one spin-out).\n\nUp / W: accelerate    Down / S: brake\nLeft / Right or A / D: steer\nSpace / Shift / X: use item", "Start race")
  .then(() => game.start());
</script>
</body>
</html>
