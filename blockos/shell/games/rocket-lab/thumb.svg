<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a1e"/><stop offset=".45" stop-color="#1d3f8a"/><stop offset=".8" stop-color="#5fa8f0"/><stop offset="1" stop-color="#8fd3ff"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset=".5" stop-color="#fb923c"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#ffffff">
    <rect x="30" y="20" width="3" height="3"/><rect x="88" y="44" width="2" height="2"/><rect x="140" y="14" width="3" height="3"/>
    <rect x="330" y="26" width="2" height="2"/><rect x="372" y="60" width="3" height="3"/><rect x="420" y="18" width="2" height="2"/>
    <rect x="60" y="78" width="2" height="2"/><rect x="455" y="90" width="2" height="2"/><rect x="190" y="40" width="2" height="2"/>
  </g>
  <!-- the Moon, blocky -->
  <g>
    <rect x="388" y="30" width="54" height="54" rx="6" fill="#c7c9cf"/>
    <rect x="398" y="42" width="12" height="10" fill="#9a9ca3"/><rect x="420" y="60" width="14" height="12" fill="#9a9ca3"/><rect x="404" y="66" width="8" height="8" fill="#a9abb1"/>
  </g>
  <!-- Earth curving away -->
  <ellipse cx="240" cy="470" rx="420" ry="250" fill="#1f63c6"/>
  <ellipse cx="240" cy="470" rx="420" ry="250" fill="none" stroke="#8fd3ff" stroke-width="8" opacity=".55"/>
  <g fill="#3f9a3a">
    <rect x="40" y="236" width="70" height="20"/><rect x="70" y="226" width="40" height="14"/><rect x="300" y="232" width="90" height="22"/><rect x="340" y="224" width="36" height="12"/>
  </g>
  <g fill="#ffffff" opacity=".85">
    <rect x="140" y="232" width="46" height="10"/><rect x="152" y="226" width="24" height="8"/><rect x="400" y="244" width="40" height="9"/>
  </g>
  <!-- dashed Karman line -->
  <path d="M0 196 Q240 150 480 196" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="10 8" opacity=".85"/>
  <!-- dropped stage tumbling away -->
  <g transform="translate(150 186) rotate(-28)">
    <rect x="-12" y="-24" width="24" height="44" fill="#e5e7eb"/><rect x="-12" y="-6" width="24" height="8" fill="#1f2937"/>
    <rect x="-8" y="20" width="16" height="7" fill="#374151"/>
  </g>
  <!-- the rocket -->
  <g transform="translate(250 120) rotate(14)">
    <path d="M-15 92 L0 168 L15 92 Z" fill="url(#flame)"/>
    <path d="M-9 92 L0 132 L9 92 Z" fill="#fef3c7"/>
    <rect x="-12" y="80" width="24" height="12" fill="#374151"/>
    <rect x="-34" y="40" width="14" height="42" fill="#ef4444"/><rect x="20" y="40" width="14" height="42" fill="#ef4444"/>
    <rect x="-20" y="0" width="40" height="80" fill="#f8fafc"/>
    <rect x="-20" y="50" width="40" height="10" fill="#3b82f6"/>
    <rect x="-22" y="-4" width="44" height="7" fill="#374151"/><rect x="-22" y="-2" width="44" height="3" fill="#facc15"/>
    <rect x="-18" y="-40" width="36" height="36" fill="#d1d5db"/>
    <rect x="-12" y="-34" width="24" height="24" fill="#93c5fd"/>
    <rect x="-6" y="-31" width="12" height="11" fill="#f5cd30"/><rect x="-3" y="-27" width="2" height="3" fill="#111"/><rect x="2" y="-27" width="2" height="3" fill="#111"/>
    <rect x="-8" y="-20" width="16" height="10" fill="#3b82f6"/>
    <path d="M-18 -40 L0 -68 L18 -40 Z" fill="#ef4444"/>
  </g>
</svg>
