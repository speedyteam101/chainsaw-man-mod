  <g stroke="#0b0a12" stroke-width="2">
    <rect x="20" y="20" width="18" height="12" rx="3" fill="#22c55e"/><rect x="42" y="20" width="18" height="12" rx="3" fill="#ef4444"/><rect x="64" y="20" width="18" height="12" rx="3" fill="#facc15"/><rect x="86" y="20" width="18" height="12" rx="3" fill="#3b82f6"/>
