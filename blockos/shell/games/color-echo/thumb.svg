<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <defs>
    <pattern id="studs" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="6" fill="#ffffff" fill-opacity=".03"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="480" height="270" fill="#15131f"/><rect width="480" height="270" fill="url(#studs)"/>
  <!-- ripple rings from the lit pad -->
  <rect x="268" y="85" width="122" height="100" rx="22" fill="none" stroke="#fca5a5" stroke-opacity=".35" stroke-width="3"/>
  <rect x="258" y="75" width="142" height="120" rx="28" fill="none" stroke="#fca5a5" stroke-opacity=".18" stroke-width="3"/>
  <!-- glow -->
  <rect x="280" y="98" width="98" height="76" rx="14" fill="#ef4444" filter="url(#glow)"/>
  <!-- pads -->
  <g stroke="#0b0a12" stroke-width="3">
    <rect x="191" y="14" width="98" height="76" rx="14" fill="#14532d"/>
    <rect x="280" y="98" width="98" height="76" rx="14" fill="#ef4444"/>
    <rect x="191" y="182" width="98" height="76" rx="14" fill="#1e3a8a"/>
    <rect x="102" y="98" width="98" height="76" rx="14" fill="#713f12"/>
  </g>
  <g fill="#ffffff">
    <rect x="198" y="19" width="84" height="8" rx="4" fill-opacity=".12"/>
    <rect x="287" y="103" width="84" height="8" rx="4" fill-opacity=".35"/>
    <rect x="198" y="187" width="84" height="8" rx="4" fill-opacity=".12"/>
    <rect x="109" y="103" width="84" height="8" rx="4" fill-opacity=".12"/>
  </g>
  <!-- studs -->
  <g fill="#ffffff" fill-opacity=".1">
    <circle cx="214" cy="40" r="8"/><circle cx="240" cy="40" r="8"/><circle cx="266" cy="40" r="8"/>
    <circle cx="214" cy="208" r="8"/><circle cx="240" cy="208" r="8"/><circle cx="266" cy="208" r="8"/>
    <circle cx="125" cy="124" r="8"/><circle cx="151" cy="124" r="8"/><circle cx="177" cy="124" r="8"/>
  </g>
  <g fill="#ffffff" fill-opacity=".35"><circle cx="303" cy="124" r="8"/><circle cx="329" cy="124" r="8"/><circle cx="355" cy="124" r="8"/></g>
  <!-- arrows -->
  <g fill="#ffffff" fill-opacity=".55">
    <path d="M240 58l10 14h-20z"/><path d="M240 238l10 -14h-20z"/><path d="M134 146l14 -10v20z"/>
  </g>
  <path d="M346 146l-14 -10v20z" fill="#ffffff"/>
  <!-- centre hub -->
  <rect x="208" y="106" width="64" height="60" rx="12" fill="#2b2840" stroke="#0b0a12" stroke-width="3"/>
  <g fill="#ffffff"><rect x="226" y="118" width="7" height="7"/><rect x="233" y="118" width="7" height="7"/><rect x="240" y="118" width="7" height="7"/><rect x="247" y="125" width="7" height="7"/><rect x="240" y="132" width="7" height="7"/><rect x="233" y="139" width="7" height="7"/><rect x="226" y="146" width="7" height="7"/><rect x="233" y="146" width="7" height="7"/><rect x="240" y="146" width="7" height="7"/><rect x="247" y="146" width="7" height="7"/></g>
  <!-- music notes as blocks -->
  <g fill="#e9d5ff" fill-opacity=".8">
    <rect x="410" y="40" width="14" height="10" rx="3"/><rect x="420" y="14" width="4" height="30"/>
    <rect x="50" y="200" width="14" height="10" rx="3"/><rect x="60" y="174" width="4" height="30"/>
    <rect x="420" y="210" width="12" height="9" rx="3"/><rect x="429" y="188" width="3" height="26"/>
  </g>
