<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brick Snake</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script src="../kit.js"></script>
<script>
"use strict";
const ID = "brick-snake";
const CELL = 24, COLS = 26, ROWS = 20;
const { ctx, W, H } = Kit.stage(COLS * CELL, ROWS * CELL);
const ME = Kit.player().name;
const badge = (id, name, desc) => Kit.badge(ID, id, name, desc);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

let snake, dir, queued, food, score, stepTime, timer, alive;

function reset() {
  snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
  dir = { x: 1, y: 0 };
  queued = [];
  score = 0;
  stepTime = 0.12;
  timer = 0;
  alive = true;
  placeFood();
  updateHud();
}

function placeFood() {
  do {
    food = { x: Kit.randInt(0, COLS - 1), y: Kit.randInt(0, ROWS - 1), color: Kit.pick(["#ef4444", "#facc15", "#3b82f6", "#a855f7"]) };
  } while (snake.some((s) => s.x === food.x && s.y === food.y));
}

function updateHud() {
  Kit.hud(`Score ${score}<small>${esc(ME)} · Best ${Kit.best(ID) ?? 0}</small>`);
}

const DIRS = {
  ArrowUp: { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
  ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
  ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
  ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 },
};
Kit.onKey((code) => {
  const d = DIRS[code];
  if (!d || !alive) return;
  const lastDir = queued.length ? queued[queued.length - 1] : dir;
  if (d.x === -lastDir.x && d.y === -lastDir.y) return; // can't reverse into yourself
  if (queued.length < 3) queued.push(d);
});

function step() {
  if (queued.length) dir = queued.shift();
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
  const hitSelf = snake.slice(0, -1).some((s) => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return die();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    stepTime = Math.max(0.055, stepTime - 0.003);
    Kit.sfx("coin");
    if (snake.length >= 10) badge("length-10", "Growing Up", "Grow your snake to 10 bricks long.");
    if (stepTime <= 0.055) badge("top-speed", "Top Speed", "Eat enough bricks to reach full speed.");
    if (score >= 500) badge("score-500", "Brick Python", "Score 500 in one game.");
    if ((head.x === 0 || head.x === COLS - 1) && (head.y === 0 || head.y === ROWS - 1)) badge("cornered", "Cornered", "Eat a brick tucked in a corner of the board.");
    placeFood();
    updateHud();
  } else {
    snake.pop();
  }
}

async function die() {
  alive = false;
  game.stop();
  Kit.sfx("lose");
  const best = Kit.finish(ID, score);
  await Kit.overlay("Wipeout!", `Score: ${score}\nBest: ${best}`, "Play again");
  reset();
  game.start();
}

function update(dt) {
  timer += dt;
  while (alive && timer >= stepTime) {
    timer -= stepTime;
    step();
  }
}

function draw() {
  ctx.fillStyle = "#14251a";
  ctx.fillRect(0, 0, W, H);
  // baseplate studs
  ctx.fillStyle = "rgba(255,255,255,.04)";
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      ctx.beginPath();
      ctx.arc(x * CELL + CELL / 2, y * CELL + CELL / 2, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  Kit.brick(ctx, food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6, food.color);
  snake.forEach((s, i) => {
    Kit.brick(ctx, s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, i === 0 ? "#22c55e" : i % 2 ? "#16a34a" : "#15803d", 5);
  });
  // eyes
  const h = snake[0];
  ctx.fillStyle = "#000";
  const cx = h.x * CELL + CELL / 2 + dir.x * 4, cy = h.y * CELL + CELL / 2 + dir.y * 4;
  // two eyes side by side, perpendicular to the direction of travel
  for (const side of [-1, 1]) ctx.fillRect(cx + dir.y * side * 5 - 2, cy + dir.x * side * 5 - 2, 4, 4);
}

const game = Kit.loop(update, draw);
reset();
draw();
Kit.overlay("Brick Snake", "Eat the bricks to grow.\nDon't hit the walls or yourself.\n\nArrows / WASD to steer", "Play").then(() => game.start());
</script>
</body>
</html>
