<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obby Run</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script src="../kit.js"></script>
<script>
"use strict";
const ID = "obby-run";
const T = 32;                    // tile size (px)
const ROWS = 17;                 // world height in tiles
const WORLD_H = ROWS * T;
const LAVA_Y = 15 * T + 12;      // lava surface
const { ctx, W, H } = Kit.stage(960, 540);
const FONT = "'Noto Sans', 'DejaVu Sans', 'Segoe UI', sans-serif";
const ME = Kit.player();
let padBounces = 0, stageDeaths0 = 0;

// Player tuning
const PW = 22, PH = 30;
const RUN = 250, GRAV = 1900, JUMP = 640, PAD_JUMP = 1050, MAX_FALL = 900;
const COYOTE = 0.1, BUFFER = 0.12;

// ---------- Stage building blocks (all in tile units) ----------
const plat = (x, y, w, h = 1) => ({ kind: "plat", x, y, w, h });
const kill = (x, y, w = 1, h = 1) => ({ kind: "kill", x, y, w, h });
const pad = (x, y) => ({ kind: "pad", x, y });
const flag = (x, y) => ({ kind: "flag", x, y });
const goal = (x, y) => ({ kind: "goal", x, y });
// Moving platform: travels (dx, dy) tiles away from its start and back.
const mover = (x, y, w, dx, dy, period = 3) => ({ kind: "mover", x, y, w, dx, dy, period });
// Blinking platform: two phases (0/1) that alternate being solid.
const blink = (x, y, w, phase) => ({ kind: "blink", x, y, w, phase });
// Spinning kill bar centred on a tile, arm length in tiles, speed in rad/s.
const spin = (x, y, arm, speed) => ({ kind: "spin", x, y, arm, speed });

const STAGES = [
  {
    name: "First Steps", w: 104, spawn: [2, 11],
    sky: ["#4fb8f5", "#c8ecff"], hills: "#8fd0f0", brick: "#22c55e",
    items: [
      plat(0, 12, 10, 5),
      plat(13, 12, 4, 5),
      plat(20, 11, 3),
      plat(26, 10, 3),
      plat(32, 12, 7, 5), kill(35, 11), flag(37, 11),
      plat(42, 12, 3, 5), pad(43, 11),
      plat(47, 6, 2, 11),
      plat(52, 8, 4),
      mover(58, 8, 3, 5, 0, 3.2),
      plat(68, 8, 4), flag(69, 7),
      plat(75, 10, 5), kill(77, 9),
      plat(83, 9, 2),
      plat(88, 8, 2),
      plat(93, 10, 10, 7), goal(98, 9),
    ],
  },
  {
    name: "Moving Parts", w: 108, spawn: [2, 11],
    sky: ["#ff9a62", "#ffe1a8"], hills: "#f2b48a", brick: "#3b82f6",
    items: [
      plat(0, 12, 8, 5),
      mover(10, 12, 3, 6, 0, 3.4),
      plat(22, 12, 4, 5),
      mover(28, 12, 3, 0, -5, 3.2),
      plat(33, 7, 5), flag(35, 6),
      blink(40, 7, 2, 0), blink(44, 7, 2, 1), blink(48, 7, 2, 0), blink(52, 7, 2, 1),
      plat(56, 8, 7, 9), spin(59, 5, 2.2, 1.6),
      plat(66, 8, 4), flag(67, 7),
      mover(73, 8, 3, 7, 0, 3.6),
      plat(86, 8, 3),
      spin(90.5, 7, 2.1, -1.9),
      plat(93, 9, 3),
      plat(99, 10, 9, 7), goal(103, 9),
    ],
  },
  {
    name: "Lava Pillars", w: 113, spawn: [2, 11],
    sky: ["#5b3a8f", "#e2789a"], hills: "#8a4f8f", brick: "#fb923c",
    items: [
      plat(0, 12, 7, 5),
      plat(10, 11, 1, 6), plat(14, 10, 1, 7), plat(18, 11, 1, 6), plat(22, 9, 1, 8),
      plat(26, 9, 7, 8), spin(29, 6, 2.2, 1.8), flag(31, 8),
      plat(36, 10, 14, 7), plat(38, 6, 10, 1),
      kill(40, 9), kill(43, 9), kill(46, 9), flag(49, 9),
      mover(52, 10, 2, 0, -4, 2.8),
      plat(56, 5, 3),
      blink(61, 5, 2, 0), blink(65, 4, 2, 1), blink(69, 5, 2, 0),
      plat(73, 10, 3, 7), pad(74, 9),
      plat(78, 3, 5), flag(80, 2),
      mover(86, 5, 3, 5, 0, 3.0),
      plat(97, 7, 3),
      plat(103, 9, 10, 8), spin(105, 6, 2.2, 2.0), goal(108, 8),
    ],
  },
  {
    name: "The Gauntlet", w: 122, spawn: [2, 11],
    sky: ["#14112b", "#5a1f3a"], hills: "#2c1d45", brick: "#a855f7",
    items: [
      plat(0, 12, 6, 5),
      mover(8, 12, 2, 0, -5, 3.0),
      plat(12, 6, 3),
      spin(16.5, 6, 2.1, 2.1),
      plat(19, 6, 3), flag(20, 5),
      blink(25, 7, 2, 1), blink(29, 8, 2, 0), blink(33, 9, 2, 1),
      plat(37, 10, 3, 7), pad(38, 9),
      plat(42, 4, 2, 13),
      mover(46, 4, 3, 6, 0, 3.4),
      plat(58, 4, 3), flag(59, 3),
      plat(63, 6, 2), plat(68, 8, 2),
      plat(72, 10, 9, 7), kill(75, 9), spin(78, 7, 2.2, -2.1),
      plat(84, 9, 1, 8), plat(88, 8, 1, 9), plat(92, 7, 1, 10),
      plat(95, 7, 4), flag(96, 6),
      mover(101, 7, 3, 0, 4, 3.0),
      plat(106, 11, 4, 6), pad(107, 10),
      plat(112, 3, 8), goal(116, 2),
    ],
  },
];

// ---------- World state ----------
let stageIndex, stage, solids, movers, blinks, spinners, pads, flags, kills, goalRect;
let player, checkpoint, flagIndex, camX, camY, worldT, runTime, stageStart, deaths;
let state = "menu", stateT = 0, particles = [], bannerT = 0, splitText = "", lastHud = "";

function buildStage(i) {
  stageIndex = i;
  stage = STAGES[i];
  solids = []; movers = []; blinks = []; spinners = []; pads = []; flags = []; kills = [];
  for (const it of stage.items) {
    const x = it.x * T, y = it.y * T;
    switch (it.kind) {
      case "plat": solids.push({ x, y, w: it.w * T, h: it.h * T }); break;
      case "kill": kills.push({ x, y, w: it.w * T, h: it.h * T }); break;
      case "pad": pads.push({ x: x + 3, y: y + T - 10, w: T - 6, h: 10, squish: 0 }); break;
      case "flag": flags.push({ x: x + 12, y: y + T, on: false, wave: 0 }); break;
      case "goal": goalRect = { x, y: y + T - 3 * T, w: 3 * T, h: 3 * T }; break;
      case "mover":
        movers.push({ bx: x, by: y, x, y, px: x, py: y, w: it.w * T, h: 20,
          dx: it.dx * T, dy: it.dy * T, period: it.period, moving: true });
        break;
      case "blink": blinks.push({ x, y, w: it.w * T, h: T, phase: it.phase, on: true, warn: false }); break;
      case "spin": spinners.push({ cx: x + T / 2, cy: y + T / 2, L: it.arm * T, speed: it.speed, a: 0 }); break;
    }
  }
  flagIndex = -1;
  checkpoint = { x: stage.spawn[0] * T + 5, y: (stage.spawn[1] + 1) * T - PH };
  spawnPlayer();
  camX = Kit.clamp(player.x - W * 0.4, 0, stage.w * T - W);
  camY = WORLD_H - H;
  bannerT = 2.4;
  stageStart = runTime;
  stageDeaths0 = deaths;
}

function spawnPlayer() {
  player = { x: checkpoint.x, y: checkpoint.y, w: PW, h: PH, vx: 0, vy: 0,
    onGround: true, ground: null, coyote: 0, buffer: 0, padded: false,
    face: 1, look: 1, run: 0, sx: 1, sy: 1 };
}

function startRun() {
  runTime = 0;
  deaths = 0;
  worldT = 0;
  particles = [];
  buildStage(0);
  state = "play";
  lastHud = "";
}

// ---------- Helpers ----------
const overlap = (a, b) => a.x < b.x + b.w - 0.01 && a.x + a.w > b.x + 0.01 && a.y < b.y + b.h - 0.01 && a.y + a.h > b.y + 0.01;

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = (c) => Math.round(Kit.clamp(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt, 0, 255));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

function fmt(s) {
  if (s == null) return "--";
  const m = Math.floor(s / 60), r = s - m * 60;
  return `${m}:${r < 10 ? "0" : ""}${r.toFixed(2)}`;
}

function burst(x, y, colors, n, power = 260) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Kit.rand(0.3, 1) * power;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * 0.4,
      life: Kit.rand(0.5, 1), max: 1, size: Kit.rand(4, 8), color: Kit.pick(colors) });
  }
}

const jumpHeld = () => Kit.key("Space") || Kit.key("ArrowUp") || Kit.key("KeyW");

Kit.onKey((code) => {
  if (state !== "play") return;
  if (code === "Space" || code === "ArrowUp" || code === "KeyW") player.buffer = BUFFER;
  if (code === "KeyR") die();
});

// ---------- Update ----------
function updateWorld(dt) {
  worldT += dt;
  for (const m of movers) {
    m.px = m.x; m.py = m.y;
    const k = 0.5 - 0.5 * Math.cos((worldT / m.period) * Math.PI * 2);
    m.x = m.bx + m.dx * k;
    m.y = m.by + m.dy * k;
  }
  for (const b of blinks) {
    const local = (worldT + b.phase * 1.5) % 3;
    b.on = local < 1.9;
    b.warn = local > 1.45 && b.on;
  }
  for (const s of spinners) s.a = worldT * s.speed;
  for (const p of pads) p.squish = Math.max(0, p.squish - dt * 4);
  for (const f of flags) f.wave += dt;
}

function updatePlayer(dt) {
  const p = player;
  const active = solids.concat(movers, blinks.filter((b) => b.on));

  // Ride moving platforms.
  if (p.ground && p.ground.moving) {
    p.x += p.ground.x - p.ground.px;
    p.y += p.ground.y - p.ground.py;
  }
  if (p.ground && p.ground.on === false) p.ground = null;
  // Anything that moved into the player pushes it out along the shortest axis.
  for (const s of active) {
    if (!overlap(p, s)) continue;
    const l = p.x + p.w - s.x, r = s.x + s.w - p.x, u = p.y + p.h - s.y, d = s.y + s.h - p.y;
    const m = Math.min(l, r, u, d);
    if (m === u) { p.y = s.y - p.h; p.vy = Math.min(p.vy, 0); }
    else if (m === d) { p.y = s.y + s.h; p.vy = Math.max(p.vy, 0); }
    else if (m === l) p.x = s.x - p.w;
    else p.x = s.x + s.w;
  }

  // Horizontal input
  const dir = (Kit.key("ArrowRight") || Kit.key("KeyD") ? 1 : 0) - (Kit.key("ArrowLeft") || Kit.key("KeyA") ? 1 : 0);
  if (dir) {
    const turning = Math.sign(p.vx) === -dir;
    p.vx += dir * (p.onGround ? 2600 : 1700) * (turning ? 1.8 : 1) * dt;
    p.face = dir;
  } else {
    const dec = (p.onGround ? 2800 : 700) * dt;
    p.vx = Math.abs(p.vx) <= dec ? 0 : p.vx - Math.sign(p.vx) * dec;
  }
  p.vx = Kit.clamp(p.vx, -RUN, RUN);

  // Jump with coyote time and input buffering
  p.coyote = p.onGround ? COYOTE : p.coyote - dt;
  p.buffer -= dt;
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -JUMP;
    p.buffer = 0;
    p.coyote = 0;
    p.padded = false;
    p.onGround = false;
    p.ground = null;
    p.sx = 0.75; p.sy = 1.3;
    Kit.sfx("jump");
  }

  let g = GRAV;
  if (p.vy < 0 && !jumpHeld() && !p.padded) g *= 2.4;           // short hop on release
  else if (Math.abs(p.vy) < 90 && jumpHeld()) g *= 0.55;        // floaty apex
  p.vy = Math.min(p.vy + g * dt, MAX_FALL);
  if (p.vy >= 0) p.padded = false;

  // Move X, then Y, resolving against solids
  p.x += p.vx * dt;
  for (const s of active) {
    if (!overlap(p, s)) continue;
    p.x = p.x + p.w / 2 < s.x + s.w / 2 ? s.x - p.w : s.x + s.w;
    p.vx = 0;
  }
  p.x = Math.max(0, p.x);

  const wasGround = p.onGround, fallSpeed = p.vy;
  p.onGround = false;
  p.ground = null;
  const prevY = p.y;
  p.y += p.vy * dt;
  for (const s of active) {
    if (!overlap(p, s)) continue;
    // Decide by where we came from, so a sideways graze never teleports us through a block.
    const fromAbove = prevY + p.h <= s.y + 6 || (prevY + p.h / 2 < s.y + s.h / 2 && p.vy >= 0);
    if (fromAbove) {
      p.y = s.y - p.h;
      p.onGround = true;
      p.ground = s;
    } else {
      p.y = s.y + s.h;
    }
    p.vy = 0;
  }
  if (p.onGround && !wasGround && fallSpeed > 350) {
    p.sx = 1.25; p.sy = 0.78;
    burst(p.x + p.w / 2, p.y + p.h, ["rgba(255,255,255,.7)"], 5, 90);
  }

  // Squash/stretch and animation
  p.sx += (1 - p.sx) * Math.min(1, dt * 12);
  p.sy += (1 - p.sy) * Math.min(1, dt * 12);
  p.run = p.onGround && Math.abs(p.vx) > 20 ? p.run + dt * Math.abs(p.vx) / 18 : 0;
  p.look += (p.face - p.look) * Math.min(1, dt * 3);

  // Jump pads
  for (const pd of pads) {
    if (overlap(p, pd) && p.vy >= 0) {
      p.vy = -PAD_JUMP;
      p.padded = true;
      p.onGround = false;
      p.ground = null;
      p.coyote = 0;
      p.sx = 0.7; p.sy = 1.4;
      pd.squish = 1;
      Kit.sfx("jump");
      if (++padBounces === 10) Kit.badge(ID, "bounce-house", "Bounce House", "Launched off 10 jump pads.");
      burst(pd.x + pd.w / 2, pd.y, ["#facc15", "#fde68a"], 8, 160);
    }
  }

  // Hazards
  if (p.y + p.h > LAVA_Y + 4) return die();
  const hit = { x: p.x + 3, y: p.y + 3, w: p.w - 6, h: p.h - 5 };
  for (const k of kills) if (overlap(hit, k)) return die();
  for (const s of spinners) {
    const c = Math.cos(s.a), sn = Math.sin(s.a);
    for (let d = -s.L; d <= s.L; d += 6) {
      const x = s.cx + c * d, y = s.cy + sn * d;
      if (x > hit.x - 4 && x < hit.x + hit.w + 4 && y > hit.y - 4 && y < hit.y + hit.h + 4) return die();
    }
  }

  // Checkpoints
  flags.forEach((f, i) => {
    if (i <= flagIndex) return;
    if (overlap(p, { x: f.x - 14, y: f.y - 2 * T, w: T, h: 2 * T })) {
      for (let j = 0; j <= i; j++) flags[j].on = true;
      flagIndex = i;
      checkpoint = { x: f.x - 4, y: f.y - PH };
      Kit.sfx("score");
      burst(f.x + 10, f.y - 50, ["#22c55e", "#86efac", "#ffffff"], 14, 200);
    }
  });

  if (overlap(p, goalRect)) clearStage();
}

function die() {
  if (state !== "play") return;
  state = "dead";
  stateT = 0.85;
  deaths++;
  Kit.sfx("hit");
  const p = player;
  burst(p.x + p.w / 2, p.y + p.h / 2, ["#facc15", "#3b82f6", "#1e3a8a", "#ff7a1a"], 22, 300);
}

function clearStage() {
  state = "clear";
  stateT = 1.8;
  splitText = fmt(runTime - stageStart);
  Kit.sfx("win");
  if (stageIndex === 0) Kit.badge(ID, "first-steps", "First Steps", "Cleared the first obby stage.");
  if (deaths === stageDeaths0) Kit.badge(ID, "clean-stage", "Not a Scratch", "Cleared a stage without dying once.");
  burst(goalRect.x + goalRect.w / 2, goalRect.y + 20, ["#facc15", "#22c55e", "#3b82f6", "#ec4899", "#ffffff"], 40, 380);
}

async function winRun() {
  state = "won";
  game.stop();
  const score = Number(runTime.toFixed(2));
  const best = Kit.finish(ID, score, true);
  Kit.badge(ID, "obby-complete", "Obby Champion", "Finished all 4 Obby Run stages.");
  if (deaths === 0) Kit.badge(ID, "deathless", "Lava Proof", "Finished the whole obby without a single death.");
  if (score < 120) Kit.badge(ID, "speedrunner", "Speedrunner", "Finished the whole obby in under 2 minutes.");
  updateHud(true);
  await Kit.overlay("Obby Complete!", `Time: ${fmt(score)}\nDeaths: ${deaths}\nBest: ${fmt(best)}`, "Play again");
  startRun();
  game.start();
}

function updateCamera(dt, snap) {
  const p = player;
  const tx = Kit.clamp(p.x + p.w / 2 - W * 0.42 + p.look * 60, 0, stage.w * T - W);
  const ty = Kit.clamp(p.y + p.h / 2 - H * 0.58, -420, WORLD_H - H);
  const k = snap ? 1 : 1 - Math.exp(-dt * 6);
  camX += (tx - camX) * k;
  camY += (ty - camY) * (snap ? 1 : 1 - Math.exp(-dt * 4));
}

function updateParticles(dt) {
  for (const q of particles) {
    q.life -= dt;
    q.vy += 900 * dt;
    q.x += q.vx * dt;
    q.y += q.vy * dt;
  }
  particles = particles.filter((q) => q.life > 0);
}

function updateHud(force) {
  const best = Kit.best(ID);
  const html = `${fmt(runTime)}<small>Stage ${stageIndex + 1}/${STAGES.length} &middot; Deaths ${deaths} &middot; Best ${fmt(best)}</small>`;
  if (force || html !== lastHud) { Kit.hud(html); lastHud = html; }
}

function update(dt) {
  dt = Math.max(0, dt); // the first frame after start() can report a tiny negative dt
  updateParticles(dt);
  bannerT = Math.max(0, bannerT - dt);
  if (state === "play") {
    runTime += dt;
    updateWorld(dt);
    updatePlayer(dt);
    updateCamera(dt);
  } else if (state === "dead") {
    runTime += dt;
    updateWorld(dt);
    stateT -= dt;
    if (stateT <= 0) {
      spawnPlayer();
      state = "play";
      burst(player.x + PW / 2, player.y + PH / 2, ["#ffffff", "#bae6fd"], 10, 120);
    }
  } else if (state === "clear") {
    updateWorld(dt);
    updateCamera(dt);
    stateT -= dt;
    if (stateT <= 0) {
      if (stageIndex + 1 < STAGES.length) { buildStage(stageIndex + 1); state = "play"; }
      else return winRun();
    }
  }
  updateHud();
}

// ---------- Drawing ----------
function hash(i) {
  const s = Math.sin(i * 127.1 + stageIndex * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, stage.sky[0]);
  g.addColorStop(1, stage.sky[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Far blocky towers (parallax)
  const par = 0.25, bw = 70;
  const off = camX * par;
  const first = Math.floor(off / bw) - 1;
  ctx.fillStyle = stage.hills;
  ctx.globalAlpha = 0.55;
  for (let i = first; i < first + W / bw + 3; i++) {
    const h = 60 + hash(i) * 170;
    const x = i * bw - off;
    ctx.fillRect(x, H - 80 - h - camY * 0.2, bw - 8, h + 200);
    ctx.fillRect(x + 10, H - 92 - h - camY * 0.2, 16, 12);
    ctx.fillRect(x + bw - 34, H - 92 - h - camY * 0.2, 16, 12);
  }
  ctx.globalAlpha = 1;

  // Blocky clouds
  ctx.fillStyle = "rgba(255,255,255,.55)";
  const cOff = camX * 0.1 + worldT * 8, cw = 260;
  const cFirst = Math.floor(cOff / cw) - 1;
  for (let i = cFirst; i < cFirst + W / cw + 3; i++) {
    if (hash(i + 50) < 0.35) continue;
    const x = i * cw - cOff, y = 40 + hash(i + 90) * 130 - camY * 0.1;
    ctx.fillRect(x, y, 90, 22);
    ctx.fillRect(x + 20, y - 16, 44, 18);
    ctx.fillRect(x + 54, y - 8, 30, 10);
  }
}

function studs(x, y, w, color) {
  ctx.fillStyle = color;
  for (let sx = x; sx + T <= x + w + 0.5; sx += T) {
    ctx.beginPath();
    ctx.roundRect(sx + 8, y - 4, 16, 6, 2);
    ctx.fill();
  }
}

function drawBlock(s, color) {
  if (s.h > T) {
    ctx.fillStyle = shade(color, -0.35);
    ctx.fillRect(s.x + 2, s.y + T / 2, s.w - 4, s.h - T / 2);
    ctx.fillStyle = "rgba(0,0,0,.18)";
    for (let y = s.y + T * 2; y < s.y + s.h; y += T) ctx.fillRect(s.x + 2, y, s.w - 4, 3);
    for (let y = s.y + T; y < s.y + s.h; y += T)
      for (let x = s.x + ((y / T) % 2 ? T / 2 : T); x < s.x + s.w - 4; x += T) ctx.fillRect(x, y, 3, T);
  }
  studs(s.x, s.y, s.w, shade(color, 0.15));
  Kit.brick(ctx, s.x, s.y, s.w, T, color, 5);
}

function drawMover(m) {
  // rail showing the path
  ctx.strokeStyle = "rgba(255,255,255,.28)";
  ctx.lineWidth = 4;
  ctx.setLineDash([8, 10]);
  ctx.beginPath();
  ctx.moveTo(m.bx + m.w / 2, m.by + m.h / 2);
  ctx.lineTo(m.bx + m.dx + m.w / 2, m.by + m.dy + m.h / 2);
  ctx.stroke();
  ctx.setLineDash([]);
  studs(m.x, m.y, m.w, "#5eead4");
  Kit.brick(ctx, m.x, m.y, m.w, m.h, "#14b8a6", 5);
  ctx.fillStyle = "rgba(255,255,255,.75)";
  const cx = m.x + m.w / 2, cy = m.y + m.h / 2;
  if (m.dx) {
    ctx.fillRect(cx - 14, cy - 2, 28, 4);
    ctx.beginPath(); ctx.moveTo(cx - 20, cy); ctx.lineTo(cx - 12, cy - 6); ctx.lineTo(cx - 12, cy + 6); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 20, cy); ctx.lineTo(cx + 12, cy - 6); ctx.lineTo(cx + 12, cy + 6); ctx.fill();
  } else {
    ctx.fillRect(cx - 2, cy - 7, 4, 14);
    ctx.beginPath(); ctx.moveTo(cx - 7, cy - 4); ctx.lineTo(cx, cy - 10); ctx.lineTo(cx + 7, cy - 4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx - 7, cy + 4); ctx.lineTo(cx, cy + 10); ctx.lineTo(cx + 7, cy + 4); ctx.fill();
  }
}

function drawBlink(b) {
  if (!b.on) {
    ctx.strokeStyle = "rgba(255,255,255,.35)";
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
    ctx.setLineDash([]);
    return;
  }
  ctx.globalAlpha = b.warn && Math.floor(worldT * 14) % 2 ? 0.45 : 1;
  studs(b.x, b.y, b.w, "#fde68a");
  Kit.brick(ctx, b.x, b.y, b.w, b.h, "#facc15", 5);
  ctx.fillStyle = "rgba(120,80,0,.35)";
  ctx.fillRect(b.x + b.w / 2 - 6, b.y + 10, 12, 12);
  ctx.globalAlpha = 1;
}

function drawKill(k) {
  const pulse = 0.35 + 0.25 * Math.sin(worldT * 6 + k.x);
  ctx.fillStyle = `rgba(255,70,70,${pulse})`;
  ctx.beginPath();
  ctx.roundRect(k.x - 4, k.y - 4, k.w + 8, k.h + 8, 8);
  ctx.fill();
  Kit.brick(ctx, k.x, k.y, k.w, k.h, "#dc2626", 5);
  ctx.strokeStyle = "rgba(255,220,220,.8)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(k.x + 9, k.y + 9); ctx.lineTo(k.x + k.w - 9, k.y + k.h - 9);
  ctx.moveTo(k.x + k.w - 9, k.y + 9); ctx.lineTo(k.x + 9, k.y + k.h - 9);
  ctx.stroke();
}

function drawSpinner(s) {
  ctx.save();
  ctx.translate(s.cx, s.cy);
  ctx.rotate(s.a);
  ctx.fillStyle = "rgba(255,60,60,.25)";
  ctx.beginPath();
  ctx.roundRect(-s.L - 5, -11, s.L * 2 + 10, 22, 10);
  ctx.fill();
  Kit.brick(ctx, -s.L, -6, s.L * 2, 12, "#ef4444", 5);
  ctx.restore();
  Kit.brick(ctx, s.cx - 11, s.cy - 11, 22, 22, "#6b7280", 5);
  ctx.fillStyle = "#d1d5db";
  ctx.fillRect(s.cx - 3, s.cy - 3, 6, 6);
}

function drawPad(pd) {
  const sq = pd.squish;
  Kit.brick(ctx, pd.x, pd.y + 2 + sq * 4, pd.w, pd.h - 2 - sq * 4, "#22c55e", 3);
  ctx.fillStyle = "#facc15";
  ctx.fillRect(pd.x + 2, pd.y + sq * 4, pd.w - 4, 4);
  // floating chevrons hint "up"
  const a = 0.4 + 0.4 * Math.sin(worldT * 5);
  ctx.strokeStyle = `rgba(250,204,21,${a})`;
  ctx.lineWidth = 3;
  for (let i = 0; i < 2; i++) {
    const y = pd.y - 10 - i * 10 - ((worldT * 20) % 10);
    ctx.beginPath();
    ctx.moveTo(pd.x + 6, y + 6); ctx.lineTo(pd.x + pd.w / 2, y); ctx.lineTo(pd.x + pd.w - 6, y + 6);
    ctx.stroke();
  }
}

function drawFlag(f) {
  ctx.fillStyle = "#e5e7eb";
  ctx.fillRect(f.x - 2, f.y - 60, 4, 60);
  Kit.brick(ctx, f.x - 8, f.y - 6, 16, 6, "#6b7280", 2);
  const color = f.on ? "#22c55e" : "#9ca3af";
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(f.x + 2, f.y - 60);
  for (let i = 0; i <= 4; i++) ctx.lineTo(f.x + 2 + i * 7, f.y - 60 + Math.sin(f.wave * 6 + i) * 2.5);
  for (let i = 4; i >= 0; i--) ctx.lineTo(f.x + 2 + i * 7, f.y - 40 + Math.sin(f.wave * 6 + i) * 2.5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(f.x - 4, f.y - 64, 8, 6);
}

function drawGoal() {
  const g = goalRect;
  const glow = 0.25 + 0.15 * Math.sin(worldT * 4);
  ctx.fillStyle = `rgba(250,204,21,${glow})`;
  ctx.fillRect(g.x + 8, g.y + 12, g.w - 16, g.h - 12);
  // checkered posts and banner
  const sq = 8;
  for (const px of [g.x, g.x + g.w - 12]) {
    for (let y = g.y; y < g.y + g.h; y += sq)
      for (let x = 0; x < 12; x += 6) {
        ctx.fillStyle = ((y - g.y) / sq + x / 6) % 2 ? "#111827" : "#f9fafb";
        ctx.fillRect(px + x, y, 6, sq);
      }
  }
  for (let x = g.x; x < g.x + g.w; x += sq)
    for (let r = 0; r < 2; r++) {
      ctx.fillStyle = ((x - g.x) / sq + r) % 2 ? "#111827" : "#f9fafb";
      ctx.fillRect(x, g.y + r * sq, sq, sq);
    }
}

function drawPlayer() {
  // The player's own BlockOS avatar; the hitbox (PW x PH) is unchanged.
  const p = player;
  ctx.save();
  ctx.translate(Math.round(p.x + p.w / 2), Math.round(p.y + p.h));
  ctx.scale(p.sx, p.sy);
  Kit.drawAvatar(ctx, 0, 0, 36, { look: ME.avatar, facing: p.face, walk: p.run, air: !p.onGround, name: ME.name });
  ctx.restore();
}

function drawLava() {
  const x0 = camX - 10, x1 = camX + W + 10;
  const g = ctx.createLinearGradient(0, LAVA_Y - 8, 0, LAVA_Y + 80);
  g.addColorStop(0, "#ffd23f");
  g.addColorStop(0.15, "#ff7a1a");
  g.addColorStop(1, "#b3121b");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x0, camY + H + 10);
  for (let x = x0; x <= x1; x += 12) {
    ctx.lineTo(x, LAVA_Y + Math.sin(x * 0.03 + worldT * 2) * 4 + Math.sin(x * 0.071 - worldT * 3) * 2);
  }
  ctx.lineTo(x1, camY + H + 10);
  ctx.closePath();
  ctx.fill();
  // bubbles
  ctx.fillStyle = "rgba(255,230,120,.7)";
  for (let i = Math.floor(x0 / 46); i < x1 / 46; i++) {
    const r = hash(i * 7.3);
    const ph = (worldT * (0.4 + r * 0.5) + r * 10) % 1;
    ctx.beginPath();
    ctx.arc(i * 46 + r * 30, LAVA_Y + 30 - ph * 26, 2 + r * 4 * (1 - ph), 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawProgress() {
  const bx = 16, by = 16, bw = 260;
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.beginPath(); ctx.roundRect(bx - 8, by - 8, bw + 16, 42, 8); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = `800 13px ${FONT}`;
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillText(`STAGE ${stageIndex + 1}  ${stage.name.toUpperCase()}`, bx, by - 2);
  ctx.fillStyle = "rgba(255,255,255,.2)";
  ctx.fillRect(bx, by + 18, bw, 8);
  const pr = Kit.clamp(player.x / (goalRect.x), 0, 1);
  ctx.fillStyle = "#22c55e";
  ctx.fillRect(bx, by + 18, bw * pr, 8);
  for (const f of flags) {
    ctx.fillStyle = f.on ? "#86efac" : "#e5e7eb";
    ctx.fillRect(bx + bw * Kit.clamp(f.x / goalRect.x, 0, 1) - 1, by + 15, 3, 14);
  }
}

function drawBanner(title, sub, alpha) {
  ctx.globalAlpha = alpha;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `900 46px ${FONT}`;
  ctx.fillStyle = "rgba(0,0,0,.45)";
  ctx.fillText(title, W / 2 + 3, H * 0.3 + 4);
  ctx.fillStyle = "#fff";
  ctx.fillText(title, W / 2, H * 0.3);
  ctx.font = `800 22px ${FONT}`;
  ctx.fillStyle = "#facc15";
  ctx.fillText(sub, W / 2, H * 0.3 + 44);
  ctx.globalAlpha = 1;
}

function draw() {
  drawSky();
  ctx.save();
  ctx.translate(-Math.round(camX), -Math.round(camY));
  for (const s of solids) drawBlock(s, stage.brick);
  for (const b of blinks) drawBlink(b);
  for (const m of movers) drawMover(m);
  for (const k of kills) drawKill(k);
  for (const pd of pads) drawPad(pd);
  for (const f of flags) drawFlag(f);
  drawGoal();
  if (state !== "dead") drawPlayer();
  for (const s of spinners) drawSpinner(s);
  for (const q of particles) {
    ctx.globalAlpha = Kit.clamp(q.life * 2, 0, 1);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  drawLava();
  ctx.restore();

  drawProgress();
  if (bannerT > 0 && state === "play")
    drawBanner(`Stage ${stageIndex + 1}`, stage.name, Math.min(1, bannerT));
  if (state === "clear")
    drawBanner("Stage Clear!", `Split ${splitText}`, Math.min(1, stateT * 2));
}

const game = Kit.loop(update, draw);
startRun();
state = "menu";
updateCamera(0, true);
draw();
updateHud(true);
Kit.overlay(
  "Obby Run",
  "Race through 4 obstacle stages over the lava.\nTouch flags to save your spot. Lava, red bricks and spinners send you back.\nFastest total time wins.\n\nArrows / WASD to move\nSpace / Up / W to jump (hold for higher)\nR to respawn at your flag",
  "Play"
).then(() => {
  startRun();
  game.start();
});
</script>
</body>
