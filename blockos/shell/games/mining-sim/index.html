<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mining Sim</title>
<link rel="stylesheet" href="../kit.css">
<style>
  .shop { max-width: 560px; }
  .shop h2 { margin: 14px 0 6px; font-size: 16px; text-align: left; color: #facc15; }
  .shop .row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; background: #2b2f35; margin: 5px 0; text-align: left; }
  .shop .row .sw { width: 26px; height: 26px; border-radius: 6px; flex: none; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
  .shop .row .info { flex: 1; font-size: 14px; }
  .shop .row .info small { display: block; color: #a7adb4; font-size: 12px; }
  .shop .row .kit-btn { margin: 0; padding: 6px 14px; font-size: 14px; }
  .shop .row .kit-btn[disabled] { background: #3a3f46; box-shadow: none; cursor: default; color: #a7adb4; }
  .shop .owned { color: #86efac; font-weight: 800; font-size: 13px; padding: 0 6px; }
  .shop .money { font-size: 20px; font-weight: 800; color: #facc15; }
</style>
</head>
<body>
<script src="../kit.js"></script>
<script>
"use strict";
const ID = "mining-sim";
const SAVE_KEY = "blockos.mining-sim.save";
const T = 32, COLS = 30, DEPTH = 260, SURFACE = 6;
const { canvas, ctx, W, H } = Kit.stage(COLS * T, 600);
const FONT = "'Noto Sans', 'DejaVu Sans', 'Segoe UI', sans-serif";

// ---------- data ----------
const LAYERS = [
  { name: "Dirt", until: 30, hard: 1, tier: 0, color: "#92400e", dark: "#78350f" },
  { name: "Stone", until: 75, hard: 3, tier: 1, color: "#6b7280", dark: "#4b5563" },
  { name: "Deep Stone", until: 130, hard: 7, tier: 2, color: "#3f3f46", dark: "#27272a" },
  { name: "Magma Rock", until: 190, hard: 14, tier: 4, color: "#7f1d1d", dark: "#450a0a" },
  { name: "Void Rock", until: Infinity, hard: 26, tier: 5, color: "#312e81", dark: "#1e1b4b" },
];
const ORES = [
  { id: "coal", name: "Coal", value: 4, color: "#1f2937", fleck: "#0b0f14", min: 2, max: 60, chance: 0.10, hard: 0 },
  { id: "copper", name: "Copper", value: 10, color: "#f97316", fleck: "#fdba74", min: 6, max: 80, chance: 0.07, hard: 1 },
  { id: "iron", name: "Iron", value: 22, color: "#d6d3d1", fleck: "#a8a29e", min: 25, max: 120, chance: 0.06, hard: 2 },
  { id: "gold", name: "Gold", value: 55, color: "#facc15", fleck: "#fef08a", min: 50, max: 160, chance: 0.045, hard: 3 },
  { id: "ruby", name: "Ruby", value: 120, color: "#e11d48", fleck: "#fda4af", min: 80, max: 200, chance: 0.035, hard: 5 },
  { id: "emerald", name: "Emerald", value: 220, color: "#10b981", fleck: "#6ee7b7", min: 110, max: 230, chance: 0.03, hard: 6 },
  { id: "diamond", name: "Diamond", value: 450, color: "#67e8f9", fleck: "#ecfeff", min: 140, max: DEPTH, chance: 0.025, hard: 9 },
  { id: "mythril", name: "Mythril", value: 950, color: "#a78bfa", fleck: "#ede9fe", min: 185, max: DEPTH, chance: 0.02, hard: 12 },
  { id: "star", name: "Starstone", value: 2200, color: "#f472b6", fleck: "#fff", min: 215, max: DEPTH, chance: 0.014, hard: 16 },
];
const PICKS = [
  { name: "Wooden Pickaxe", power: 1, cost: 0, color: "#a16207" },
  { name: "Stone Pickaxe", power: 2, cost: 120, color: "#9ca3af" },
  { name: "Iron Pickaxe", power: 4, cost: 600, color: "#e5e7eb" },
  { name: "Gold Pickaxe", power: 7, cost: 2200, color: "#facc15" },
  { name: "Diamond Pickaxe", power: 12, cost: 8000, color: "#67e8f9" },
  { name: "Mythril Pickaxe", power: 20, cost: 28000, color: "#a78bfa" },
  { name: "Star Pickaxe", power: 34, cost: 90000, color: "#f472b6" },
];
const PACKS = [
  { name: "Pouch", cap: 12, cost: 0, color: "#a16207" },
  { name: "Satchel", cap: 25, cost: 100, color: "#65a30d" },
  { name: "Backpack", cap: 50, cost: 450, color: "#2563eb" },
  { name: "Big Pack", cap: 100, cost: 1600, color: "#7c3aed" },
  { name: "Huge Pack", cap: 220, cost: 6000, color: "#db2777" },
  { name: "Cargo Pack", cap: 500, cost: 20000, color: "#ea580c" },
  { name: "Bottomless Bag", cap: 1500, cost: 75000, color: "#111827" },
];
const ORE_BY_ID = Object.fromEntries(ORES.map((o) => [o.id, o]));
const layerAt = (row) => LAYERS.find((l) => row - SURFACE < l.until) || LAYERS[LAYERS.length - 1];

// ---------- world ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let world, save, player, particles, popups, digging, camY, holdDir = null, mouseDir = null, shopOpen = false, toast = "", toastT = 0;

function generate(seed) {
  const rnd = mulberry32(seed);
  const w = [];
  for (let y = 0; y < DEPTH; y++) {
    const row = [];
    for (let x = 0; x < COLS; x++) {
      if (y < SURFACE) { row.push(null); continue; }
      if (y === SURFACE) { row.push({ kind: "grass" }); continue; }
      const d = y - SURFACE;
      let cell = { kind: "rock" };
      // lava pockets deeper down
      if (d > 70 && rnd() < 0.012 + d * 0.00006) cell = { kind: "lava" };
      else if (d > 3 && rnd() < 0.035) cell = null;                // small natural caves
      else {
        for (let i = ORES.length - 1; i >= 0; i--) {
          const o = ORES[i];
          if (d >= o.min && d <= o.max && rnd() < o.chance) { cell = { kind: "ore", ore: o.id }; break; }
        }
      }
      row.push(cell);
    }
    w.push(row);
  }
  // keep the spawn shaft area clean
  for (let x = 13; x <= 16; x++) if (w[SURFACE + 1][x] && w[SURFACE + 1][x].kind === "lava") w[SURFACE + 1][x] = { kind: "rock" };
  return w;
}

function hardnessOf(x, y) {
  const c = world[y][x];
  if (!c) return 0;
  const layer = layerAt(y);
  if (c.kind === "grass") return 0.6;
  return layer.hard + (c.kind === "ore" ? ORE_BY_ID[c.ore].hard : 0);
}
function tierOf(y) { return layerAt(y).tier; }

// ---------- save / load ----------
function defaultSave() {
  return { seed: (Math.random() * 1e9) | 0, money: 0, pick: 0, pack: 0, bag: {}, earned: 0, dug: "", deepest: 0 };
}
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s.seed === "number") return Object.assign(defaultSave(), s);
  } catch (_) {}
  return defaultSave();
}
// dug cells are stored run-length encoded so the save stays small
function encodeDug() {
  let out = [], run = 0, cur = false;
  for (let y = SURFACE; y < DEPTH; y++)
    for (let x = 0; x < COLS; x++) {
      const v = !!dugMap[y * COLS + x];
      if (v === cur) run++;
      else { out.push(run); run = 1; cur = v; }
    }
  out.push(run);
  return out.join(",");
}
function applyDug(str) {
  if (!str) return;
  const runs = str.split(",").map(Number);
  let i = SURFACE * COLS, cur = false;
  for (const r of runs) {
    for (let k = 0; k < r; k++, i++) if (cur) { const y = Math.floor(i / COLS), x = i % COLS; if (world[y]) world[y][x] = null; dugMap[i] = 1; }
    cur = !cur;
  }
}
let dugMap = [];
let saveTimer = 0;
function persist() {
  save.dug = encodeDug();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {}
}

// ---------- state ----------
function start(fresh) {
  save = fresh ? defaultSave() : loadSave();
  world = generate(save.seed);
  dugMap = new Uint8Array(DEPTH * COLS);
  applyDug(save.dug);
  player = { x: 0, y: SURFACE - 1, rx: 0, ry: SURFACE - 1, face: 1, swing: 0, falling: false };
  player.x = player.rx = spawnCol();
  camY = 0;
  particles = [];
  popups = [];
  digging = null;
  updateHud();
}

const bagCount = () => Object.values(save.bag).reduce((a, b) => a + b, 0);
const bagValue = () => Object.entries(save.bag).reduce((a, [k, n]) => a + ORE_BY_ID[k].value * n, 0);
const capacity = () => PACKS[save.pack].cap;
const depthNow = () => Math.max(0, player.y - SURFACE + 1);

function updateHud() {
  Kit.hud(`$${save.money.toLocaleString()}<small>Depth ${depthNow()} m · Earned $${save.earned.toLocaleString()}</small>`);
}
function say(text) { toast = text; toastT = 2; }

// ---------- input ----------
const DIRS = { ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0], ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1] };
Kit.onKey((code) => {
  if (shopOpen) return;
  if (code === "KeyR") surface();
  if (code === "KeyE" || code === "KeyB") tryShop();
});
function heldDir() {
  for (const code of Object.keys(DIRS)) if (Kit.key(code)) return DIRS[code];
  return mouseDir;
}
canvas.addEventListener("pointerdown", (e) => {
  if (shopOpen) return;
  const p = Kit.pointer(canvas, e);
  // buttons on the HUD
  for (const b of uiButtons) if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); return; }
  pointerAim(p);
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => { if (mouseDir) pointerAim(Kit.pointer(canvas, e)); });
addEventListener("pointerup", () => { mouseDir = null; });
function pointerAim(p) {
  const px = player.rx * T + T / 2, py = player.ry * T + T / 2 - camY;
  const dx = p.x - px, dy = p.y - py;
  mouseDir = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
}

const empty = (x, y) => x >= 0 && x < COLS && y >= 0 && (y >= DEPTH ? false : !world[y][x]);

// a spot on the surface with solid ground under it, as close to the middle as possible
function spawnCol() {
  for (let d = 0; d < COLS; d++)
    for (const x of [8 - d, 8 + d]) if (x >= 0 && x < COLS && world[SURFACE][x]) return x;
  return 8;
}

function surface() {
  if (player.y < SURFACE) return;
  burst(player.rx * T + T / 2, player.ry * T + T / 2, 20, ["#a78bfa", "#e9d5ff", "#fff"], 200);
  player.x = player.rx = spawnCol();
  player.y = player.ry = SURFACE - 1;
  digging = null;
  Kit.sfx("win");
  say("Teleported to the surface");
}

// ---------- update ----------
function burst(x, y, n, colors, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: Kit.rand(0.3, 0.8), size: Kit.randInt(3, 7), color: Kit.pick(colors) });
  }
}

function update(dt) {
  if (!(dt > 0)) return;
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 600 * dt; q.life -= dt; }
  particles = particles.filter((q) => q.life > 0);
  for (const p of popups) { p.y -= 40 * dt; p.life -= dt; }
  popups = popups.filter((p) => p.life > 0);
  toastT -= dt;
  saveTimer -= dt;
  if (saveTimer <= 0) { saveTimer = 5; persist(); }
  if (shopOpen) return;

  // smooth movement toward the logical cell
  const moving = Math.abs(player.rx - player.x) > 0.01 || Math.abs(player.ry - player.y) > 0.01;
  const spd = (player.falling ? 14 : 9) * dt;
  player.rx += Kit.clamp(player.x - player.rx, -spd, spd);
  player.ry += Kit.clamp(player.y - player.ry, -spd, spd);
  player.swing = Math.max(0, player.swing - dt * 4);

  if (!moving) {
    // gravity: fall unless clinging to a wall while holding up
    const d = heldDir();
    const cling = d && d[1] === -1 && (!empty(player.x - 1, player.y) || !empty(player.x + 1, player.y));
    if (empty(player.x, player.y + 1) && !cling && player.y < DEPTH - 1) {
      player.y++;
      player.falling = true;
      digging = null;
    } else {
      if (player.falling) { player.falling = false; burst(player.x * T + T / 2, (player.y + 1) * T - camY * 0, 4, ["#a8a29e"], 60); }
      if (d) act(d, dt);
      else digging = null;
    }
  }

  // sell pad and shop door on the surface
  if (player.y === SURFACE - 1 && !moving) {
    if (player.x >= 2 && player.x <= 4 && bagCount() > 0) sell();
  }
  if (player.y - SURFACE > save.deepest) save.deepest = player.y - SURFACE;

  const target = player.ry * T - H * 0.4;
  camY += (Math.max(-40, target) - camY) * Math.min(1, dt * 8);
  updateHud();
}

function act(d, dt) {
  const [dx, dy] = d;
  if (dx) player.face = dx;
  const nx = player.x + dx, ny = player.y + dy;
  if (nx < 0 || nx >= COLS || ny < 0 || ny >= DEPTH) return;
  if (dy === -1 && empty(nx, ny)) {
    // climbing needs a wall to hold on to
    if (!empty(player.x - 1, player.y) || !empty(player.x + 1, player.y) || !empty(player.x - 1, ny) || !empty(player.x + 1, ny)) { player.y = ny; }
    return;
  }
  if (empty(nx, ny)) { player.x = nx; player.y = ny; digging = null; return; }
  const cell = world[ny][nx];
  if (cell.kind === "lava") { burnt(); return; }
  if (cell.kind !== "grass" && tierOf(ny) > save.pick) {
    if (!digging || digging.x !== nx || digging.y !== ny) say(`Too hard! You need a ${PICKS[tierOf(ny)].name}.`);
    digging = { x: nx, y: ny, p: 0, blocked: true };
    return;
  }
  if (cell.kind === "ore" && bagCount() >= capacity()) {
    if (!digging || digging.x !== nx || digging.y !== ny) say("Backpack full! Sell your ore at the surface (R to teleport).");
    digging = { x: nx, y: ny, p: 0, blocked: true };
    return;
  }
  if (!digging || digging.x !== nx || digging.y !== ny) digging = { x: nx, y: ny, p: 0 };
  const time = Math.max(0.07, (hardnessOf(nx, ny) / PICKS[save.pick].power) * 0.32);
  digging.p += dt / time;
  digging.time = time;
  player.swing = 1;
  if (Math.random() < dt * 14) burst(nx * T + T / 2, ny * T + T / 2, 1, [layerAt(ny).color], 90);
  if (digging.p >= 1) breakBlock(nx, ny);
}

function breakBlock(x, y) {
  const cell = world[y][x];
  world[y][x] = null;
  dugMap[y * COLS + x] = 1;
  digging = null;
  const color = cell.kind === "ore" ? ORE_BY_ID[cell.ore].color : layerAt(y).color;
  burst(x * T + T / 2, y * T + T / 2, 10, [color, layerAt(y).dark], 160);
  if (cell.kind === "ore") {
    const o = ORE_BY_ID[cell.ore];
    save.bag[o.id] = (save.bag[o.id] || 0) + 1;
    popups.push({ x: x * T + T / 2, y: y * T, text: `+1 ${o.name}`, color: o.color === "#1f2937" ? "#d1d5db" : o.color, life: 1 });
    Kit.sfx("coin");
  } else Kit.sfx("click");
}

function burnt() {
  const lost = Math.ceil(bagCount() / 2);
  // lose half of each ore stack
  for (const k of Object.keys(save.bag)) save.bag[k] = Math.floor(save.bag[k] / 2);
  Kit.sfx("lose");
  burst(player.rx * T + T / 2, player.ry * T + T / 2, 30, ["#f97316", "#facc15", "#ef4444"], 220);
  player.x = player.rx = spawnCol();
  player.y = player.ry = SURFACE - 1;
  say(lost ? `Ouch, lava! You dropped ${lost} ore on the way up.` : "Ouch, lava! Watch out for the glowing blocks.");
}

function sell() {
  const value = bagValue();
  const n = bagCount();
  save.bag = {};
  save.money += value;
  save.earned += value;
  Kit.sfx("score");
  popups.push({ x: 3.5 * T, y: (SURFACE - 2) * T, text: `+$${value.toLocaleString()}`, color: "#86efac", life: 1.6 });
  say(`Sold ${n} ore for $${value.toLocaleString()}`);
  burst(3.5 * T, (SURFACE - 1) * T, 20, ["#facc15", "#22c55e"], 200);
  Kit.finish(ID, save.earned);
  persist();
}

// ---------- shop ----------
function tryShop() {
  if (player.y >= SURFACE) { say("Go back to the surface to visit the shop (R)."); return; }
  openShop();
}

function openShop() {
  shopOpen = true;
  const o = document.createElement("div");
  o.className = "kit-overlay";
  const panel = document.createElement("div");
  panel.className = "kit-panel shop";
  o.appendChild(panel);
  document.body.appendChild(o);
  function render() {
    panel.innerHTML = `<h1>Mine Shop</h1><div class="money">$${save.money.toLocaleString()}</div>`;
    const section = (title, list, key, stat) => {
      const h = document.createElement("h2");
      h.textContent = title;
      panel.appendChild(h);
      list.forEach((item, i) => {
        if (i < save[key] - 1 || i > save[key] + 2) return;   // show current, previous and next few
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<div class="sw" style="background:${item.color}"></div><div class="info">${item.name}<small>${stat(item)}</small></div>`;
        if (i <= save[key]) {
          const s = document.createElement("span");
          s.className = "owned";
          s.textContent = i === save[key] ? "Equipped" : "Owned";
          row.appendChild(s);
        } else {
          const b = document.createElement("button");
          b.className = "kit-btn";
          b.textContent = `$${item.cost.toLocaleString()}`;
          if (save.money < item.cost || i !== save[key] + 1) b.disabled = true;
          b.addEventListener("click", () => {
            if (save.money < item.cost || i !== save[key] + 1) return;
            save.money -= item.cost;
            save[key] = i;
            Kit.sfx("win");
            persist();
            render();
          });
          row.appendChild(b);
        }
        panel.appendChild(row);
      });
    };
    section("Pickaxes", PICKS, "pick", (p) => `Power ${p.power} · mines ${LAYERS.filter((l) => l.tier <= PICKS.indexOf(p)).map((l) => l.name).join(", ")}`);
    section("Backpacks", PACKS, "pack", (p) => `Holds ${p.cap.toLocaleString()} ore`);
    const close = document.createElement("button");
    close.className = "kit-btn";
    close.textContent = "Back to mining";
    close.addEventListener("click", done);
    panel.appendChild(close);
    // two-step reset so a stray click can't wipe your progress
    const wipe = document.createElement("button");
    wipe.className = "kit-btn";
    wipe.style.cssText = "background:#3a3f46;box-shadow:none;font-size:13px;padding:6px 14px;margin-left:10px";
    wipe.textContent = "Start over";
    wipe.addEventListener("click", () => {
      if (wipe.dataset.armed) {
        start(true);
        persist();
        done();
        say("Fresh start! Good luck, miner.");
        return;
      }
      wipe.dataset.armed = "1";
      wipe.textContent = "Click again to erase your save";
      wipe.style.background = "#b91c1c";
    });
    panel.appendChild(wipe);
    close.focus();
  }
  function done() {
    o.remove();
    removeEventListener("keydown", onKey, true);
    shopOpen = false;
    Kit.sfx("click");
  }
  function onKey(e) {
    if (e.code === "KeyE" || e.code === "KeyB") { e.preventDefault(); e.stopPropagation(); done(); }
  }
  addEventListener("keydown", onKey, true);
  render();
}

// ---------- drawing ----------
let uiButtons = [];
function drawBlock(x, y, cell) {
  const px = x * T, py = y * T - camY;
  const layer = layerAt(y);
  if (cell.kind === "grass") {
    Kit.brick(ctx, px, py, T, T, "#92400e", 3);
    ctx.fillStyle = "#22c55e";
    ctx.fillRect(px, py, T, 9);
    ctx.fillStyle = "#16a34a";
    ctx.fillRect(px + 4, py + 9, 5, 4);
    ctx.fillRect(px + 20, py + 9, 5, 3);
    return;
  }
  if (cell.kind === "lava") {
    const glow = 0.8 + Math.sin(performance.now() / 300 + x) * 0.2;
    Kit.brick(ctx, px, py, T, T, "#ea580c", 3);
    ctx.fillStyle = `rgba(253,224,71,${glow * 0.7})`;
    ctx.fillRect(px + 6, py + 6, 8, 8);
    ctx.fillRect(px + 18, py + 16, 8, 8);
    return;
  }
  Kit.brick(ctx, px, py, T, T, (x + y) % 2 ? layer.color : layer.dark, 3);
  if (cell.kind === "ore") {
    const o = ORE_BY_ID[cell.ore];
    ctx.fillStyle = o.color;
    ctx.fillRect(px + 5, py + 6, 9, 9);
    ctx.fillRect(px + 17, py + 15, 10, 10);
    ctx.fillRect(px + 8, py + 20, 6, 6);
    ctx.fillStyle = o.fleck;
    ctx.fillRect(px + 7, py + 8, 3, 3);
    ctx.fillRect(px + 19, py + 17, 3, 3);
  }
}

function drawSurface() {
  const sy = -camY;
  const g = ctx.createLinearGradient(0, sy - 300, 0, sy + SURFACE * T);
  g.addColorStop(0, "#38bdf8");
  g.addColorStop(1, "#bae6fd");
  ctx.fillStyle = g;
  ctx.fillRect(0, Math.min(0, sy - 400), W, SURFACE * T + 400);
  ctx.fillStyle = "rgba(255,255,255,.8)";
  ctx.fillRect(600, sy + 30, 110, 24);
  ctx.fillRect(624, sy + 14, 56, 16);
  // sell pad
  const base = sy + SURFACE * T;
  Kit.brick(ctx, 2 * T, base - 10, 3 * T, 10, "#16a34a", 3);
  ctx.fillStyle = "#facc15";
  ctx.fillRect(3 * T + 8, base - 70, 16, 50);
  Kit.brick(ctx, 2 * T + 4, base - 92, 3 * T - 8, 28, "#15803d", 5);
  ctx.fillStyle = "#fff";
  ctx.font = `900 14px ${FONT}`;
  ctx.textAlign = "center";
  ctx.fillText("SELL", 3.5 * T, base - 73);
  // shop building
  const sx = 18 * T;
  Kit.brick(ctx, sx, base - 4 * T, 6 * T, 4 * T, "#b45309", 6);
  Kit.brick(ctx, sx - 10, base - 4 * T - 24, 6 * T + 20, 28, "#dc2626", 6);
  ctx.fillStyle = "#422006";
  ctx.fillRect(sx + 2.5 * T, base - 2 * T, T, 2 * T);
  ctx.fillStyle = "#7dd3fc";
  ctx.fillRect(sx + 16, base - 3 * T, 40, 28);
  ctx.fillRect(sx + 6 * T - 56, base - 3 * T, 40, 28);
  ctx.fillStyle = "#fff";
  ctx.fillText("SHOP (E)", sx + 3 * T, base - 4 * T - 4);
  // tree
  Kit.brick(ctx, 26 * T + 10, base - 70, 12, 70, "#78350f", 3);
  Kit.brick(ctx, 26 * T - 14, base - 110, 60, 46, "#15803d", 8);
}

function drawPlayer() {
  const x = player.rx * T + 6, y = player.ry * T - camY + 2;
  // legs, body, head
  ctx.fillStyle = "#1e3a8a";
  ctx.fillRect(x + 3, y + 22, 7, 8);
  ctx.fillRect(x + 11, y + 22, 7, 8);
  Kit.brick(ctx, x, y + 11, 20, 13, "#f59e0b", 3);
  Kit.brick(ctx, x + 2, y, 16, 12, "#fcd34d", 3);
  ctx.fillStyle = "#facc15";
  ctx.fillRect(x, y - 3, 20, 5);           // hard hat
  ctx.fillStyle = "#fff";
  ctx.fillRect(x + (player.face > 0 ? 14 : 2), y - 2, 4, 3);   // lamp
  ctx.fillStyle = "#111";
  ctx.fillRect(x + 10 + player.face * 2 - 3, y + 4, 2, 3);
  ctx.fillRect(x + 10 + player.face * 2 + 2, y + 4, 2, 3);
  // pickaxe swing
  const d = digging && !digging.blocked ? [digging.x - player.x, digging.y - player.y] : [player.face, 0];
  const ang = Math.atan2(d[1], d[0]) + Math.sin(player.swing * 12) * 0.6 * (player.swing > 0 ? 1 : 0);
  ctx.save();
  ctx.translate(x + 10, y + 16);
  ctx.rotate(ang);
  ctx.fillStyle = "#78350f";
  ctx.fillRect(4, -2, 18, 4);
  ctx.fillStyle = PICKS[save.pick].color;
  ctx.fillRect(18, -9, 5, 18);
  ctx.restore();
}

function drawLight() {
  // darkness grows with depth, with a lamp glow around the miner
  const depth = player.ry - SURFACE;
  const dark = Kit.clamp(depth / 70, 0, 0.82);
  if (dark <= 0.01) return;
  const cx = player.rx * T + T / 2, cy = player.ry * T + T / 2 - camY;
  const r = 230 - Math.min(90, depth * 0.4);
  const g = ctx.createRadialGradient(cx, cy, r * 0.25, cx, cy, r);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, `rgba(0,0,0,${dark})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function button(x, y, w, h, label, color, fn) {
  Kit.brick(ctx, x, y, w, h, color, 6);
  ctx.fillStyle = "#fff";
  ctx.font = `800 13px ${FONT}`;
  ctx.textAlign = "center";
  ctx.fillText(label, x + w / 2, y + h / 2 + 5);
  uiButtons.push({ x, y, w, h, fn });
}

function drawUI() {
  uiButtons = [];
  ctx.fillStyle = "rgba(0,0,0,.55)";
  ctx.fillRect(10, 10, 250, 78);
  ctx.textAlign = "left";
  ctx.font = `800 18px ${FONT}`;
  ctx.fillStyle = "#facc15";
  ctx.fillText(`$${save.money.toLocaleString()}`, 20, 34);
  ctx.font = `700 12px ${FONT}`;
  ctx.fillStyle = "#e5e7eb";
  ctx.fillText(`${PICKS[save.pick].name} · Depth ${depthNow()} m`, 20, 52);
  const n = bagCount(), cap = capacity();
  ctx.fillStyle = "#1f2937";
  ctx.fillRect(20, 60, 230, 18);
  ctx.fillStyle = n >= cap ? "#ef4444" : "#3b82f6";
  ctx.fillRect(22, 62, 226 * Math.min(1, n / cap), 14);
  ctx.fillStyle = "#fff";
  ctx.fillText(`${PACKS[save.pack].name} ${n}/${cap}  ($${bagValue().toLocaleString()})`, 26, 74);
  button(10, H - 46, 120, 36, "Surface (R)", "#7c3aed", surface);
  button(140, H - 46, 100, 36, "Shop (E)", "#d97706", tryShop);
  // dig progress
  if (digging && !digging.blocked && digging.p > 0) {
    const px = digging.x * T, py = digging.y * T - camY;
    ctx.fillStyle = "rgba(0,0,0,.6)";
    ctx.fillRect(px + 2, py + T - 8, T - 4, 6);
    ctx.fillStyle = "#fde047";
    ctx.fillRect(px + 3, py + T - 7, (T - 6) * digging.p, 4);
    // cracks
    ctx.fillStyle = "rgba(0,0,0,.45)";
    if (digging.p > 0.3) ctx.fillRect(px + 8, py + 8, 2, 14);
    if (digging.p > 0.6) { ctx.fillRect(px + 10, py + 14, 12, 2); ctx.fillRect(px + 20, py + 6, 2, 10); }
  }
  // layer indicator
  if (player.y >= SURFACE) {
    const layer = layerAt(player.y + 1);
    ctx.textAlign = "right";
    ctx.font = `800 13px ${FONT}`;
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(W - 170, H - 40, 160, 28);
    ctx.fillStyle = PICKS[layer.tier] && layer.tier > save.pick ? "#fca5a5" : "#e5e7eb";
    ctx.fillText(`${layer.name}${layer.tier > save.pick ? " (locked)" : ""}`, W - 20, H - 21);
  }
  if (toastT > 0) {
    ctx.globalAlpha = Kit.clamp(toastT * 2, 0, 1);
    ctx.font = `800 16px ${FONT}`;
    ctx.textAlign = "center";
    const w = ctx.measureText(toast).width + 30;
    ctx.fillStyle = "rgba(0,0,0,.7)";
    ctx.fillRect(W / 2 - w / 2, 100, w, 32);
    ctx.fillStyle = "#fff";
    ctx.fillText(toast, W / 2, 122);
    ctx.globalAlpha = 1;
  }
}

function draw() {
  // underground background
  ctx.fillStyle = "#1c1410";
  ctx.fillRect(0, 0, W, H);
  if (camY < SURFACE * T) drawSurface();
  const y0 = Math.max(0, Math.floor(camY / T)), y1 = Math.min(DEPTH - 1, Math.ceil((camY + H) / T));
  for (let y = y0; y <= y1; y++)
    for (let x = 0; x < COLS; x++) {
      const c = world[y][x];
      if (c) drawBlock(x, y, c);
      else if (y > SURFACE) {
        ctx.fillStyle = "rgba(0,0,0,.25)";
        ctx.fillRect(x * T, y * T - camY, T, T);
      }
    }
  drawPlayer();
  for (const q of particles) {
    ctx.globalAlpha = Kit.clamp(q.life * 2, 0, 1);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - camY - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  drawLight();
  ctx.font = `800 15px ${FONT}`;
  ctx.textAlign = "center";
  for (const p of popups) {
    ctx.globalAlpha = Kit.clamp(p.life * 2, 0, 1);
    ctx.fillStyle = "#000";
    ctx.fillText(p.text, p.x + 1, p.y - camY + 1);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y - camY);
  }
  ctx.globalAlpha = 1;
  drawUI();
}

addEventListener("beforeunload", persist);
addEventListener("pagehide", persist);

const game = Kit.loop(update, draw);
start(false);
draw();
const returning = save.earned > 0 || save.money > 0;
Kit.overlay("Mining Sim", (returning ? `Welcome back! You have $${save.money.toLocaleString()} and the ${PICKS[save.pick].name}.\n\n` : "") + "Dig down for ore, fill your backpack, then sell it on the green pad at the surface. Spend your cash in the shop on better pickaxes and bigger backpacks. Deeper layers need stronger pickaxes but hide richer ore. Avoid the glowing lava!\n\nArrows / WASD (or hold the mouse): move and dig\nUp next to a wall: climb\nR: teleport to the surface\nE: open the shop\nProgress saves automatically.", "Start digging").then(() => game.start());
</script>
</body>
</html>
