<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cave Copter</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script src="../kit.js"></script>
<script>
"use strict";
const ID = "cave-copter";
const { canvas, ctx, W, H } = Kit.stage(960, 540);
const FONT = "'Noto Sans', 'DejaVu Sans', 'Segoe UI', sans-serif";

const COL = 24;                      // width of one cave column
const PX = 220;                      // player's fixed screen x
const PW = 40, PH = 22;              // player hitbox
const GRAV = 1000, LIFT = 2000, MAX_VY = 480;
const GEM_BONUS = 25;

let cols, obstacles, gems, particles, player, scroll, speed, dist, gemCount, alive, started;
let center, slope, nextObstacle, nextGem, flash, holdMouse = false;

function gapFor(d) { return Math.max(170, 340 - d * 0.045); }

function reset() {
  cols = [];
  obstacles = [];
  gems = [];
  particles = [];
  player = { y: H / 2 - PH / 2, vy: 0, rotor: 0 };
  scroll = 0;
  speed = 260;
  dist = 0;
  gemCount = 0;
  alive = true;
  started = false;
  flash = 0;
  center = H / 2;
  slope = 0;
  nextObstacle = 900;
  nextGem = 500;
  for (let x = 0; x <= W + COL * 2; x += COL) addColumn(true);
  updateHud();
}

// Appends one column of cave to the right edge.
function addColumn(calm) {
  const worldX = cols.length ? cols[cols.length - 1].x + COL : 0;
  const d = worldX / 10;
  const gap = gapFor(d);
  if (!calm) {
    slope += Kit.rand(-1.6, 1.6);
    slope = Kit.clamp(slope, -7, 7);
    center += slope;
  }
  const minC = 30 + gap / 2, maxC = H - 30 - gap / 2;
  if (center < minC) { center = minC; slope = Math.abs(slope) * 0.5; }
  if (center > maxC) { center = maxC; slope = -Math.abs(slope) * 0.5; }
  const snap = (v) => Math.round(v / 12) * 12;
  const top = snap(center - gap / 2), bot = snap(center + gap / 2);
  cols.push({ x: worldX, top, bot });

  if (!calm && worldX > nextObstacle) {
    const bh = Kit.randInt(4, 7) * 12;
    const free = bot - top - bh;
    if (free > 150) {
      // keep at least ~75px of air on one side
      const y = Kit.rand(top + 75, bot - 75 - bh);
      obstacles.push({ x: worldX, y: Math.round(y / 12) * 12, w: COL * Kit.randInt(1, 2), h: bh, hue: Kit.pick(["#ef4444", "#fb923c", "#a855f7"]) });
    }
    nextObstacle = worldX + Kit.rand(420, 820) - Math.min(250, d * 0.04);
  }
  if (!calm && worldX > nextGem) {
    gems.push({ x: worldX + COL / 2, y: center + Kit.rand(-gap / 4, gap / 4), t: Math.random() * 6 });
    nextGem = worldX + Kit.rand(500, 1100);
  }
}

function updateHud() {
  Kit.hud(`Score ${score()}<small>${Math.floor(dist)} m · ${gemCount} gems · Best ${Kit.best(ID) ?? 0}</small>`);
}
const score = () => Math.floor(dist) + gemCount * GEM_BONUS;

function holding() {
  return holdMouse || Kit.key("Space") || Kit.key("ArrowUp") || Kit.key("KeyW");
}

canvas.addEventListener("pointerdown", (e) => { holdMouse = true; e.preventDefault(); });
addEventListener("pointerup", () => { holdMouse = false; });
addEventListener("pointercancel", () => { holdMouse = false; });

function hitsCave(x, y, w, h) {
  for (const c of cols) {
    const sx = c.x - scroll;
    if (sx + COL <= x || sx >= x + w) continue;
    if (y < c.top || y + h > c.bot) return true;
  }
  for (const o of obstacles) {
    const sx = o.x - scroll;
    if (sx < x + w && sx + o.w > x && o.y < y + h && o.y + o.h > y) return true;
  }
  return false;
}

function burst(x, y, n, colors, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: Kit.rand(0.4, 1), max: 1, size: Kit.randInt(3, 8), color: Kit.pick(colors) });
  }
}

function update(dt) {
  if (!(dt > 0)) return;   // the first frame after start can report a tiny negative dt
  player.rotor += dt * 40;
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt * (p.grav ?? 1); p.life -= dt;
  }
  particles = particles.filter((p) => p.life > 0);
  flash = Math.max(0, flash - dt * 2);
  if (!alive) return;

  if (!started) {
    player.y = H / 2 - PH / 2 + Math.sin(player.rotor * 0.1) * 6;
    if (holding()) started = true;
    return;
  }

  speed = Math.min(520, 260 + dist * 0.1);
  const dx = speed * dt;
  scroll += dx;
  dist += dx / 10;

  player.vy += (holding() ? -LIFT + GRAV : GRAV) * dt;
  player.vy = Kit.clamp(player.vy, -MAX_VY, MAX_VY);
  player.y += player.vy * dt;

  // exhaust smoke
  if (Math.random() < 0.6) particles.push({ x: PX - 4, y: player.y + PH / 2 + 2, vx: -speed * 0.4, vy: Kit.rand(-20, 20), life: 0.5, max: 0.5, size: 6, color: "rgba(200,210,220,.5)", grav: 0 });

  while (cols.length && cols[0].x + COL < scroll - COL) cols.shift();
  while (cols[cols.length - 1].x - scroll < W + COL) addColumn(false);
  obstacles = obstacles.filter((o) => o.x + o.w > scroll - 50);

  for (const g of gems) {
    g.t += dt;
    if (!g.got && Math.abs(g.x - scroll - (PX + PW / 2)) < 26 && Math.abs(g.y - (player.y + PH / 2)) < 26) {
      g.got = true;
      gemCount++;
      Kit.sfx("coin");
      burst(PX + PW / 2, player.y, 10, ["#5eead4", "#a7f3d0", "#fff"], 160);
    }
  }
  gems = gems.filter((g) => !g.got && g.x > scroll - 40);

  if (player.y < -10 || player.y + PH > H + 10 || hitsCave(PX + 3, player.y + 3, PW - 6, PH - 6)) crash();
  updateHud();
}

async function crash() {
  alive = false;
  flash = 1;
  Kit.sfx("hit");
  burst(PX + PW / 2, player.y + PH / 2, 40, ["#facc15", "#fb923c", "#ef4444", "#f2f4f5"], 380);
  const final = score();
  const best = Kit.finish(ID, final);
  setTimeout(async () => {
    Kit.sfx("lose");
    await Kit.overlay("Crashed!", `Distance: ${Math.floor(dist)} m\nGems: ${gemCount} (+${gemCount * GEM_BONUS})\nScore: ${final}\nBest: ${best}`, "Fly again");
    reset();
  }, 900);
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#1b1530");
  g.addColorStop(1, "#0d0b18");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // far parallax rock blocks
  // far parallax stalactites / stalagmites
  ctx.fillStyle = "rgba(140,120,200,.07)";
  const off = (scroll * 0.3) % 80;
  const base = Math.floor(scroll * 0.3 / 80);
  for (let i = -1; i < 14; i++) {
    const n = Math.abs((i + base) * 7919) % 11;
    const x = i * 80 - off;
    ctx.fillRect(x, 0, 40, 60 + n * 14);
    ctx.fillRect(x + 20, H - 50 - ((n * 5) % 11) * 12, 40, 200);
  }
}

function drawCave() {
  for (const c of cols) {
    const x = Math.round(c.x - scroll);
    const odd = ((c.x / COL) | 0) % 2;
    // rock made of staggered brick rows
    for (let y = 0; y < H; y += 12) {
      if (y + 12 <= c.top - 12 || y >= c.bot + 12) {
        ctx.fillStyle = ((y / 12) + odd) % 2 ? "#3d3452" : "#463c5e";
        ctx.fillRect(x, y, COL, 12);
        ctx.fillStyle = "rgba(0,0,0,.18)";
        ctx.fillRect(x, y + 11, COL, 1);
      } else if (y < c.top || y >= c.bot) {
        ctx.fillStyle = "#463c5e";
        ctx.fillRect(x, y, COL, 12);
      }
    }
    Kit.brick(ctx, x, c.top - 14, COL, 14, "#7c6aa8", 3);
    Kit.brick(ctx, x, c.bot, COL, 14, "#7c6aa8", 3);
    // crystals in the rock
    if (((c.x / COL) | 0) % 7 === 3) {
      ctx.fillStyle = "#5eead433";
      ctx.fillRect(x + 6, c.top - 44, 10, 18);
      ctx.fillRect(x + 6, c.bot + 30, 10, 18);
    }
  }
  for (const o of obstacles) {
    const x = Math.round(o.x - scroll);
    for (let y = o.y; y < o.y + o.h; y += 12)
      for (let bx = x; bx < x + o.w; bx += COL) Kit.brick(ctx, bx, y, COL, 12, o.hue, 2);
    ctx.strokeStyle = "rgba(0,0,0,.35)";
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, o.y + 1, o.w - 2, o.h - 2);
  }
}

function drawGems() {
  for (const g of gems) {
    const x = g.x - scroll, y = g.y + Math.sin(g.t * 4) * 4;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.PI / 4);
    Kit.brick(ctx, -9, -9, 18, 18, "#2dd4bf", 3);
    ctx.restore();
  }
}

function drawPlayer() {
  if (!alive) return;
  const tilt = Kit.clamp(player.vy / 1400, -0.35, 0.35);
  ctx.save();
  ctx.translate(PX + PW / 2, player.y + PH / 2);
  ctx.rotate(tilt);
  // tail
  Kit.brick(ctx, -PW / 2 - 18, -4, 22, 8, "#ca8a04", 2);
  Kit.brick(ctx, -PW / 2 - 22, -10, 8, 14, "#facc15", 2);
  // body
  Kit.brick(ctx, -PW / 2, -PH / 2, PW, PH, "#facc15", 6);
  // cockpit
  ctx.fillStyle = "#7dd3fc";
  ctx.fillRect(PW / 2 - 16, -PH / 2 + 4, 12, 9);
  ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.fillRect(PW / 2 - 14, -PH / 2 + 5, 4, 3);
  // skids
  ctx.fillStyle = "#3f3f46";
  ctx.fillRect(-PW / 2 + 4, PH / 2 + 3, PW - 8, 3);
  ctx.fillRect(-PW / 2 + 8, PH / 2, 3, 4);
  ctx.fillRect(PW / 2 - 11, PH / 2, 3, 4);
  // rotor
  ctx.fillStyle = "#27272a";
  ctx.fillRect(-2, -PH / 2 - 6, 4, 6);
  const span = Math.abs(Math.cos(player.rotor)) * 30 + 6;
  ctx.fillStyle = "#d4d4d8";
  ctx.fillRect(-span, -PH / 2 - 9, span * 2, 3);
  ctx.restore();
}

function draw() {
  drawBackground();
  drawCave();
  drawGems();
  for (const p of particles) {
    ctx.globalAlpha = Kit.clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  drawPlayer();
  if (alive && !started) {
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(W / 2 - 190, H - 92, 380, 44);
    ctx.fillStyle = "#f2f4f5";
    ctx.font = `800 20px ${FONT}`;
    ctx.textAlign = "center";
    ctx.fillText("Hold Space or mouse to lift off", W / 2, H - 63);
  }
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`;
    ctx.fillRect(0, 0, W, H);
  }
}

const game = Kit.loop(update, draw);
reset();
draw();
Kit.overlay("Cave Copter", "Fly as far as you can through the narrowing cave.\nGrab gems for bonus points. Touch a wall and you crash.\n\nHold Space / Up / W or the mouse button to rise.\nLet go to drop.", "Fly").then(() => game.start());
</script>
</body>
</html>
