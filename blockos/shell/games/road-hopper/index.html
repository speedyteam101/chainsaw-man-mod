<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Hopper</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script src="../kit.js"></script>
<script>
"use strict";
const ID = "road-hopper";
const C = 48, COLS = 14, ROWS = 15;
const { canvas, ctx, W, H } = Kit.stage(COLS * C, ROWS * C);
const FONT = "'Noto Sans', 'DejaVu Sans', 'Segoe UI', sans-serif";
const HOP_TIME = 0.13;
const LOOP_PAD = 4 * C, LOOP = W + LOOP_PAD * 2;   // moving things wrap around this loop

let lanes, player, camRow, maxRow, alive, particles, t, queued, deathText, hawk;

// ---------- lane generation ----------
function makeLane(r) {
  const f = 1 + Math.min(2.2, r / 120);   // difficulty factor
  if (r < 4) return grass(r, r < 2 ? 0 : 1);
  // groups: decide from previous lane to create runs of the same type
  const prev = lanes[r - 1];
  let type;
  if (prev.run > 0) type = prev.type;
  else {
    const roll = Math.random();
    if (prev.type !== "grass") type = Math.random() < 0.75 ? "grass" : (roll < 0.5 ? "road" : "river");
    else type = roll < 0.48 ? "road" : roll < 0.78 ? "river" : roll < 0.92 ? "rail" : "grass";
  }
  let run = prev.type === type && prev.run > 0 ? prev.run - 1 : null;
  if (run === null) {
    run = type === "road" ? Kit.randInt(0, Math.min(4, 1 + Math.floor(r / 40))) : type === "river" ? Kit.randInt(0, Math.min(3, 1 + Math.floor(r / 60))) : type === "grass" ? Kit.randInt(0, 1) : 0;
  }
  let lane;
  if (type === "grass") lane = grass(r, 3);
  else if (type === "road") lane = road(f, prev);
  else if (type === "river") lane = river(f, prev);
  else lane = rail(f);
  lane.run = run;
  return lane;
}

function grass(r, maxTrees) {
  const trees = new Set();
  const n = Kit.randInt(0, maxTrees);
  for (let i = 0; i < n; i++) trees.add(Kit.randInt(0, COLS - 1));
  if (r === 0) trees.clear();
  return { type: "grass", trees, shade: r % 2, run: 0 };
}

function spreadObjects(count, widths, minGap) {
  const objs = [];
  let x = Kit.rand(0, LOOP);
  for (let i = 0; i < count; i++) {
    const w = Kit.pick(widths) * C;
    objs.push({ x: x % LOOP - LOOP_PAD, w, color: Kit.pick(["#ef4444", "#3b82f6", "#facc15", "#a855f7", "#14b8a6", "#f97316"]) });
    x += w + minGap + Kit.rand(0, C * 3);
  }
  return objs;
}

function road(f, prev) {
  const dir = prev.type === "road" ? -prev.dir : Kit.pick([-1, 1]);
  const truck = Math.random() < 0.3;
  const speed = Kit.rand(70, 130) * f * (truck ? 0.8 : 1);
  const count = Kit.randInt(2, truck ? 3 : 4);
  return { type: "road", dir, speed: speed * dir, objs: spreadObjects(count, truck ? [2, 3] : [1, 1, 2], C * 2.6) };
}

function river(f, prev) {
  const dir = prev.type === "river" ? -prev.dir : Kit.pick([-1, 1]);
  const speed = Kit.rand(55, 95) * Math.min(1.8, f) * dir;
  // logs: keep gaps jumpable so the river is always crossable
  const objs = [];
  let x = Kit.rand(0, C * 2);
  while (x < LOOP - C * 2) {
    const w = Kit.randInt(2, 4) * C;
    objs.push({ x: x - LOOP_PAD, w });
    x += w + Kit.rand(C * 1.2, C * 2.6);
  }
  return { type: "river", dir, speed, objs };
}

function rail() {
  return { type: "rail", train: { state: "wait", timer: Kit.rand(2, 6), x: 0, dir: Kit.pick([-1, 1]) } };
}

function lane(r) {
  while (lanes.length <= r) lanes.push(makeLane(lanes.length));
  return lanes[r];
}

// ---------- state ----------
function reset() {
  lanes = [];
  for (let r = 0; r < ROWS + 10; r++) lane(r);
  player = { x: colX(7), row: 1, hop: 0, fromX: colX(7), fromRow: 1, face: 0, squash: 0, onLog: null, dead: false };
  camRow = 0;
  maxRow = 0;
  alive = true;
  particles = [];
  t = 0;
  queued = null;
  hawk = null;
  updateHud();
}
const colX = (c) => c * C + C / 2;
const score = () => maxRow;
function updateHud() {
  Kit.hud(`Score ${score()}<small>Best ${Kit.best(ID) ?? 0}</small>`);
}

// ---------- input ----------
const DIRS = {
  ArrowUp: [0, 1], KeyW: [0, 1], ArrowDown: [0, -1], KeyS: [0, -1],
  ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
};
Kit.onKey((code) => {
  const d = DIRS[code];
  if (d && alive) tryHop(d[0], d[1]);
});
canvas.addEventListener("pointerdown", (e) => {
  if (!alive) return;
  const p = Kit.pointer(canvas, e);
  const px = player.x, py = rowY(player.row) + C / 2;
  const dx = p.x - px, dy = py - p.y;
  if (Math.abs(dx) > Math.abs(dy)) tryHop(Math.sign(dx), 0);
  else tryHop(0, dy >= 0 ? 1 : -1);
});

function tryHop(dx, dy) {
  if (player.hop > 0) { queued = [dx, dy]; return; }
  player.face = dx === 0 ? (dy > 0 ? 0 : 2) : (dx > 0 ? 1 : 3);
  const targetRow = player.row + dy;
  if (targetRow < 0 || targetRow < Math.floor(camRow)) return;
  const L = lane(targetRow);
  let tx;
  if (dy === 0) tx = player.x + dx * C;
  else tx = L.type === "river" || lane(player.row).type === "river" ? player.x : colX(Math.round((player.x - C / 2) / C));
  if (L.type !== "river") tx = colX(Kit.clamp(Math.round((tx - C / 2) / C), 0, COLS - 1));
  if (tx < C / 2 - 1 || tx > W - C / 2 + 1) return;
  if (L.type === "grass" && L.trees.has(Math.round((tx - C / 2) / C))) { player.squash = 0.4; return; }
  player.fromX = player.x;
  player.fromRow = player.row;
  player.toX = tx;
  player.row = targetRow;
  player.hop = HOP_TIME;
  player.onLog = null;
  Kit.sfx("click");
}

const rowY = (r) => H - (r + 1 - camRow) * C;

// ---------- update ----------
function burst(x, y, n, colors, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: Kit.rand(0.3, 0.8), size: Kit.randInt(3, 8), color: Kit.pick(colors) });
  }
}

function moveObjects(L, dt) {
  for (const o of L.objs) {
    o.x += L.speed * dt;
    if (L.speed > 0 && o.x > W + LOOP_PAD) o.x -= LOOP;
    if (L.speed < 0 && o.x + o.w < -LOOP_PAD) o.x += LOOP;
  }
}

function update(dt) {
  if (!(dt > 0)) return;   // the first frame after start can report a tiny negative dt
  t += dt;
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.96; q.vy *= 0.96; q.life -= dt; }
  particles = particles.filter((q) => q.life > 0);
  player.squash = Math.max(0, player.squash - dt * 3);

  const top = Math.ceil(camRow) + ROWS + 2;
  for (let r = Math.max(0, Math.floor(camRow) - 1); r <= top; r++) {
    const L = lane(r);
    if (L.objs) moveObjects(L, dt);
    if (L.type === "rail") updateTrain(L, dt, r);
  }
  if (hawk) {
    hawk.y += 900 * dt;
    if (hawk.y > rowY(player.row) && !hawk.grabbed) { hawk.grabbed = true; Kit.sfx("hit"); }
    if (hawk.grabbed) player.carried = true;
  }
  if (!alive) return;

  // hop animation
  if (player.hop > 0) {
    player.hop -= dt;
    const k = 1 - Math.max(0, player.hop) / HOP_TIME;
    player.x = player.fromX + (player.toX - player.fromX) * k;
    if (player.hop <= 0) land();
  } else if (player.onLog) {
    player.x += lane(player.row).speed * dt;
    if (player.x < C / 4 || player.x > W - C / 4) return die("Swept away by the river!", "splash");
  }

  // cars and trains
  const L = lane(player.row);
  const halfway = player.hop <= HOP_TIME / 2;
  if (halfway && L.type === "road") {
    for (const o of L.objs) {
      if (player.x + 14 > o.x + 4 && player.x - 14 < o.x + o.w - 4) return die("Splat! Watch the traffic.", "splat");
    }
  }
  if (halfway && L.type === "rail" && L.train.state === "go") {
    const tr = L.train;
    if (player.x + 14 > tr.x && player.x - 14 < tr.x + TRAIN_LEN) return die("Flattened by a train!", "splat");
  }

  // camera creeps forward so you can't stand still forever
  const creep = 0.28 + Math.min(0.5, maxRow / 300);
  const target = player.row - 4;
  if (target > camRow) camRow += (target - camRow) * Math.min(1, dt * 4);
  camRow += creep * dt;
  if (rowY(player.row) > H - 4) {
    hawk = { x: player.x, y: -200, grabbed: false };
    return die("Too slow! The hawk swooped in.", "hawk");
  }
  if (player.row > maxRow) { maxRow = player.row; updateHud(); }
}

function land() {
  player.hop = 0;
  player.x = player.toX;
  player.squash = 0.6;
  const L = lane(player.row);
  if (L.type === "river") {
    const log = L.objs.find((o) => player.x > o.x + 4 && player.x < o.x + o.w - 4);
    if (!log) return die("Splash! You can't swim.", "splash");
    player.onLog = log;
  }
  if (queued) {
    const q = queued;
    queued = null;
    tryHop(q[0], q[1]);
  }
}

const TRAIN_LEN = C * 10;
function updateTrain(L, dt, r) {
  const tr = L.train;
  tr.timer -= dt;
  if (tr.state === "wait" && tr.timer <= 0) {
    tr.state = "warn";
    tr.timer = 1.1;
    if (Math.abs(r - player.row) < 8) Kit.sfx("click");
  } else if (tr.state === "warn" && tr.timer <= 0) {
    tr.state = "go";
    tr.x = tr.dir > 0 ? -TRAIN_LEN - C : W + C;
  } else if (tr.state === "go") {
    tr.x += tr.dir * 1300 * dt;
    if ((tr.dir > 0 && tr.x > W + C) || (tr.dir < 0 && tr.x + TRAIN_LEN < -C)) {
      tr.state = "wait";
      tr.timer = Kit.rand(2.5, 6);
    }
  }
}

async function die(text, kind) {
  if (!alive) return;
  alive = false;
  player.dead = kind;
  deathText = text;
  const py = rowY(player.row) + C / 2;
  if (kind === "splash") { Kit.sfx("hit"); burst(player.x, py, 24, ["#7dd3fc", "#e0f2fe", "#38bdf8"], 220); }
  else if (kind === "splat") { Kit.sfx("hit"); burst(player.x, py, 20, ["#f2f4f5", "#fca5a5", "#facc15"], 260); }
  const final = score();
  const best = Kit.finish(ID, final);
  updateHud();
  setTimeout(async () => {
    Kit.sfx("lose");
    await Kit.overlay("Game over", `${text}\n\nScore: ${final}\nBest: ${best}`, "Hop again");
    reset();
  }, 1000);
}

// ---------- drawing ----------
function drawLane(L, r) {
  const y = rowY(r);
  if (y > H || y < -C) return;
  if (L.type === "grass") {
    ctx.fillStyle = L.shade ? "#6fcf55" : "#65c24c";
    ctx.fillRect(0, y, W, C);
    ctx.fillStyle = "rgba(0,0,0,.06)";
    for (let c = 0; c < COLS; c++) if ((c + r) % 3 === 0) ctx.fillRect(c * C + 10, y + 14, 6, 6);
  } else if (L.type === "road") {
    ctx.fillStyle = "#4b5563";
    ctx.fillRect(0, y, W, C);
    const next = lanes[r + 1];
    if (next && next.type === "road") {
      ctx.fillStyle = "rgba(255,255,255,.55)";
      for (let x = 8; x < W; x += 48) ctx.fillRect(x, y - 2, 24, 4);
    }
  } else if (L.type === "river") {
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(0, y, W, C);
    ctx.fillStyle = "rgba(255,255,255,.25)";
    const off = (t * L.speed * 0.5) % 96;
    for (let x = -96; x < W + 96; x += 96) ctx.fillRect(x + off, y + 12 + (r % 2) * 18, 30, 4);
  } else if (L.type === "rail") {
    ctx.fillStyle = "#a8a29e";
    ctx.fillRect(0, y, W, C);
    ctx.fillStyle = "#78350f";
    for (let x = 4; x < W; x += 24) ctx.fillRect(x, y + 6, 10, C - 12);
    ctx.fillStyle = "#d6d3d1";
    ctx.fillRect(0, y + 13, W, 5);
    ctx.fillRect(0, y + C - 18, W, 5);
  }
}

function drawLaneObjects(L, r) {
  const y = rowY(r);
  if (y > H || y < -C * 2) return;
  if (L.type === "grass") {
    for (const c of L.trees) {
      const x = c * C;
      ctx.fillStyle = "rgba(0,0,0,.18)";
      ctx.fillRect(x + 8, y + 10, C - 10, C - 10);
      Kit.brick(ctx, x + 18, y + 26, 12, 18, "#92400e", 2);
      Kit.brick(ctx, x + 4, y - 8, C - 8, 32, "#15803d", 6);
      Kit.brick(ctx, x + 10, y - 18, C - 20, 16, "#22c55e", 5);
    }
  } else if (L.type === "road") {
    for (const o of L.objs) drawCar(o, y, L.dir);
  } else if (L.type === "river") {
    for (const o of L.objs) {
      Kit.brick(ctx, o.x, y + 6, o.w, C - 12, "#92400e", 6);
      ctx.fillStyle = "#b45309";
      for (let x = o.x + 14; x < o.x + o.w - 14; x += 28) ctx.fillRect(x, y + 18, 16, 3);
      ctx.fillStyle = "#fcd34d55";
      ctx.fillRect(o.x + 4, y + 14, 6, C - 28);
    }
  } else if (L.type === "rail") {
    const tr = L.train;
    // signal post at left edge
    const blink = tr.state === "warn" && Math.floor(t * 8) % 2 === 0;
    ctx.fillStyle = "#1f2937";
    ctx.fillRect(4, y - 10, 6, 22);
    ctx.fillStyle = blink ? "#ef4444" : "#4b1d1d";
    ctx.fillRect(0, y - 18, 14, 10);
    if (tr.state === "warn") {
      ctx.fillStyle = blink ? "rgba(239,68,68,.25)" : "rgba(239,68,68,.1)";
      ctx.fillRect(0, y, W, C);
    }
    if (tr.state === "go") {
      for (let i = 0; i < TRAIN_LEN; i += C * 2) {
        const car = i === 0 && tr.dir < 0 || i + C * 2 >= TRAIN_LEN && tr.dir > 0;
        Kit.brick(ctx, tr.x + i + 2, y + 2, C * 2 - 4, C - 4, car ? "#dc2626" : "#facc15", 6);
        ctx.fillStyle = "#1e3a8a";
        ctx.fillRect(tr.x + i + 14, y + 12, C * 2 - 28, 10);
      }
    }
  }
}

function drawCar(o, y, dir) {
  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.fillRect(o.x + 4, y + 10, o.w - 4, C - 12);
  Kit.brick(ctx, o.x + 2, y + 6, o.w - 4, C - 14, o.color, 7);
  // roof / windows
  const front = dir > 0 ? o.x + o.w - 16 : o.x + 6;
  ctx.fillStyle = "#1e293b";
  if (o.w > C) {
    ctx.fillRect(dir > 0 ? o.x + o.w - 22 : o.x + 8, y + 10, 14, C - 22);
    ctx.fillStyle = "#e5e7eb";
    ctx.fillRect(dir > 0 ? o.x + 6 : o.x + 26, y + 9, o.w - 34, C - 20);
  } else {
    ctx.fillRect(o.x + 12, y + 10, o.w - 24, C - 22);
    ctx.fillStyle = o.color;
    ctx.fillRect(o.x + 17, y + 13, o.w - 34, C - 28);
  }
  ctx.fillStyle = "#fef9c3";
  ctx.fillRect(front + (dir > 0 ? 8 : -4), y + 9, 4, 6);
  ctx.fillRect(front + (dir > 0 ? 8 : -4), y + C - 21, 4, 6);
}

function drawPlayer() {
  if (player.carried) return;
  let y = rowY(player.row) + C / 2;
  if (player.hop > 0) {
    const k = 1 - player.hop / HOP_TIME;
    const fromY = rowY(player.fromRow) + C / 2;
    y = fromY + (y - fromY) * k - Math.sin(k * Math.PI) * 14;
  }
  const x = player.x;
  if (player.dead === "splash") return;
  ctx.save();
  ctx.translate(x, y);
  if (player.dead === "splat") ctx.scale(1.5, 0.35);
  const s = player.squash * 0.2;
  ctx.scale(1 + s, 1 - s);
  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.fillRect(-15, -8, 34, 28);
  // body
  Kit.brick(ctx, -16, -16, 32, 30, "#f8fafc", 6);
  // wing
  ctx.fillStyle = "#e2e8f0";
  const wingSide = player.face === 3 ? 6 : -14;
  ctx.fillRect(wingSide, -2, 8, 12);
  // head features by facing
  const fx = [0, 1, 0, -1][player.face], fy = [-1, 0, 1, 0][player.face];
  ctx.fillStyle = "#ef4444";                         // comb
  ctx.fillRect(-4 + fx * 4, -22, 8, 7);
  ctx.fillStyle = "#fb923c";                         // beak
  ctx.fillRect(-4 + fx * 15, -6 + fy * 12 - (fy < 0 ? 4 : 0), 8, 6);
  ctx.fillStyle = "#111";
  if (player.face !== 0) {
    ctx.fillRect(-7 + fx * 8, -10, 4, 4);
    if (fx === 0) ctx.fillRect(3, -10, 4, 4);
  }
  ctx.fillStyle = "#f97316";                         // feet
  ctx.fillRect(-10, 13, 6, 4);
  ctx.fillRect(4, 13, 6, 4);
  ctx.restore();
}

function drawHawk() {
  if (!hawk) return;
  const x = hawk.x, y = hawk.y;
  ctx.fillStyle = "rgba(0,0,0,.3)";
  ctx.fillRect(x - 70, y + 20, 140, 30);
  Kit.brick(ctx, x - 80, y - 8, 160, 22, "#78350f", 6);
  Kit.brick(ctx, x - 22, y - 26, 44, 64, "#92400e", 8);
  ctx.fillStyle = "#f8fafc";
  ctx.fillRect(x - 14, y + 26, 28, 18);
  ctx.fillStyle = "#facc15";
  ctx.fillRect(x - 5, y + 42, 10, 10);
  if (hawk.grabbed) {
    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(x - 14, y - 50, 28, 26);
  }
}

function draw() {
  const r0 = Math.max(0, Math.floor(camRow) - 1), r1 = Math.ceil(camRow) + ROWS + 1;
  for (let r = r0; r <= r1; r++) drawLane(lane(r), r);
  // objects drawn top to bottom so trees overlap correctly
  for (let r = r1; r >= r0; r--) {
    drawLaneObjects(lane(r), r);
    if (r === player.row) drawPlayer();
  }
  for (const q of particles) {
    ctx.globalAlpha = Kit.clamp(q.life * 2, 0, 1);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  drawHawk();
  // big score in the corner
  ctx.font = `900 40px ${FONT}`;
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.fillText(score(), 19, 53);
  ctx.fillStyle = "#fff";
  ctx.fillText(score(), 16, 50);
}

const game = Kit.loop(update, draw);
reset();
draw();
Kit.overlay("Road Hopper", "Hop forward as far as you can! Dodge cars and trains, ride the logs across rivers, and keep moving or the hawk will catch you.\n\nArrows / WASD to hop, or click where you want to go.", "Hop").then(() => game.start());
</script>
</body>
</html>
