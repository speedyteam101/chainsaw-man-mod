<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maze Escape</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script src="../kit.js"></script>
<script>
"use strict";
const ID = "maze-escape";
const FONT = "'Noto Sans', 'DejaVu Sans', sans-serif";
const { canvas, ctx, W, H } = Kit.stage(800, 600);
const ME = Kit.player();
let sideFace = 1;
const TOP = 56;                 // height of the in-canvas status bar
const LEVELS = 10;
const STEP_TIME = 0.085;        // seconds to walk one cell
const N = 1, E = 2, S = 4, Wl = 8; // open-passage bits per cell
const DIRS = [
  { bit: N, dx: 0, dy: -1, back: S },
  { bit: E, dx: 1, dy: 0, back: Wl },
  { bit: S, dx: 0, dy: 1, back: N },
  { bit: Wl, dx: -1, dy: 0, back: E },
];
const KEY_DIR = {
  ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3,
};

let level, score, cols, rows, cell, ox, oy, grid, seen, start, exit, keys, coins, keysNeeded, keysHave;
let player, queued, path, timeLeft, timeMax, fogRadius, state, banner, parts, paused, mazeImg, levelCoins;

/* ---------- maze generation ---------- */

function makeMaze(c, r) {
  const g = new Uint8Array(c * r);
  const visited = new Uint8Array(c * r);
  const stack = [Kit.randInt(0, c * r - 1)];
  visited[stack[0]] = 1;
  while (stack.length) {
    const cur = stack[stack.length - 1];
    const x = cur % c, y = Math.floor(cur / c);
    const options = DIRS.filter((d) => {
      const nx = x + d.dx, ny = y + d.dy;
      return nx >= 0 && ny >= 0 && nx < c && ny < r && !visited[ny * c + nx];
    });
    if (!options.length) { stack.pop(); continue; }
    const d = Kit.pick(options);
    const next = (y + d.dy) * c + (x + d.dx);
    g[cur] |= d.bit;
    g[next] |= d.back;
    visited[next] = 1;
    stack.push(next);
  }
  // knock out a few extra walls so there is more than one route
  const extra = Math.floor(c * r * 0.06);
  for (let k = 0; k < extra; k++) {
    const i = Kit.randInt(0, c * r - 1), x = i % c, y = Math.floor(i / c);
    const d = Kit.pick(DIRS), nx = x + d.dx, ny = y + d.dy;
    if (nx < 0 || ny < 0 || nx >= c || ny >= r) continue;
    g[i] |= d.bit;
    g[ny * c + nx] |= d.back;
  }
  return g;
}

// Breadth-first distances from cell `from`; also returns parents for path finding.
function bfs(from) {
  const dist = new Int32Array(cols * rows).fill(-1);
  const parent = new Int32Array(cols * rows).fill(-1);
  const q = [from];
  dist[from] = 0;
  for (let h = 0; h < q.length; h++) {
    const cur = q[h], x = cur % cols, y = Math.floor(cur / cols);
    for (const d of DIRS) {
      if (!(grid[cur] & d.bit)) continue;
      const n = (y + d.dy) * cols + (x + d.dx);
      if (dist[n] >= 0) continue;
      dist[n] = dist[cur] + 1;
      parent[n] = cur;
      q.push(n);
    }
  }
  return { dist, parent };
}

function buildLevel() {
  cols = Math.min(27, 9 + (level - 1) * 2);
  rows = Math.round(cols * 0.66);
  cell = Math.floor(Math.min((W - 24) / cols, (H - TOP - 20) / rows));
  ox = Math.floor((W - cols * cell) / 2);
  oy = TOP + Math.floor((H - TOP - rows * cell) / 2);
  grid = makeMaze(cols, rows);
  seen = new Uint8Array(cols * rows);

  // start in a corner, exit at the far end of the maze
  start = Kit.pick([0, cols - 1, (rows - 1) * cols, cols * rows - 1]);
  const fromStart = bfs(start).dist;
  let far = 0;
  for (let i = 0; i < fromStart.length; i++) if (fromStart[i] > fromStart[far]) far = i;
  exit = far;
  const maxD = fromStart[exit];

  const used = new Set([start, exit]);
  const deadEnd = (i) => [N, E, S, Wl].filter((b) => grid[i] & b).length === 1;

  keysNeeded = level < 2 ? 0 : Math.min(3, 1 + Math.floor((level - 2) / 3));
  keysHave = 0;
  keys = [];
  for (let k = 0; k < keysNeeded; k++) {
    // prefer dead ends that are a fair walk away and not next to other keys
    let bestI = -1, bestScore = -Infinity;
    for (let tries = 0; tries < 200; tries++) {
      const i = Kit.randInt(0, cols * rows - 1);
      if (used.has(i)) continue;
      let sc = fromStart[i] / maxD + (deadEnd(i) ? 0.5 : 0) + Math.random() * 0.3;
      for (const other of keys) sc -= Math.max(0, 0.6 - (Math.abs(other.x - i % cols) + Math.abs(other.y - Math.floor(i / cols))) / cols);
      if (sc > bestScore) { bestScore = sc; bestI = i; }
    }
    used.add(bestI);
    keys.push({ x: bestI % cols, y: Math.floor(bestI / cols), got: false });
  }

  coins = [];
  const coinCount = Math.round(cols * rows / 14);
  for (let tries = 0; coins.length < coinCount && tries < 2000; tries++) {
    const i = Kit.randInt(0, cols * rows - 1);
    if (used.has(i)) continue;
    if (!deadEnd(i) && Math.random() < 0.6) continue; // coins like dead ends too
    used.add(i);
    coins.push({ x: i % cols, y: Math.floor(i / cols), got: false, spin: Math.random() * 6 });
  }
  levelCoins = 0;

  player = { x: start % cols, y: Math.floor(start / cols), fx: start % cols, fy: Math.floor(start / cols), t: 1, from: null, face: 2, bob: 0 };
  queued = -1;
  path = [];
  fogRadius = level >= 7 ? 3.0 : level >= 4 ? 3.5 : 0;
  timeMax = Math.round(18 + cols * rows * 0.2 + keysNeeded * 6 + (fogRadius ? 12 : 0));
  timeLeft = timeMax;
  renderMaze();
  reveal();
  updateHud();
}

/* ---------- static maze image ---------- */

function renderMaze() {
  mazeImg = document.createElement("canvas");
  mazeImg.width = W;
  mazeImg.height = H;
  const g = mazeImg.getContext("2d");
  const t = Math.max(4, Math.round(cell * 0.2));
  // floor tiles in a soft checker with studs
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++) {
      g.fillStyle = (x + y) % 2 ? "#232a36" : "#262e3b";
      g.fillRect(ox + x * cell, oy + y * cell, cell, cell);
      g.fillStyle = "rgba(255,255,255,.035)";
      g.beginPath();
      g.arc(ox + x * cell + cell / 2, oy + y * cell + cell / 2, cell * 0.18, 0, Math.PI * 2);
      g.fill();
    }
  const hue = [210, 160, 30, 280, 350, 190, 100, 45, 260, 0][(level - 1) % 10];
  const wallColor = `hsl(${hue}, 55%, 52%)`;
  const wallDark = `hsl(${hue}, 55%, 32%)`;
  function wall(x, y, w, h) {
    g.fillStyle = wallDark;
    g.fillRect(x, y + 2, w, h);
    g.fillStyle = wallColor;
    g.fillRect(x, y, w, h);
    g.fillStyle = "rgba(255,255,255,.22)";
    g.fillRect(x, y, w, Math.max(1, Math.min(3, h * 0.25)));
  }
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x, px = ox + x * cell, py = oy + y * cell;
      if (y === 0 && !(grid[i] & N)) wall(px - t / 2, py - t / 2, cell + t, t);
      if (x === 0 && !(grid[i] & Wl)) wall(px - t / 2, py - t / 2, t, cell + t);
      if (!(grid[i] & E)) wall(px + cell - t / 2, py - t / 2, t, cell + t);
      if (!(grid[i] & S)) wall(px - t / 2, py + cell - t / 2, cell + t, t);
    }
  // corner posts, like studs on top of the wall bricks
  for (let y = 0; y <= rows; y++)
    for (let x = 0; x <= cols; x++) {
      g.fillStyle = wallColor;
      g.fillRect(ox + x * cell - t / 2 - 1, oy + y * cell - t / 2 - 1, t + 2, t + 2);
      g.fillStyle = "rgba(255,255,255,.3)";
      g.fillRect(ox + x * cell - t / 4, oy + y * cell - t / 4, t / 2, t / 2);
    }
  // start pad
  g.fillStyle = "rgba(34,197,94,.22)";
  g.fillRect(ox + (start % cols) * cell + 2, oy + Math.floor(start / cols) * cell + 2, cell - 4, cell - 4);
}

/* ---------- flow ---------- */

function updateHud() {
  Kit.hud(`Score ${score}<small>Level ${level}/${LEVELS} | Best ${Kit.best(ID) ?? 0}</small>`);
}

async function newGame() {
  level = 1;
  score = 0;
  parts = [];
  banner = null;
  paused = false;
  buildLevel();
  state = "play";
}

async function levelDone() {
  state = "clear";
  const timeBonus = Math.floor(timeLeft) * 5;
  const gained = 100 * level + timeBonus;
  if (level === 1) Kit.badge(ID, "first-escape", "First Escape", "Found your way out of the first maze.");
  if (level === 4) Kit.badge(ID, "lights-out", "Lights Out", "Escaped your first dark maze.");
  if (level >= 3 && timeLeft >= timeMax / 2) Kit.badge(ID, "quick-feet", "Quick Feet", "Cleared level 3 or later with half the clock still left.");
  if (coins.length && coins.every((c) => c.got)) Kit.badge(ID, "treasure-hunter", "Treasure Hunter", "Grabbed every coin in a maze before escaping.");
  score += gained;
  updateHud();
  Kit.sfx("win");
  const c = cellCenter(player.x, player.y);
  for (let k = 0; k < 40; k++) spark(c.x, c.y, Kit.pick(["#22c55e", "#facc15", "#38bdf8", "#f2f4f5"]), 320);
  banner = { text: `Level ${level} cleared!`, sub: `+${100 * level} exit  +${timeBonus} time bonus`, t: 1.8 };
  await wait(1.8);
  if (level >= LEVELS) return finishRun(true);
  level++;
  const intro = level === 2 ? ["Locked doors", "From now on the exit is locked.\nFind the key first, then head for the door."]
    : level === 4 ? ["Lights out", "The maze is dark from here on.\nYou can only see what is close to you, but the paths you have walked stay on your map."]
    : level === 5 ? ["More keys", "Some doors need two keys now. Grab them all!"]
    : level === 7 ? ["Deeper darkness", "Your light gets smaller. Keep an eye on the clock."]
    : level === 8 ? ["Triple lock", "Three keys per door from here on."]
    : null;
  buildLevel();
  if (intro) {
    loop.stop();
    draw();
    await Kit.overlay(intro[0], intro[1], "Go");
    loop.start();
  }
  banner = { text: `Level ${level}`, sub: keysNeeded ? `Find ${keysNeeded} key${keysNeeded > 1 ? "s" : ""}, then the door` : "Find the door", t: 1.4 };
  state = "play";
}

async function finishRun(won) {
  state = "over";
  if (won) {
    score += 1000;
    Kit.badge(ID, "escape-artist", "Escape Artist", "Escaped all 10 mazes.");
  }
  updateHud();
  loop.stop();
  draw();
  const best = Kit.finish(ID, score);
  Kit.sfx(won ? "win" : "lose");
  await Kit.overlay(
    won ? "You escaped!" : "Out of time!",
    won ? `Every maze beaten!\nEscape bonus: +1000\n\nScore: ${score}\nBest: ${best}`
        : `Lost in level ${level}.\n\nScore: ${score}\nBest: ${best}`,
    "Play again");
  newGame();
  loop.start();
}

let waiter = null;
function wait(sec) {
  return new Promise((resolve) => (waiter = { t: sec, resolve }));
}

/* ---------- movement ---------- */

function canMove(x, y, dir) {
  return !!(grid[y * cols + x] & DIRS[dir].bit);
}

function tryStep(dir) {
  if (!canMove(player.x, player.y, dir)) return false;
  player.from = { x: player.x, y: player.y };
  player.x += DIRS[dir].dx;
  player.y += DIRS[dir].dy;
  player.t = 0;
  player.face = dir;
  if (DIRS[dir].dx) sideFace = DIRS[dir].dx;
  return true;
}

function arrive() {
  reveal();
  const c = cellCenter(player.x, player.y);
  for (const coin of coins) {
    if (!coin.got && coin.x === player.x && coin.y === player.y) {
      coin.got = true;
      score += 25;
      levelCoins++;
      updateHud();
      Kit.sfx("coin");
      for (let k = 0; k < 12; k++) spark(c.x, c.y, "#facc15", 180);
    }
  }
  for (const key of keys) {
    if (!key.got && key.x === player.x && key.y === player.y) {
      key.got = true;
      keysHave++;
      Kit.sfx("score");
      for (let k = 0; k < 20; k++) spark(c.x, c.y, "#fde047", 240);
      if (keysHave === keysNeeded) banner = { text: "Door unlocked!", sub: "Head for the exit", t: 1.3 };
    }
  }
  if (player.y * cols + player.x === exit) {
    if (keysHave >= keysNeeded) {
      path = [];
      levelDone();
    } else if (!banner) {
      banner = { text: "Locked!", sub: `Find ${keysNeeded - keysHave} more key${keysNeeded - keysHave > 1 ? "s" : ""}`, t: 1.1 };
      Kit.sfx("hit");
    }
  }
}

// Marks cells within the light radius as explored (for the fog of war).
function reveal() {
  if (!fogRadius) { seen.fill(1); return; }
  const r = Math.ceil(fogRadius);
  for (let y = player.y - r; y <= player.y + r; y++)
    for (let x = player.x - r; x <= player.x + r; x++)
      if (x >= 0 && y >= 0 && x < cols && y < rows && Math.hypot(x - player.x, y - player.y) <= fogRadius - 0.3) seen[y * cols + x] = 1;
}

Kit.onKey((code) => {
  if (code === "KeyP" && state === "play") { paused = !paused; return; }
  if (state !== "play" || paused) return;
  if (code in KEY_DIR) {
    path = [];
    queued = KEY_DIR[code];
  }
});

canvas.addEventListener("mousedown", (e) => {
  if (state !== "play" || paused) return;
  const p = Kit.pointer(canvas, e);
  const x = Math.floor((p.x - ox) / cell), y = Math.floor((p.y - oy) / cell);
  if (x < 0 || y < 0 || x >= cols || y >= rows) return;
  if (!seen[y * cols + x]) { Kit.sfx("hit"); return; } // can't plan a route into the dark
  const target = y * cols + x;
  const { parent } = bfs(player.y * cols + player.x);
  const route = [];
  for (let cur = target; cur !== -1 && cur !== player.y * cols + player.x; cur = parent[cur]) route.push(cur);
  path = route.reverse();
  queued = -1;
});
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

function update(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
  parts = parts.filter((p) => p.life > 0);
  for (const coin of coins) coin.spin += dt * 4;
  if (banner && (banner.t -= dt) <= 0) banner = null;
  if (waiter && (waiter.t -= dt) <= 0) { const w = waiter; waiter = null; w.resolve(); }
  if (paused || state !== "play") return;

  timeLeft -= dt;
  if (timeLeft <= 0) {
    timeLeft = 0;
    finishRun(false);
    return;
  }

  if (player.t < 1) {
    player.t = Math.min(1, player.t + dt / STEP_TIME);
    player.bob += dt * 20;
    if (player.t >= 1) arrive();
  }
  if (player.t >= 1 && state === "play") {
    // held keys keep walking; a tapped key is remembered until the next cell
    let dir = -1;
    if (queued >= 0) dir = queued;
    else for (const code in KEY_DIR) if (Kit.key(code)) { dir = KEY_DIR[code]; break; }
    if (dir >= 0) {
      if (tryStep(dir)) queued = -1;
      else if (!heldDir(dir)) queued = -1;
      else player.face = dir;
    } else if (path.length) {
      const next = path.shift();
      const nx = next % cols, ny = Math.floor(next / cols);
      const d = DIRS.findIndex((dd) => dd.dx === nx - player.x && dd.dy === ny - player.y);
      if (d < 0 || !tryStep(d)) path = [];
    }
  }
  player.fx = player.from && player.t < 1 ? player.from.x + (player.x - player.from.x) * ease(player.t) : player.x;
  player.fy = player.from && player.t < 1 ? player.from.y + (player.y - player.from.y) * ease(player.t) : player.y;
}

const ease = (t) => t * (2 - t);
const heldDir = (dir) => Object.keys(KEY_DIR).some((c) => KEY_DIR[c] === dir && Kit.key(c));

/* ---------- drawing ---------- */

const cellCenter = (x, y) => ({ x: ox + x * cell + cell / 2, y: oy + y * cell + cell / 2 });

function spark(x, y, color, speed) {
  const a = Math.random() * Math.PI * 2, s = Kit.rand(speed * 0.3, speed);
  parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: Kit.rand(0.4, 0.9), color, size: Kit.rand(3, 6) });
}

function text(str, x, y, size, color, align, weight) {
  ctx.font = `${weight || 800} ${size}px ${FONT}`;
  ctx.fillStyle = color;
  ctx.textAlign = align || "center";
  ctx.textBaseline = "middle";
  ctx.fillText(str, x, y);
}

function drawKeyIcon(x, y, s, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x - s * 0.5, y - s * 0.35, s * 0.5, s * 0.5);       // bow
  ctx.fillStyle = "rgba(0,0,0,.45)";
  ctx.fillRect(x - s * 0.36, y - s * 0.21, s * 0.22, s * 0.22);    // hole
  ctx.fillStyle = color;
  ctx.fillRect(x, y - s * 0.17, s * 0.55, s * 0.16);               // shaft
  ctx.fillRect(x + s * 0.3, y - s * 0.03, s * 0.1, s * 0.2);        // teeth
  ctx.fillRect(x + s * 0.45, y - s * 0.03, s * 0.1, s * 0.26);
}

function drawDoor() {
  const x = ox + (exit % cols) * cell, y = oy + Math.floor(exit / cols) * cell;
  const open = keysHave >= keysNeeded;
  const p = cell * 0.12;
  Kit.brick(ctx, x + p, y + p, cell - p * 2, cell - p * 2, open ? "#16a34a" : "#6b7280", Math.max(2, cell * 0.12));
  ctx.fillStyle = open ? "#052e16" : "#374151";
  ctx.fillRect(x + cell * 0.3, y + cell * 0.28, cell * 0.4, cell * 0.6);
  if (open) {
    const glow = 0.4 + 0.3 * Math.sin(performance.now() / 200);
    ctx.fillStyle = `rgba(134,239,172,${glow})`;
    ctx.fillRect(x + cell * 0.3, y + cell * 0.28, cell * 0.4, cell * 0.6);
  } else {
    ctx.fillStyle = "#facc15";
    ctx.fillRect(x + cell * 0.44, y + cell * 0.45, cell * 0.12, cell * 0.12);
    ctx.fillRect(x + cell * 0.47, y + cell * 0.55, cell * 0.06, cell * 0.14);
  }
}

function drawPlayer() {
  // The player's own BlockOS avatar standing in its cell.
  const c = { x: ox + player.fx * cell + cell / 2, y: oy + player.fy * cell + cell / 2 };
  const s = cell * 0.66;
  const hop = player.t < 1 ? Math.sin(player.t * Math.PI) * cell * 0.08 : 0;
  ctx.fillStyle = "rgba(0,0,0,.3)";
  ctx.beginPath();
  ctx.ellipse(c.x, c.y + s * 0.42, s * 0.42, s * 0.14, 0, 0, Math.PI * 2);
  ctx.fill();
  Kit.drawAvatar(ctx, c.x, c.y + s * 0.45 - hop, cell * 0.74, { look: ME.avatar, facing: sideFace, walk: player.t < 1 ? player.bob : 0 });
}

function drawFog() {
  if (!fogRadius) return;
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++) {
      const d = Math.hypot(x - player.fx, y - player.fy);
      const vis = 1 - Kit.clamp((d - fogRadius + 1.2) / 1.4, 0, 1);
      const a = seen[y * cols + x] ? 0.55 * (1 - vis) : 1 - vis * 0.95;
      if (a <= 0.01) continue;
      ctx.fillStyle = `rgba(8,10,14,${a})`;
      ctx.fillRect(ox + x * cell - 1, oy + y * cell - 1, cell + 2, cell + 2);
    }
}

function draw() {
  ctx.fillStyle = "#11141a";
  ctx.fillRect(0, 0, W, H);
  if (!mazeImg) return;
  ctx.drawImage(mazeImg, 0, 0);

  // route preview for mouse walking
  if (path.length) {
    ctx.fillStyle = "rgba(249,115,22,.35)";
    for (const i of path) {
      const c = cellCenter(i % cols, Math.floor(i / cols));
      ctx.fillRect(c.x - cell * 0.1, c.y - cell * 0.1, cell * 0.2, cell * 0.2);
    }
  }

  drawDoor();
  for (const coin of coins) {
    if (coin.got) continue;
    const c = cellCenter(coin.x, coin.y);
    const w = Math.abs(Math.cos(coin.spin)) * cell * 0.36 + 2;
    Kit.brick(ctx, c.x - w / 2, c.y - cell * 0.18, w, cell * 0.36, "#facc15", Math.min(3, w / 3));
  }
  const tt = performance.now() / 1000;
  for (const key of keys) {
    if (key.got) continue;
    const c = cellCenter(key.x, key.y);
    ctx.fillStyle = `rgba(253,224,71,${0.18 + 0.1 * Math.sin(tt * 5)})`;
    ctx.beginPath();
    ctx.arc(c.x, c.y, cell * 0.45, 0, Math.PI * 2);
    ctx.fill();
    drawKeyIcon(c.x - cell * 0.03, c.y + Math.sin(tt * 4 + key.x) * cell * 0.06, cell * 0.7, "#fde047");
  }
  drawPlayer();
  for (const p of parts) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  drawFog();

  // status bar
  ctx.fillStyle = "#0b0d12";
  ctx.fillRect(0, 0, W, TOP - 6);
  text(`LEVEL ${level}`, 16, 26, 18, "#f2f4f5", "left");
  const pct = timeLeft / timeMax;
  ctx.fillStyle = "#1f2430";
  ctx.beginPath();
  ctx.roundRect(130, 15, 260, 22, 8);
  ctx.fill();
  Kit.brick(ctx, 132, 17, Math.max(8, 256 * pct), 18, pct < 0.2 ? "#ef4444" : pct < 0.45 ? "#facc15" : "#22c55e", 6);
  text(`${Math.ceil(timeLeft)}s`, 400, 26, 17, pct < 0.2 && Math.floor(tt * 4) % 2 ? "#fca5a5" : "#f2f4f5", "left");
  // keys
  let kx = 470;
  if (keysNeeded) {
    for (let k = 0; k < keysNeeded; k++) {
      drawKeyIcon(kx + 8, 27, 30, k < keysHave ? "#fde047" : "#3b4252");
      kx += 34;
    }
  } else {
    text("DOOR OPEN", kx, 26, 13, "#86efac", "left");
    kx += 90;
  }
  Kit.brick(ctx, 640, 16, 18, 20, "#facc15", 4);
  text(`x ${levelCoins}`, 666, 26, 16, "#fde68a", "left");

  if (banner) {
    ctx.globalAlpha = Math.min(1, banner.t * 3);
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.beginPath();
    ctx.roundRect(W / 2 - 220, H / 2 - 56, 440, banner.sub ? 104 : 74, 16);
    ctx.fill();
    text(banner.text, W / 2, H / 2 - 22, 34, "#fde047");
    if (banner.sub) text(banner.sub, W / 2, H / 2 + 22, 16, "#e5e7eb", "center", 700);
    ctx.globalAlpha = 1;
  }
  if (paused) {
    ctx.fillStyle = "rgba(0,0,0,.6)";
    ctx.fillRect(0, 0, W, H);
    text("Paused", W / 2, H / 2 - 10, 46, "#f2f4f5");
    text("Press P to resume", W / 2, H / 2 + 32, 16, "#cbd5e1", "center", 700);
  }
}

const loop = Kit.loop(update, draw);
newGame();
state = "intro";
draw();
Kit.overlay(
  "Maze Escape",
  "Find the exit door before the clock runs out. Each maze is bigger than the last, and there are 10 to escape.\n" +
  "Later doors are locked until you find the keys, and deeper levels are dark.\n" +
  "Coins are worth bonus points.\n\n" +
  "Arrows / WASD: walk (hold to keep going)\nClick a square: walk there\nP: pause",
  "Start"
).then(() => {
  banner = { text: "Level 1", sub: "Find the door", t: 1.4 };
  state = "play";
  loop.start();
});
</script>
