<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paddle Clash</title>
<link rel="stylesheet" href="../kit.css">
<style>
  .choices { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .choices .kit-btn { margin: 0; width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 11px 16px; box-shadow: 0 4px 0 var(--sh, #0b7a47); }
  .choices .kit-btn:active { box-shadow: 0 2px 0 var(--sh, #0b7a47); }
  .choices .kit-btn.sel { outline: 3px solid #fff; outline-offset: 2px; }
  .choices .num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: rgba(0, 0, 0, .25); font-size: 14px; flex: none; }
  .choices small { margin-left: auto; font-size: 13px; font-weight: 600; opacity: .85; }
  .kit-btn.blue { background: var(--blue); --sh: #1d4ed8; }
  .kit-btn.orange { background: var(--orange); --sh: #c2410c; }
  .kit-btn.red { background: var(--red); --sh: #b91c1c; }
  .kit-btn.gray { background: #4b5563; --sh: #374151; }
</style>
</head>
<body>
<script src="../kit.js"></script>
<script>
"use strict";
const ID = "paddle-clash";
const { canvas, ctx, W, H } = Kit.stage(800, 500);
const FONT = "'Noto Sans', 'DejaVu Sans', sans-serif";

const WIN_SCORE = 7;
const PADDLE_W = 14, PADDLE_H = 86, PADDLE_SPEED = 560, BALL = 14;
const START_SPEED = 360, SPEED_UP = 1.06, MAX_SPEED = 950;
const DIFFS = {
  easy: { name: "Easy", speed: 290, error: 62, react: 0.3, predict: false, edges: false, mult: 10, bonus: 50 },
  normal: { name: "Normal", speed: 410, error: 34, react: 0.16, predict: true, edges: false, mult: 20, bonus: 120 },
  hard: { name: "Hard", speed: 560, error: 10, react: 0.06, predict: true, edges: true, mult: 30, bonus: 250 },
};

// 3x5 block digits for the scoreboard
const DIGITS = [
  "111101101101111", "010110010010111", "111001111100111", "111001111001111", "101101111001001",
  "111100111001111", "111100111101111", "111001001001001", "111101111101111", "111101111001111",
];

let mode = "cpu"; // cpu | 2p
let diff = DIFFS.normal;
let state = "menu"; // menu | serve | play | over
let left, right, ball, trail, particles, serveTimer, serveDir, flash, shake, paused, rally;
let mouseY = null, mouseActive = false;

/* ---------- menus ---------- */

// Mode/difficulty picker built from the kit overlay styles. Resolves with the chosen value.
// Arrow keys / W S move, Enter or Space confirms, number keys pick directly.
function choose(title, text, options) {
  return new Promise((resolve) => {
    const o = document.createElement("div");
    o.className = "kit-overlay";
    const panel = document.createElement("div");
    panel.className = "kit-panel";
    const h = document.createElement("h1");
    h.textContent = title;
    const p = document.createElement("p");
    p.textContent = text || "";
    const list = document.createElement("div");
    list.className = "choices";
    panel.append(h, p, list);
    o.appendChild(panel);
    document.body.appendChild(o);
    let sel = 0;
    const buttons = options.map((opt, i) => {
      const b = document.createElement("button");
      b.className = "kit-btn " + (opt.color || "");
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = i + 1;
      b.append(num, opt.label);
      if (opt.hint) {
        const s = document.createElement("small");
        s.textContent = opt.hint;
        b.appendChild(s);
      }
      b.addEventListener("click", () => done(i));
      b.addEventListener("mouseenter", () => select(i));
      list.appendChild(b);
      return b;
    });
    function select(i) {
      sel = (i + buttons.length) % buttons.length;
      buttons.forEach((b, j) => b.classList.toggle("sel", j === sel));
    }
    select(Math.max(0, options.findIndex((opt) => opt.selected)));
    const shownAt = performance.now();
    function done(i) {
      removeEventListener("keydown", onKey, true);
      o.remove();
      Kit.sfx("click");
      resolve(options[i].value);
    }
    function onKey(e) {
      const c = e.code;
      let handled = true;
      if (c === "ArrowUp" || c === "ArrowLeft" || c === "KeyW" || c === "KeyA") select(sel - 1);
      else if (c === "ArrowDown" || c === "ArrowRight" || c === "KeyS" || c === "KeyD") select(sel + 1);
      else if (c === "Enter" || c === "NumpadEnter" || c === "Space") {
        if (performance.now() - shownAt > 350 && !e.repeat) done(sel);
      } else if (/^(Digit|Numpad)[1-9]$/.test(c) && Number(c.slice(-1)) <= buttons.length) done(Number(c.slice(-1)) - 1);
      else handled = false;
      if (handled) { e.preventDefault(); e.stopPropagation(); }
    }
    addEventListener("keydown", onKey, true);
  });
}

async function mainMenu() {
  state = "menu";
  updateHud();
  mode = await choose(
    "Paddle Clash",
    "First to 7 points wins. The ball speeds up on every hit, and moving your paddle as you hit puts spin on it.",
    [
      { label: "1 Player vs CPU", value: "cpu", hint: "W/S, arrows or mouse" },
      { label: "2 Players", value: "2p", color: "blue", hint: "W/S vs Up/Down" },
    ]
  );
  if (mode === "cpu") {
    const d = await choose("Difficulty", "How tough should the CPU be?", [
      { label: "Easy", value: "easy", hint: "relaxed rallies" },
      { label: "Normal", value: "normal", color: "orange", hint: "a fair fight", selected: diff === DIFFS.normal },
      { label: "Hard", value: "hard", color: "red", hint: "sharp and sneaky", selected: diff === DIFFS.hard },
    ]);
    diff = DIFFS[d];
  }
  startMatch();
}

/* ---------- setup ---------- */

function makePaddle(x, color, dark) {
  return { x, y: H / 2 - PADDLE_H / 2, vy: 0, score: 0, color, dark, target: H / 2, think: 0, aim: 0, glow: 0 };
}

function resetField() {
  left = makePaddle(28, "#3b82f6", "#1d4ed8");
  right = makePaddle(W - 28 - PADDLE_W, "#ef4444", "#b91c1c");
  ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, spin: 0, speed: START_SPEED, rot: 0 };
  trail = [];
  particles = [];
  flash = null;
  shake = 0;
  paused = false;
  rally = 0;
}

function startMatch() {
  resetField();
  state = "serve";
  serve(Math.random() < 0.5 ? -1 : 1);
  updateHud();
}

function serve(dir) {
  state = state === "menu" ? "menu" : "serve";
  ball.x = W / 2;
  ball.y = H / 2;
  ball.vx = ball.vy = ball.spin = 0;
  ball.speed = START_SPEED;
  trail = [];
  rally = 0;
  serveDir = dir;
  serveTimer = state === "menu" ? 0.5 : 1.1;
}

function launch() {
  const a = Kit.rand(-0.45, 0.45);
  ball.vx = Math.cos(a) * ball.speed * serveDir;
  ball.vy = Math.sin(a) * ball.speed;
  // the receiving CPU picks how it wants to meet the ball
  pickAim(serveDir > 0 ? right : left);
  if (state !== "menu") Kit.sfx("click");
}

function updateHud() {
  if (state === "menu") return Kit.hud(`Paddle Clash<small>Best ${Kit.best(ID) ?? 0}</small>`);
  if (mode === "cpu") Kit.hud(`${diff.name}<small>Best ${Kit.best(ID) ?? 0}</small>`);
  else Kit.hud(`2 Players<small>First to ${WIN_SCORE}</small>`);
}

/* ---------- input ---------- */

Kit.onKey((code) => {
  if (code === "KeyP" && (state === "play" || state === "serve")) paused = !paused;
});
canvas.addEventListener("mousemove", (e) => {
  mouseY = Kit.pointer(canvas, e).y;
  mouseActive = true;
});
canvas.addEventListener("mouseleave", () => { mouseActive = false; });

/* ---------- physics ---------- */

// Advances a ball (real or simulated) including spin curve and wall bounces. Returns true on a wall hit.
function stepBall(b, dt) {
  b.vy += b.spin * dt;
  b.spin *= Math.pow(0.35, dt);
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  const half = BALL / 2;
  if (b.y < half) { b.y = half; b.vy = Math.abs(b.vy); b.spin *= 0.5; return true; }
  if (b.y > H - half) { b.y = H - half; b.vy = -Math.abs(b.vy); b.spin *= 0.5; return true; }
  return false;
}

// Where will the ball cross x? Simulates forward with the same physics.
function predictY(x) {
  const b = { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, spin: ball.spin };
  for (let i = 0; i < 600; i++) {
    stepBall(b, 1 / 120);
    if ((b.vx > 0 && b.x >= x) || (b.vx < 0 && b.x <= x)) break;
  }
  return b.y;
}

function pickAim(p) {
  p.aim = Kit.rand(-diff.error, diff.error);
  if (diff.edges && Math.random() < 0.6) p.aim += Kit.pick([-1, 1]) * Kit.rand(14, 30); // angle the return
  p.think = 0;
}

function moveHuman(p, up, down, dt, allowMouse) {
  const prev = p.y;
  const dir = (down ? 1 : 0) - (up ? 1 : 0);
  if (dir !== 0) {
    mouseActive = false;
    p.y += dir * PADDLE_SPEED * dt;
  } else if (allowMouse && mouseActive && mouseY !== null) {
    const d = mouseY - (p.y + PADDLE_H / 2);
    p.y += Kit.clamp(d, -1300 * dt, 1300 * dt);
  }
  p.y = Kit.clamp(p.y, 0, H - PADDLE_H);
  p.vy = dt > 0 ? (p.y - prev) / dt : 0;
}

function moveCpu(p, side, dt, d) {
  const prev = p.y;
  p.think -= dt;
  const coming = ball.vx * side > 0;
  if (p.think <= 0) {
    p.think = d.react;
    const faceX = side > 0 ? p.x : p.x + PADDLE_W;
    if (coming && (d.predict || Math.abs(ball.x - faceX) < W * 0.6)) {
      p.target = (d.predict ? predictY(faceX) : ball.y) + p.aim;
    } else {
      p.target = H / 2 + (ball.y - H / 2) * 0.35; // drift back toward the middle
    }
  }
  const delta = p.target - (p.y + PADDLE_H / 2);
  if (Math.abs(delta) > 4) p.y += Math.sign(delta) * Math.min(Math.abs(delta), d.speed * dt);
  p.y = Kit.clamp(p.y, 0, H - PADDLE_H);
  p.vy = dt > 0 ? (p.y - prev) / dt : 0;
}

function touches(p) {
  const half = BALL / 2;
  return ball.x + half >= p.x && ball.x - half <= p.x + PADDLE_W && ball.y + half >= p.y && ball.y - half <= p.y + PADDLE_H;
}

function paddleHit(p, dir) {
  const offset = Kit.clamp((ball.y - (p.y + PADDLE_H / 2)) / (PADDLE_H / 2 + BALL / 2), -1, 1);
  const pv = Kit.clamp(p.vy, -700, 700);
  ball.speed = Math.min(MAX_SPEED, ball.speed * SPEED_UP);
  const angle = offset * 0.85;
  ball.vx = dir * Math.cos(angle) * ball.speed;
  ball.vy = Math.sin(angle) * ball.speed + pv * 0.25;
  ball.spin = pv * 1.6;
  ball.x = dir > 0 ? p.x + PADDLE_W + BALL / 2 : p.x - BALL / 2;
  p.glow = 1;
  rally++;
  shake = Math.min(8, 2 + ball.speed / 200);
  for (let i = 0; i < 12; i++) {
    const a = (dir > 0 ? 0 : Math.PI) + Kit.rand(-1, 1);
    const s = Kit.rand(60, 260);
    particles.push({ x: ball.x, y: ball.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, max: 0.5, color: Kit.pick([p.color, "#fde68a", "#fff"]), size: Kit.rand(3, 6) });
  }
  if (state !== "menu") Kit.sfx("jump");
  pickAim(dir > 0 ? right : left);
}

function goal(scorer) {
  const conceder = scorer === left ? right : left;
  if (state === "menu") return serve(scorer === left ? 1 : -1);
  scorer.score++;
  flash = { color: scorer.color, t: 0.6 };
  shake = 10;
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2, s = Kit.rand(80, 380);
    particles.push({ x: Kit.clamp(ball.x, 0, W), y: ball.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.8, max: 0.8, color: Kit.pick([conceder.color, "#fde68a"]), size: Kit.rand(3, 7) });
  }
  const humanScored = mode === "2p" || scorer === left;
  Kit.sfx(humanScored ? "score" : "hit");
  if (scorer.score >= WIN_SCORE) return endMatch(scorer);
  serve(scorer === left ? 1 : -1); // serve toward the player who conceded
}

async function endMatch(winner) {
  state = "over";
  ball.vx = ball.vy = 0;
  ball.x = -100;
  trail = [];
  let title, text;
  if (mode === "cpu") {
    const won = winner === left;
    const score = left.score * diff.mult + (won ? diff.bonus : 0);
    const best = Kit.finish(ID, score);
    Kit.sfx(won ? "win" : "lose");
    title = won ? "You win!" : "CPU wins";
    text = `${left.score} - ${right.score} on ${diff.name}\nMatch score: ${score}\nBest: ${best}`;
  } else {
    Kit.sfx("win");
    title = winner === left ? "Blue wins!" : "Red wins!";
    text = `${left.score} - ${right.score}`;
  }
  updateHud();
  const next = await choose(title, text, [
    { label: "Rematch", value: "again" },
    { label: "Change mode", value: "menu", color: "gray" },
  ]);
  if (next === "again") startMatch();
  else {
    resetField();
    state = "menu";
    serve(1);
    mainMenu();
  }
}

/* ---------- loop ---------- */

function update(dt) {
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
  }
  particles = particles.filter((p) => p.life > 0);
  if (flash && (flash.t -= dt) <= 0) flash = null;
  shake = Math.max(0, shake - dt * 30);
  left.glow = Math.max(0, left.glow - dt * 3);
  right.glow = Math.max(0, right.glow - dt * 3);
  if (paused || state === "over") return;

  if (state === "menu") {
    moveCpu(left, -1, dt, DIFFS.normal);
    moveCpu(right, 1, dt, DIFFS.normal);
  } else {
    const cpu = mode === "cpu";
    moveHuman(left, Kit.key("KeyW") || (cpu && Kit.key("ArrowUp")), Kit.key("KeyS") || (cpu && Kit.key("ArrowDown")), dt, cpu);
    if (cpu) moveCpu(right, 1, dt, diff);
    else moveHuman(right, Kit.key("ArrowUp"), Kit.key("ArrowDown"), dt, false);
  }

  if (serveTimer > 0) {
    if ((serveTimer -= dt) <= 0) {
      if (state === "serve") state = "play";
      launch();
    }
    return;
  }

  // sub-step so a fast ball can't tunnel through a paddle
  const steps = Math.max(1, Math.ceil((ball.speed * dt) / 5));
  for (let i = 0; i < steps; i++) {
    if (stepBall(ball, dt / steps) && state !== "menu") Kit.sfx("click");
    if (ball.vx < 0 && touches(left)) paddleHit(left, 1);
    else if (ball.vx > 0 && touches(right)) paddleHit(right, -1);
    if (ball.x < -BALL) return goal(right);
    if (ball.x > W + BALL) return goal(left);
  }
  ball.rot += ball.spin * dt * 0.01 + ball.vx * dt * 0.004;
  trail.push({ x: ball.x, y: ball.y });
  if (trail.length > 12) trail.shift();
}

function drawDigit(n, x, y, cell, color) {
  const pattern = DIGITS[n];
  for (let i = 0; i < 15; i++) {
    if (pattern[i] === "1") Kit.brick(ctx, x + (i % 3) * cell, y + Math.floor(i / 3) * cell, cell - 2, cell - 2, color, 3);
  }
}

function drawNumber(n, cx, y, cell, color) {
  const s = String(n);
  const w = s.length * cell * 4 - cell;
  s.split("").forEach((ch, i) => drawDigit(Number(ch), cx - w / 2 + i * cell * 4, y, cell, color));
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(Kit.rand(-shake, shake) * 0.4, Kit.rand(-shake, shake) * 0.4);
  ctx.fillStyle = "#101826";
  ctx.fillRect(-20, -20, W + 40, H + 40);
  // baseplate studs
  ctx.fillStyle = "rgba(255,255,255,.035)";
  for (let y = 12; y < H; y += 25)
    for (let x = 12; x < W; x += 25) {
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  // court halves tint
  ctx.fillStyle = "rgba(59,130,246,.05)";
  ctx.fillRect(0, 0, W / 2, H);
  ctx.fillStyle = "rgba(239,68,68,.05)";
  ctx.fillRect(W / 2, 0, W / 2, H);
  // centre line of bricks
  for (let y = 6; y < H; y += 28) Kit.brick(ctx, W / 2 - 4, y, 8, 16, "rgba(255,255,255,.14)", 2);

  if (flash) {
    ctx.fillStyle = flash.color;
    ctx.globalAlpha = flash.t * 0.35;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // scores
  if (state !== "menu") {
    drawNumber(left.score, W / 2 - 80, 26, 12, "rgba(96,165,250,.55)");
    drawNumber(right.score, W / 2 + 80, 26, 12, "rgba(248,113,113,.55)");
    ctx.font = `800 13px ${FONT}`;
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,.4)";
    ctx.fillText(mode === "cpu" ? "YOU" : "BLUE", W / 2 - 80, 106);
    ctx.fillText(mode === "cpu" ? "CPU" : "RED", W / 2 + 80, 106);
    if (rally >= 3) ctx.fillText(`RALLY ${rally}`, W / 2, H - 14);
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // paddles
  for (const p of [left, right]) {
    if (p.glow > 0) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.glow * 0.35;
      ctx.fillRect(p.x - 6, p.y - 6, PADDLE_W + 12, PADDLE_H + 12);
      ctx.globalAlpha = 1;
    }
    Kit.brick(ctx, p.x, p.y, PADDLE_W, PADDLE_H, p.color, 4);
    ctx.fillStyle = p.dark;
    for (let i = 1; i < 4; i++) ctx.fillRect(p.x + 3, p.y + (PADDLE_H / 4) * i - 1, PADDLE_W - 6, 2);
  }

  // ball trail and ball
  const hot = Kit.clamp((ball.speed - START_SPEED) / (MAX_SPEED - START_SPEED), 0, 1);
  trail.forEach((t, i) => {
    const s = (BALL * (i + 1)) / trail.length * 0.8;
    ctx.globalAlpha = (i / trail.length) * 0.4;
    ctx.fillStyle = hot > 0.5 ? "#fb923c" : "#facc15";
    ctx.fillRect(t.x - s / 2, t.y - s / 2, s, s);
  });
  ctx.globalAlpha = 1;
  if (state !== "over" && !(serveTimer > 0 && state === "serve" && Math.floor(serveTimer * 6) % 2)) {
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(ball.rot);
    Kit.brick(ctx, -BALL / 2, -BALL / 2, BALL, BALL, `hsl(${50 - hot * 40}, 95%, ${62 - hot * 8}%)`, 3);
    ctx.restore();
  }
  ctx.restore();

  if (paused) {
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#f2f4f5";
    ctx.textAlign = "center";
    ctx.font = `900 46px ${FONT}`;
    ctx.fillText("Paused", W / 2, H / 2);
    ctx.font = `700 16px ${FONT}`;
    ctx.fillText("Press P to resume", W / 2, H / 2 + 32);
  }
}

const game = Kit.loop(update, draw);
resetField();
serve(1);
game.start(); // the CPU plays itself behind the menu
mainMenu();
</script>
</body>
</html>
