<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#sky)"/>
  <!-- clouds below -->
  <g fill="#ffffff" opacity=".85"><rect x="-10" y="232" width="190" height="22" rx="11"/><rect x="250" y="240" width="250" height="22" rx="11"/><rect x="150" y="252" width="160" height="20" rx="10"/></g>
  <!-- far islands -->
  <g opacity=".75">
    <rect x="18" y="70" width="70" height="10" fill="#4caf50"/><rect x="26" y="80" width="54" height="12" fill="#8b5a2b"/><rect x="38" y="92" width="30" height="14" fill="#6b7280"/>
    <rect x="392" y="56" width="70" height="10" fill="#4caf50"/><rect x="400" y="66" width="54" height="12" fill="#8b5a2b"/><rect x="412" y="78" width="30" height="14" fill="#6b7280"/>
    <rect x="420" y="40" width="5" height="16" fill="#7c4a23"/><rect x="412" y="28" width="20" height="14" fill="#2f8f3a"/>
  </g>
  <!-- left island -->
  <rect x="-20" y="150" width="150" height="16" fill="#65a30d"/><rect x="-10" y="166" width="130" height="22" fill="#8b5a2b"/><rect x="10" y="188" width="90" height="24" fill="#6b7280"/><rect x="30" y="212" width="50" height="18" fill="#4b5563"/>
  <!-- right island -->
  <rect x="350" y="150" width="150" height="16" fill="#16a34a"/><rect x="360" y="166" width="130" height="22" fill="#8b5a2b"/><rect x="380" y="188" width="90" height="24" fill="#6b7280"/><rect x="400" y="212" width="50" height="18" fill="#4b5563"/>
  <!-- bridge -->
  <rect x="128" y="150" width="224" height="10" fill="#a0522d"/><rect x="128" y="160" width="224" height="4" fill="#7c3a16"/>
  <g fill="#78350f"><rect x="126" y="138" width="6" height="14"/><rect x="348" y="138" width="6" height="14"/></g>
  <!-- stepping stones -->
  <g fill="#a8a29e"><rect x="40" y="118" width="18" height="10"/><rect x="74" y="104" width="18" height="10"/></g>
  <rect x="96" y="84" width="40" height="8" fill="#84cc16"/><rect x="102" y="92" width="28" height="10" fill="#8b5a2b"/>
  <rect x="110" y="70" width="12" height="12" fill="#22c55e"/>
  <!-- fighter 1 (blue) slashing -->
  <g transform="translate(176,72)">
    <rect x="0" y="50" width="13" height="28" fill="#1e3a8a"/><rect x="15" y="50" width="13" height="28" fill="#1e3a8a" transform="rotate(-14 21 50)"/>
    <rect x="0" y="22" width="28" height="28" fill="#2563eb"/>
    <rect x="-12" y="22" width="11" height="26" fill="#f5cd30"/>
    <rect x="29" y="2" width="11" height="26" fill="#f5cd30" transform="rotate(50 34 24)"/>
    <rect x="5" y="2" width="18" height="18" fill="#f5cd30"/><rect x="9" y="7" width="3" height="5" fill="#111"/><rect x="16" y="7" width="3" height="5" fill="#111"/><rect x="10" y="14" width="9" height="2" fill="#111"/>
    <rect x="3" y="-4" width="22" height="7" fill="#1d4ed8"/>
    <g transform="rotate(45 49 10)"><rect x="46" y="-40" width="6" height="44" fill="#e5e7eb"/><rect x="40" y="2" width="18" height="4" fill="#eab308"/><rect x="47" y="6" width="4" height="9" fill="#5b3a1e"/></g>
  </g>
  <!-- fighter 2 (red) knocked back -->
  <g transform="translate(266,64) rotate(14 14 50)">
    <rect x="0" y="50" width="13" height="28" fill="#292524" transform="rotate(16 6 50)"/><rect x="15" y="50" width="13" height="28" fill="#292524"/>
    <rect x="0" y="22" width="28" height="28" fill="#b91c1c"/>
    <rect x="29" y="22" width="11" height="26" fill="#d6d3d1" transform="rotate(-150 34 24)"/>
    <rect x="-12" y="22" width="11" height="26" fill="#d6d3d1" transform="rotate(130 -6 24)"/>
    <rect x="5" y="2" width="18" height="18" fill="#d6d3d1"/><rect x="9" y="7" width="4" height="4" fill="#111"/><rect x="16" y="7" width="4" height="4" fill="#111"/><rect x="11" y="14" width="6" height="5" fill="#111"/>
    <rect x="6" y="-14" width="16" height="16" fill="#1f2328"/><rect x="0" y="0" width="28" height="4" fill="#111"/>
    <g transform="rotate(60 60 30)"><rect x="57" y="-8" width="6" height="40" fill="#e5e7eb"/><rect x="51" y="30" width="18" height="4" fill="#eab308"/></g>
  </g>
  <!-- clash spark -->
  <g fill="#fde047"><rect x="246" y="56" width="10" height="10"/><rect x="238" y="44" width="6" height="6"/><rect x="260" y="46" width="6" height="6"/><rect x="236" y="68" width="6" height="6"/><rect x="262" y="70" width="6" height="6"/></g>
  <!-- health bars -->
  <rect x="172" y="44" width="40" height="6" fill="#111827"/><rect x="173" y="45" width="34" height="4" fill="#22c55e"/>
  <rect x="270" y="38" width="40" height="6" fill="#111827"/><rect x="271" y="39" width="12" height="4" fill="#ef4444"/>
</svg>
