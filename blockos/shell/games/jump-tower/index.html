<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Jumper</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script src="../kit.js"></script>
<script>
"use strict";
const ID = "jump-tower";
const { canvas, ctx, W, H } = Kit.stage(480, 720);
const FONT = "'Noto Sans', 'DejaVu Sans', 'Segoe UI', sans-serif";

const GRAV = 1500, BOUNCE = 830, SPRING = 1450, JET = 1150;
const PW = 30, PH = 34, PLW = 72, PLH = 16;
const MOVE = 380;

let plats, enemies, items, particles, player, camY, topY, maxHeight, alive, t;
let pointerX = null, lastPointerMove = 0;

function reset() {
  plats = [];
  enemies = [];
  items = [];
  particles = [];
  t = 0;
  player = { x: W / 2 - PW / 2, y: H - 120, vx: 0, vy: -BOUNCE, face: 1, jet: 0, squash: 0 };
  camY = 0;
  maxHeight = 0;
  alive = true;
  plats.push({ x: W / 2 - PLW / 2, y: H - 60, w: PLW, type: "normal" });
  topY = H - 60;
  while (topY > -H) generate();
  updateHud();
}

const height = () => Math.floor(maxHeight / 10);
function updateHud() {
  Kit.hud(`Height ${height()}<small>Best ${Kit.best(ID) ?? 0}</small>`);
}

// difficulty 0..1 as you climb
const diff = () => Math.min(1, maxHeight / 25000);

function generate() {
  const d = diff();
  const gap = Kit.rand(60 + d * 70, 95 + d * 95);   // never more than ~190, bounce reaches ~230
  topY -= gap;
  const x = Kit.rand(4, W - PLW - 4);
  const r = Math.random();
  let type = "normal";
  if (r < 0.12 + d * 0.25) type = "moving";
  else if (r < 0.2 + d * 0.3) type = "vanish";
  const p = { x, y: topY, w: PLW, type, dir: Math.random() < 0.5 ? -1 : 1, speed: Kit.rand(60, 110 + d * 120), gone: false };
  plats.push(p);
  if (type !== "vanish" && Math.random() < 0.08) p.spring = Kit.rand(8, PLW - 30);
  // decoy breaking platform between steps
  if (Math.random() < 0.18 + d * 0.25) {
    plats.push({ x: Kit.rand(4, W - PLW - 4), y: topY + gap / 2, w: PLW, type: "break", broken: false, fall: 0 });
  }
  if (maxHeight > 2500 && Math.random() < 0.025 + d * 0.05) {
    enemies.push({ x: Kit.rand(20, W - 60), y: topY - gap / 2, w: 40, h: 30, dir: 1, base: 0, t: Math.random() * 6, dead: false, vy: 0 });
  }
  if (Math.random() < 0.012) items.push({ x: x + PLW / 2 - 12, y: topY - 34, w: 24, h: 30, got: false });
}

canvas.addEventListener("pointermove", (e) => {
  pointerX = Kit.pointer(canvas, e).x;
  lastPointerMove = performance.now();
});
canvas.addEventListener("pointerdown", (e) => {
  pointerX = Kit.pointer(canvas, e).x;
  lastPointerMove = performance.now();
});

function burst(x, y, n, colors, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: Kit.rand(0.3, 0.7), size: Kit.randInt(3, 7), color: Kit.pick(colors) });
  }
}

function update(dt) {
  if (!(dt > 0)) return;   // the first frame after start can report a tiny negative dt
  t += dt;
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 700 * dt; q.life -= dt; }
  particles = particles.filter((q) => q.life > 0);
  player.squash = Math.max(0, player.squash - dt * 4);

  // steering
  const left = Kit.key("ArrowLeft") || Kit.key("KeyA");
  const right = Kit.key("ArrowRight") || Kit.key("KeyD");
  let target = 0;
  if (left || right) target = (right ? 1 : 0) - (left ? 1 : 0);
  else if (pointerX !== null && performance.now() - lastPointerMove < 4000) {
    const dx = pointerX - (player.x + PW / 2);
    // shortest way around the wrap
    const wrapped = Math.abs(dx) > W / 2 ? dx - Math.sign(dx) * W : dx;
    target = Kit.clamp(wrapped / 60, -1, 1);
  }
  player.vx += (target * MOVE - player.vx) * Math.min(1, dt * 10);
  if (Math.abs(target) > 0.1) player.face = Math.sign(target);
  player.x += player.vx * dt;
  if (player.x > W) player.x -= W + PW;
  if (player.x < -PW) player.x += W + PW;

  if (player.jet > 0) {
    player.jet -= dt;
    player.vy = -JET;
    particles.push({ x: player.x + PW / 2 + Kit.rand(-6, 6), y: player.y + PH, vx: Kit.rand(-40, 40), vy: 300, life: 0.4, size: 7, color: Kit.pick(["#fb923c", "#facc15", "#ef4444"]) });
  } else {
    player.vy += GRAV * dt;
  }
  const prevBottom = player.y + PH;
  player.y += player.vy * dt;

  // platforms
  for (const p of plats) {
    if (p.type === "moving") {
      p.x += p.dir * p.speed * dt;
      if (p.x < 0) { p.x = 0; p.dir = 1; }
      if (p.x + p.w > W) { p.x = W - p.w; p.dir = -1; }
    }
    if (p.type === "break" && p.broken) { p.fall += dt * 600; }
    if (p.gone || (p.type === "break" && p.broken) || player.vy <= 0 || !alive) continue;
    const footL = player.x + 5, footR = player.x + PW - 5;
    if (footR > p.x && footL < p.x + p.w && prevBottom <= p.y + 2 && player.y + PH >= p.y) {
      if (p.type === "break") {
        p.broken = true;
        Kit.sfx("hit");
        burst(p.x + p.w / 2, p.y, 10, ["#a16207", "#78350f"], 140);
        continue;
      }
      player.y = p.y - PH;
      const onSpring = p.spring !== undefined && player.x + PW > p.x + p.spring - 4 && player.x < p.x + p.spring + 26;
      if (onSpring) {
        player.vy = -SPRING;
        p.sprung = 0.25;
        Kit.sfx("score");
      } else {
        player.vy = -BOUNCE;
        Kit.sfx("jump");
      }
      player.squash = 1;
      if (p.type === "vanish") {
        p.gone = true;
        burst(p.x + p.w / 2, p.y, 12, ["#f2f4f5", "#bae6fd"], 160);
      }
    }
    if (p.sprung) p.sprung = Math.max(0, p.sprung - dt);
  }

  // enemies: hover side to side; stomp from above or get knocked out
  for (const e of enemies) {
    e.t += dt;
    if (e.dead) { e.vy += GRAV * dt; e.y += e.vy * dt; continue; }
    e.x = (W - e.w) / 2 + Math.sin(e.t * 1.3) * (W / 2 - e.w);
    if (!alive || player.jet > 0) continue;
    if (player.x + PW - 4 > e.x && player.x + 4 < e.x + e.w && player.y + PH > e.y + 4 && player.y + 4 < e.y + e.h) {
      if (player.vy > 0 && prevBottom <= e.y + 12) {
        e.dead = true;
        player.vy = -BOUNCE * 1.1;
        Kit.sfx("score");
        burst(e.x + e.w / 2, e.y, 14, ["#a855f7", "#f2f4f5"], 200);
        maxHeight += 0;
      } else {
        knockOut();
      }
    }
  }
  for (const it of items) {
    if (it.got || !alive) continue;
    if (player.x + PW > it.x && player.x < it.x + it.w && player.y + PH > it.y && player.y < it.y + it.h) {
      it.got = true;
      player.jet = 2.4;
      Kit.sfx("win");
    }
  }

  // camera + score
  const h = H - 120 - player.y;
  if (alive && h > maxHeight) maxHeight = h;
  const targetCam = player.y - H * 0.42;
  if (targetCam < camY) camY = targetCam;
  while (topY > camY - 120) generate();
  plats = plats.filter((p) => p.y < camY + H + 200 && !(p.type === "break" && p.fall > 800));
  enemies = enemies.filter((e) => e.y < camY + H + 200);
  items = items.filter((i) => !i.got && i.y < camY + H + 100);

  if (alive && player.y > camY + H + 40) fallOut();
  updateHud();
}

function knockOut() {
  if (!alive) return;
  alive = false;
  player.vy = 200;
  Kit.sfx("hit");
  burst(player.x + PW / 2, player.y + PH / 2, 16, ["#ef4444", "#f2f4f5"], 220);
}

let ending = false;
async function fallOut() {
  if (ending) return;
  ending = true;
  alive = false;
  game.stop();
  Kit.sfx("lose");
  const final = height();
  const best = Kit.finish(ID, final);
  updateHud();
  await Kit.overlay("You fell!", `Height: ${final}\nBest: ${best}`, "Jump again");
  ending = false;
  reset();
  game.start();
}

// ---------- drawing ----------
function lerpColor(a, b, f) {
  const pa = a.match(/\w\w/g).map((h) => parseInt(h, 16)), pb = b.match(/\w\w/g).map((h) => parseInt(h, 16));
  return `rgb(${pa.map((v, i) => Math.round(v + (pb[i] - v) * f)).join(",")})`;
}
const SKIES = [["#7dd3fc", "#e0f2fe"], ["#f97316", "#fde68a"], ["#4c1d95", "#db2777"], ["#020617", "#1e1b4b"]];
function skyAt(level) {
  const f = Kit.clamp(level, 0, SKIES.length - 1);
  const i = Math.min(SKIES.length - 2, Math.floor(f)), k = f - i;
  return [lerpColor(SKIES[i][0], SKIES[i + 1][0], k), lerpColor(SKIES[i][1], SKIES[i + 1][1], k)];
}

function drawBackground() {
  const [top, bottom] = skyAt(maxHeight / 9000);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // stars fade in high up
  const starA = Kit.clamp((maxHeight - 15000) / 8000, 0, 0.8);
  if (starA > 0) {
    ctx.fillStyle = `rgba(255,255,255,${starA})`;
    for (let i = 0; i < 60; i++) {
      const y = ((i * 97 - camY * 0.05) % H + H) % H;
      ctx.fillRect((i * 151) % W, y, 2, 2);
    }
  }
  // blocky clouds with parallax
  ctx.fillStyle = `rgba(255,255,255,${0.5 - starA * 0.5})`;
  for (let i = 0; i < 8; i++) {
    const y = ((i * 210 - camY * 0.3) % (H + 200) + H + 200) % (H + 200) - 100;
    const x = (i * 173) % (W - 80);
    ctx.fillRect(x, y, 96, 24);
    ctx.fillRect(x + 20, y - 16, 48, 16);
  }
}

function drawPlatform(p) {
  const y = p.y - camY + (p.fall || 0);
  if (y < -40 || y > H + 40 || p.gone) return;
  const colors = { normal: "#22c55e", moving: "#3b82f6", vanish: "#e2e8f0", break: "#a16207" };
  if (p.type === "break") {
    const off = p.broken ? Math.min(14, p.fall * 0.05) : 0;
    ctx.save();
    ctx.globalAlpha = p.broken ? Math.max(0, 1 - p.fall / 600) : 1;
    Kit.brick(ctx, p.x - off, y, p.w / 2 - 1, PLH, colors.break, 3);
    Kit.brick(ctx, p.x + p.w / 2 + 1 + off, y, p.w / 2 - 1, PLH, colors.break, 3);
    ctx.fillStyle = "#422006";
    ctx.fillRect(p.x + 10 - off, y + 6, 10, 2);
    ctx.fillRect(p.x + p.w - 22 + off, y + 8, 12, 2);
    ctx.restore();
    return;
  }
  Kit.brick(ctx, p.x, y, p.w, PLH, colors[p.type], 4);
  // studs
  ctx.fillStyle = "rgba(255,255,255,.25)";
  for (let sx = p.x + 8; sx < p.x + p.w - 8; sx += 16) ctx.fillRect(sx, y - 3, 8, 3);
  if (p.type === "vanish") {
    ctx.strokeStyle = "rgba(14,165,233,.6)";
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(p.x + 2, y + 2, p.w - 4, PLH - 4);
    ctx.setLineDash([]);
  }
  if (p.spring !== undefined) {
    const sx = p.x + p.spring, compressed = p.sprung > 0;
    ctx.fillStyle = "#94a3b8";
    const sh = compressed ? 18 : 10;
    for (let i = 0; i < 3; i++) ctx.fillRect(sx + 3, y - sh + i * (sh / 3), 16, 2);
    Kit.brick(ctx, sx, y - sh - 6, 22, 7, "#ef4444", 2);
  }
}

function drawEnemy(e) {
  const y = e.y - camY + Math.sin(e.t * 4) * 5;
  ctx.save();
  if (e.dead) { ctx.globalAlpha = 0.7; }
  Kit.brick(ctx, e.x, y + 6, e.w, e.h - 6, "#7c3aed", 6);
  ctx.fillStyle = "#c4b5fd";
  ctx.fillRect(e.x + 8, y, e.w - 16, 8);
  // eyes
  ctx.fillStyle = "#fff";
  ctx.fillRect(e.x + 8, y + 12, 9, 9);
  ctx.fillRect(e.x + e.w - 17, y + 12, 9, 9);
  ctx.fillStyle = "#111";
  ctx.fillRect(e.x + 11, y + 15, 4, 4);
  ctx.fillRect(e.x + e.w - 14, y + 15, 4, 4);
  // wing flap
  const flap = Math.sin(e.t * 18) * 6;
  ctx.fillStyle = "#a78bfa";
  ctx.fillRect(e.x - 10, y + 10 + flap, 10, 6);
  ctx.fillRect(e.x + e.w, y + 10 - flap, 10, 6);
  ctx.restore();
}

function drawItem(it) {
  const y = it.y - camY + Math.sin(t * 3) * 3;
  Kit.brick(ctx, it.x, y + 4, 10, 24, "#94a3b8", 3);
  Kit.brick(ctx, it.x + 14, y + 4, 10, 24, "#94a3b8", 3);
  ctx.fillStyle = "#ef4444";
  ctx.fillRect(it.x + 1, y, 8, 6);
  ctx.fillRect(it.x + 15, y, 8, 6);
  ctx.fillStyle = "#facc15";
  ctx.fillRect(it.x + 2, y + 28, 6, 4);
  ctx.fillRect(it.x + 16, y + 28, 6, 4);
}

function drawPlayer() {
  const x = player.x, y = player.y - camY;
  const sq = player.squash * 0.25;
  const w = PW * (1 + sq), h = PH * (1 - sq);
  const ox = x - (w - PW) / 2, oy = y + (PH - h);
  for (const dx of [0, -W - PW, W + PW]) {   // draw wrapped copies at the edges
    const px = ox + dx;
    if (px > W || px + w < 0) continue;
    if (player.jet > 0) {
      Kit.brick(ctx, px - 6, oy + 10, 8, 20, "#94a3b8", 2);
      Kit.brick(ctx, px + w - 2, oy + 10, 8, 20, "#94a3b8", 2);
    }
    // legs
    ctx.fillStyle = "#1d4ed8";
    ctx.fillRect(px + 5, oy + h - 9, 8, 9);
    ctx.fillRect(px + w - 13, oy + h - 9, 8, 9);
    Kit.brick(ctx, px, oy + h * 0.42, w, h * 0.42, "#f97316", 4);      // torso
    Kit.brick(ctx, px + 3, oy, w - 6, h * 0.46, "#fcd34d", 5);         // head
    ctx.fillStyle = "#111";
    const ex = px + w / 2 + player.face * 4;
    ctx.fillRect(ex - 7, oy + 6, 4, 5);
    ctx.fillRect(ex + 3, oy + 6, 4, 5);
    ctx.fillRect(ex - 4, oy + 13, 8, 2);
    if (!alive) {
      ctx.fillStyle = "#fff";
      ctx.fillRect(ex - 8, oy + 6, 6, 2);
      ctx.fillRect(ex + 2, oy + 6, 6, 2);
    }
  }
}

function draw() {
  drawBackground();
  for (const p of plats) drawPlatform(p);
  for (const it of items) drawItem(it);
  for (const e of enemies) drawEnemy(e);
  drawPlayer();
  for (const q of particles) {
    ctx.globalAlpha = Kit.clamp(q.life * 2.5, 0, 1);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - camY - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  // best height marker
  const best = Kit.best(ID);
  if (best) {
    const by = H - 120 - best * 10 - camY;
    if (by > 0 && by < H) {
      ctx.fillStyle = "rgba(250,204,21,.8)";
      for (let x = 0; x < W; x += 24) ctx.fillRect(x, by, 14, 3);
      ctx.font = `800 13px ${FONT}`;
      ctx.textAlign = "right";
      ctx.fillText("BEST", W - 6, by - 6);
    }
  }
}

const game = Kit.loop(update, draw);
reset();
draw();
Kit.overlay("Sky Jumper", "Bounce from platform to platform and climb as high as you can.\nGreen is solid, blue moves, white vanishes after one bounce,\nbrown crumbles. Red springs launch you. Grab a jetpack to blast up.\nStomp flying critters from above, but don't bump into them!\n\nLeft / Right or A / D to steer (or move the mouse).\nRun off one side to wrap to the other.", "Jump").then(() => game.start());
</script>
</body>
</html>
