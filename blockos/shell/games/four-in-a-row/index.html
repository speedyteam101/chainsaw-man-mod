<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four in a Row</title>
<link rel="stylesheet" href="../kit.css">
<style>
  .choices { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .choices .kit-btn { margin: 0; width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 11px 16px; box-shadow: 0 4px 0 var(--sh, #0b7a47); }
  .choices .kit-btn:active { box-shadow: 0 2px 0 var(--sh, #0b7a47); }
  .choices .kit-btn.sel { outline: 3px solid #fff; outline-offset: 2px; }
  .choices .num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: rgba(0, 0, 0, .25); font-size: 14px; flex: none; }
  .choices small { margin-left: auto; font-size: 13px; font-weight: 600; opacity: .85; }
  .kit-btn.blue { background: var(--blue); --sh: #1d4ed8; }
  .kit-btn.orange { background: var(--orange); --sh: #c2410c; }
  .kit-btn.red { background: var(--red); --sh: #b91c1c; }
  .kit-btn.gray { background: #4b5563; --sh: #374151; }
</style>
</head>
<body>
<script src="../kit.js"></script>
<script>
"use strict";
const ID = "four-in-a-row";
const COLS = 7, ROWS = 6, CELL = 78;
const { canvas, ctx, W, H } = Kit.stage(640, 680);
const FONT = "'Noto Sans', 'DejaVu Sans', sans-serif";
const ME = Kit.player().name;
const badge = (id, name, desc) => Kit.badge(ID, id, name, desc);
const BX = (W - COLS * CELL) / 2, BY = 118; // board top-left
const DISC_R = 30;
const COLORS = {
  1: { main: "#ef4444", light: "#f87171", dark: "#b91c1c" },
  2: { main: "#facc15", light: "#fde047", dark: "#ca8a04" },
};
const DIFFS = {
  easy: { name: "Easy", depth: 1, random: 0.35 },
  medium: { name: "Medium", depth: 4, random: 0 },
  hard: { name: "Hard", depth: 7, random: 0 },
};

let mode = "cpu", diff = DIFFS.medium;
let phase = "menu"; // menu | input | cpu | drop | end
let board, heights, turn, starter, hoverCol, drop, winLine, result, tally, streak, round, endTime, moves;

/* ---------- menus ---------- */

// Mode/difficulty picker built from the kit overlay styles. Resolves with the chosen value.
// Arrow keys / W S move, Enter or Space confirms, number keys pick directly.
function choose(title, text, options) {
  return new Promise((resolve) => {
    const o = document.createElement("div");
    o.className = "kit-overlay";
    const panel = document.createElement("div");
    panel.className = "kit-panel";
    const h = document.createElement("h1");
    h.textContent = title;
    const p = document.createElement("p");
    p.textContent = text || "";
    const list = document.createElement("div");
    list.className = "choices";
    panel.append(h, p, list);
    o.appendChild(panel);
    document.body.appendChild(o);
    let sel = 0;
    const buttons = options.map((opt, i) => {
      const b = document.createElement("button");
      b.className = "kit-btn " + (opt.color || "");
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = i + 1;
      b.append(num, opt.label);
      if (opt.hint) {
        const s = document.createElement("small");
        s.textContent = opt.hint;
        b.appendChild(s);
      }
      b.addEventListener("click", () => done(i));
      b.addEventListener("mouseenter", () => select(i));
      list.appendChild(b);
      return b;
    });
    function select(i) {
      sel = (i + buttons.length) % buttons.length;
      buttons.forEach((b, j) => b.classList.toggle("sel", j === sel));
    }
    select(Math.max(0, options.findIndex((opt) => opt.selected)));
    const shownAt = performance.now();
    function done(i) {
      removeEventListener("keydown", onKey, true);
      o.remove();
      Kit.sfx("click");
      resolve(options[i].value);
    }
    function onKey(e) {
      const c = e.code;
      let handled = true;
      if (c === "ArrowUp" || c === "ArrowLeft" || c === "KeyW" || c === "KeyA") select(sel - 1);
      else if (c === "ArrowDown" || c === "ArrowRight" || c === "KeyS" || c === "KeyD") select(sel + 1);
      else if (c === "Enter" || c === "NumpadEnter" || c === "Space") {
        if (performance.now() - shownAt > 350 && !e.repeat) done(sel);
      } else if (/^(Digit|Numpad)[1-9]$/.test(c) && Number(c.slice(-1)) <= buttons.length) done(Number(c.slice(-1)) - 1);
      else handled = false;
      if (handled) { e.preventDefault(); e.stopPropagation(); }
    }
    addEventListener("keydown", onKey, true);
  });
}

async function mainMenu() {
  phase = "menu";
  round++; // invalidates any pending CPU move
  updateHud();
  mode = await choose(
    "Four in a Row",
    "Take turns dropping discs. Line up four of your colour across, down or diagonally to win.\n\n" +
    "Mouse: point and click a column\nKeys: Left / Right then Space, or press 1 to 7",
    [
      { label: "1 Player vs CPU", value: "cpu", hint: "you are red" },
      { label: "2 Players", value: "2p", color: "blue", hint: "red vs yellow" },
    ]
  );
  if (mode === "cpu") {
    const d = await choose("Difficulty", "How hard should the CPU think?", [
      { label: "Easy", value: "easy", hint: "makes mistakes" },
      { label: "Medium", value: "medium", color: "orange", hint: "plans ahead", selected: diff === DIFFS.medium },
      { label: "Hard", value: "hard", color: "red", hint: "deep search", selected: diff === DIFFS.hard },
    ]);
    diff = DIFFS[d];
  }
  tally = { 1: 0, 2: 0, draw: 0 };
  streak = 0;
  starter = 1;
  newRound();
}

/* ---------- rules ---------- */

function newRound() {
  board = new Array(COLS * ROWS).fill(0);
  heights = new Array(COLS).fill(0);
  turn = starter;
  drop = null;
  winLine = null;
  result = null;
  moves = 0;
  round++;
  if (hoverCol === undefined) hoverCol = 3;
  updateHud();
  nextTurn();
}

const isHuman = (p) => mode === "2p" || p === 1;

function nextTurn() {
  if (isHuman(turn)) {
    phase = "input";
  } else {
    phase = "cpu";
    const myRound = round;
    const started = performance.now();
    // let the "thinking" text render before the search blocks the thread
    setTimeout(() => {
      if (round !== myRound || phase !== "cpu") return;
      const col = cpuMove();
      const wait = Math.max(0, 420 - (performance.now() - started));
      setTimeout(() => { if (round === myRound && phase === "cpu") startDrop(col); }, wait);
    }, 60);
  }
}

function startDrop(col) {
  if (heights[col] >= ROWS) return false;
  const row = ROWS - 1 - heights[col];
  heights[col]++; // reserve the slot now; the disc is written to the board when it lands
  drop = { col, row, player: turn, y: BY - CELL / 2, vy: 0, target: BY + row * CELL + CELL / 2, bounces: 0 };
  phase = "drop";
  return true;
}

function land() {
  const { col, row, player } = drop;
  board[row * COLS + col] = player;
  drop = null;
  moves++;
  Kit.sfx("click");
  const line = findWin(row, col, player);
  if (line) return endRound(player, line);
  if (moves === COLS * ROWS) return endRound(0, null);
  turn = 3 - turn;
  nextTurn();
}

function findWin(r, c, p) {
  for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const line = [[r, c]];
    for (const s of [1, -1]) {
      let rr = r + dr * s, cc = c + dc * s;
      while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && board[rr * COLS + cc] === p) {
        line.push([rr, cc]);
        rr += dr * s;
        cc += dc * s;
      }
    }
    if (line.length >= 4) return line.sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  }
  return null;
}

function endRound(winner, line) {
  phase = "end";
  endTime = performance.now();
  winLine = line;
  if (winner) tally[winner]++; else tally.draw++;
  if (mode === "cpu") {
    if (winner === 1) streak++;
    else if (winner === 2) streak = 0;
    if (winner === 1) {
      badge("first-win", "Four Up", "Beat the CPU at Four in a Row.");
      if (diff === DIFFS.hard) badge("hard-win", "Connect Master", "Beat the Hard CPU.");
      if (streak >= 3) badge("streak-3", "Hat Trick", "Beat the CPU 3 rounds in a row.");
      if (board.filter((v) => v === 1).length <= 4) badge("speed-four", "Speed Four", "Beat the CPU using only 4 discs.");
      if (line && new Set(line.map((q) => q[0])).size > 1 && new Set(line.map((q) => q[1])).size > 1) badge("diagonal", "Diagonal Dash", "Beat the CPU with a diagonal line.");
    }
    Kit.finish(ID, streak);
    result = winner === 1 ? "You win!" : winner === 2 ? "CPU wins" : "Draw";
    Kit.sfx(winner === 1 ? "win" : winner === 2 ? "lose" : "hit");
  } else {
    result = winner === 1 ? "Red wins!" : winner === 2 ? "Yellow wins!" : "Draw";
    Kit.sfx(winner ? "win" : "hit");
  }
  starter = 3 - starter;
  updateHud();
}

function updateHud() {
  if (phase === "menu" || mode === "2p") return Kit.hud(`Four in a Row<small>${mode === "2p" && phase !== "menu" ? "2 Players" : "Best streak " + (Kit.best(ID) ?? 0)}</small>`);
  Kit.hud(`Streak ${streak}<small>${diff.name} | Best ${Kit.best(ID) ?? 0}</small>`);
}

/* ---------- CPU: negamax with alpha-beta ---------- */

const ORDER = [3, 2, 4, 1, 5, 0, 6]; // centre-first move ordering makes pruning much stronger
const WINDOWS = [];
for (let r = 0; r < ROWS; r++)
  for (let c = 0; c < COLS; c++)
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const er = r + dr * 3, ec = c + dc * 3;
      if (er < 0 || er >= ROWS || ec < 0 || ec >= COLS) continue;
      WINDOWS.push([0, 1, 2, 3].map((k) => (r + dr * k) * COLS + (c + dc * k)));
    }

function evaluate(p) {
  const o = 3 - p;
  let score = 0;
  for (let r = 0; r < ROWS; r++) {
    const v = board[r * COLS + 3];
    if (v === p) score += 4; else if (v === o) score -= 4;
  }
  for (const w of WINDOWS) {
    let mine = 0, theirs = 0;
    for (const i of w) {
      if (board[i] === p) mine++;
      else if (board[i] === o) theirs++;
    }
    if (mine && theirs) continue;
    if (mine === 3) score += 40; else if (mine === 2) score += 8;
    else if (theirs === 3) score -= 50; else if (theirs === 2) score -= 8;
  }
  return score;
}

function wins(r, c, p) {
  for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    let n = 1;
    for (const s of [1, -1]) {
      let rr = r + dr * s, cc = c + dc * s;
      while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && board[rr * COLS + cc] === p) { n++; rr += dr * s; cc += dc * s; }
    }
    if (n >= 4) return true;
  }
  return false;
}

// Score of the position for `p`, who is about to move.
function negamax(depth, alpha, beta, p) {
  let best = -Infinity;
  for (const c of ORDER) {
    if (heights[c] >= ROWS) continue;
    const r = ROWS - 1 - heights[c];
    board[r * COLS + c] = p;
    heights[c]++;
    let score;
    if (wins(r, c, p)) score = 100000 + depth; // faster wins score higher
    else if (depth === 0) score = evaluate(p);
    else score = -negamax(depth - 1, -beta, -alpha, 3 - p);
    board[r * COLS + c] = 0;
    heights[c]--;
    if (score > best) best = score;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best === -Infinity ? 0 : best; // no moves: draw
}

function cpuMove() {
  const legal = ORDER.filter((c) => heights[c] < ROWS);
  if (Math.random() < diff.random) return Kit.pick(legal);
  let bestScore = -Infinity, bestCols = [];
  for (const c of legal) {
    const r = ROWS - 1 - heights[c];
    board[r * COLS + c] = 2;
    heights[c]++;
    const score = wins(r, c, 2) ? 1e6 : -negamax(diff.depth - 1, -Infinity, Infinity, 1);
    board[r * COLS + c] = 0;
    heights[c]--;
    if (score > bestScore) { bestScore = score; bestCols = [c]; }
    else if (score === bestScore) bestCols.push(c);
  }
  return Kit.pick(bestCols);
}

/* ---------- input ---------- */

function humanDrop(col) {
  if (phase !== "input" || col < 0 || col >= COLS) return;
  hoverCol = col;
  if (!startDrop(col)) Kit.sfx("hit");
}

function advance() {
  if (phase === "end" && performance.now() - endTime > 500) {
    Kit.sfx("click");
    newRound();
  }
}

Kit.onKey((code) => {
  if (phase === "menu") return;
  if (code === "KeyM") return mainMenu();
  if (phase === "end") {
    if (code === "Space" || code === "Enter" || code === "NumpadEnter") advance();
    return;
  }
  if (code === "ArrowLeft" || code === "KeyA") hoverCol = (hoverCol + COLS - 1) % COLS;
  else if (code === "ArrowRight" || code === "KeyD") hoverCol = (hoverCol + 1) % COLS;
  else if (code === "Space" || code === "Enter" || code === "NumpadEnter" || code === "ArrowDown" || code === "KeyS") humanDrop(hoverCol);
  else if (/^(Digit|Numpad)[1-7]$/.test(code)) humanDrop(Number(code.slice(-1)) - 1);
});

function colAt(e) {
  const p = Kit.pointer(canvas, e);
  return Math.floor((p.x - BX) / CELL);
}
canvas.addEventListener("mousemove", (e) => {
  const c = colAt(e);
  if (c >= 0 && c < COLS) hoverCol = c;
});
canvas.addEventListener("click", (e) => {
  if (phase === "end") return advance();
  humanDrop(colAt(e));
});

/* ---------- loop ---------- */

function update(dt) {
  if (phase !== "drop" || !drop) return;
  drop.vy += 3200 * dt;
  drop.y += drop.vy * dt;
  if (drop.y >= drop.target) {
    drop.y = drop.target;
    if (drop.bounces < 1 && drop.vy > 500) {
      drop.vy = -drop.vy * 0.22;
      drop.bounces++;
      Kit.sfx("click");
    } else {
      land();
    }
  }
}

function drawDisc(x, y, p, alpha) {
  const c = COLORS[p];
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = c.dark;
  ctx.beginPath();
  ctx.arc(x, y + 2, DISC_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = c.main;
  ctx.beginPath();
  ctx.arc(x, y, DISC_R - 1, 0, Math.PI * 2);
  ctx.fill();
  // raised stud in the middle, like a round brick
  ctx.fillStyle = c.dark;
  ctx.beginPath();
  ctx.arc(x, y + 2, DISC_R * 0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = c.light;
  ctx.beginPath();
  ctx.arc(x, y, DISC_R * 0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.35)";
  ctx.beginPath();
  ctx.arc(x - 5, y - 6, DISC_R * 0.18, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

const cellX = (c) => BX + c * CELL + CELL / 2;
const cellY = (r) => BY + r * CELL + CELL / 2;

function drawBoard() {
  const bw = COLS * CELL, bh = ROWS * CELL;
  // board face with holes (even-odd fill)
  ctx.beginPath();
  ctx.roundRect(BX - 10, BY - 10, bw + 20, bh + 20, 14);
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      ctx.moveTo(cellX(c) + DISC_R + 3, cellY(r));
      ctx.arc(cellX(c), cellY(r), DISC_R + 3, 0, Math.PI * 2);
    }
  ctx.fillStyle = "#2563eb";
  ctx.fill("evenodd");
  // brick seams and hole rims
  ctx.strokeStyle = "rgba(0,0,0,.18)";
  ctx.lineWidth = 2;
  for (let r = 1; r < ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(BX - 10, BY + r * CELL);
    ctx.lineTo(BX + bw + 10, BY + r * CELL);
    ctx.stroke();
  }
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      ctx.strokeStyle = "rgba(0,0,0,.3)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cellX(c), cellY(r), DISC_R + 3, Math.PI * 1.05, Math.PI * 1.95);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.beginPath();
      ctx.arc(cellX(c), cellY(r), DISC_R + 3, Math.PI * 0.05, Math.PI * 0.95);
      ctx.stroke();
    }
  ctx.fillStyle = "rgba(255,255,255,.16)";
  ctx.fillRect(BX - 4, BY - 8, bw + 8, 4);
  // feet
  Kit.brick(ctx, BX - 26, BY + bh - 40, 18, 60, "#1d4ed8", 4);
  Kit.brick(ctx, BX + bw + 8, BY + bh - 40, 18, 60, "#1d4ed8", 4);
}

function draw() {
  const t = performance.now() / 1000;
  ctx.fillStyle = "#14161f";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,.03)";
  for (let y = 16; y < H; y += 32)
    for (let x = 16; x < W; x += 32) {
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fill();
    }

  if (!board) return;

  // column highlight + hover disc
  if (phase === "input") {
    ctx.fillStyle = "rgba(255,255,255,.06)";
    ctx.fillRect(BX + hoverCol * CELL, BY - 6, CELL, ROWS * CELL + 12);
    drawDisc(cellX(hoverCol), BY - 50 + Math.sin(t * 5) * 3, turn, 0.95);
  }

  // settled and falling discs sit behind the board face
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (board[r * COLS + c]) {
        const dim = winLine && !winLine.some(([wr, wc]) => wr === r && wc === c);
        drawDisc(cellX(c), cellY(r), board[r * COLS + c], dim ? 0.45 : 1);
      }
  if (drop) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, BY + ROWS * CELL);
    ctx.clip();
    drawDisc(cellX(drop.col), drop.y, drop.player);
    ctx.restore();
  }
  drawBoard();

  // winning line
  if (winLine) {
    const pulse = 0.6 + 0.4 * Math.sin(t * 8);
    for (const [r, c] of winLine) {
      ctx.strokeStyle = `rgba(255,255,255,${pulse})`;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(cellX(c), cellY(r), DISC_R + 1, 0, Math.PI * 2);
      ctx.stroke();
    }
    const a = winLine[0], b = winLine[winLine.length - 1];
    ctx.strokeStyle = "rgba(255,255,255,.85)";
    ctx.lineCap = "round";
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(cellX(a[1]), cellY(a[0]));
    ctx.lineTo(cellX(b[1]), cellY(b[0]));
    ctx.stroke();
    ctx.lineCap = "butt";
  }

  // status line
  ctx.textAlign = "center";
  ctx.font = `800 24px ${FONT}`;
  let status = "";
  let color = "#f2f4f5";
  if (phase === "end") { status = result; color = winLine ? COLORS[board[winLine[0][0] * COLS + winLine[0][1]]].light : "#cbd5e1"; }
  else if (phase === "cpu") status = "CPU is thinking" + ".".repeat(1 + (Math.floor(t * 3) % 3));
  else if (phase === "input" || phase === "drop") {
    const p = drop ? drop.player : turn;
    status = mode === "cpu" ? (p === 1 ? "Your turn" : "CPU's move") : (p === 1 ? "Red's turn" : "Yellow's turn");
    color = COLORS[p].light;
  }
  if (phase !== "input") {
    ctx.fillStyle = color;
    ctx.fillText(status, W / 2, 48);
  } else {
    ctx.fillStyle = color;
    ctx.font = `800 18px ${FONT}`;
    ctx.fillText(status, W / 2, 26);
  }

  // scoreboard
  const y = BY + ROWS * CELL + 46;
  const names = mode === "cpu" ? [ME, "Draws", "CPU"] : ["Red", "Draws", "Yellow"];
  const vals = [tally[1], tally.draw, tally[2]];
  const cols = [COLORS[1].main, "#64748b", COLORS[2].main];
  for (let i = 0; i < 3; i++) {
    const x = W / 2 + (i - 1) * 170;
    Kit.brick(ctx, x - 70, y - 22, 140, 36, cols[i], 8);
    ctx.fillStyle = i === 2 ? "#422006" : "#fff";
    let size = 17, label = `${names[i]}  ${vals[i]}`;
    ctx.font = `800 ${size}px ${FONT}`;
    while (size > 11 && ctx.measureText(label).width > 128) { size--; ctx.font = `800 ${size}px ${FONT}`; }
    if (ctx.measureText(label).width > 128) {
      let nm = names[i];
      while (nm.length > 3 && ctx.measureText(`${nm}..  ${vals[i]}`).width > 128) nm = nm.slice(0, -1);
      label = `${nm}..  ${vals[i]}`;
    }
    ctx.fillText(label, x, y + 2);
  }
  if (phase === "end") {
    ctx.fillStyle = "rgba(242,244,245,.7)";
    ctx.font = `700 14px ${FONT}`;
    ctx.fillText("Click or press Space for the next round  |  M: change mode", W / 2, 84);
  }
}

const game = Kit.loop(update, draw);
round = 0;
tally = { 1: 0, 2: 0, draw: 0 };
streak = 0;
board = new Array(COLS * ROWS).fill(0);
heights = new Array(COLS).fill(0);
game.start();
mainMenu();
</script>
</body>
</html>
