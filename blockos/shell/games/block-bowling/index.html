<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Bowling</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script src="../kit.js"></script>
<script>
"use strict";
const ID = "block-bowling";
const { canvas, ctx, W, H } = Kit.stage(960, 540);

const CY = 300;              // lane centre line
const HALF = 78;             // half lane width
const GUTTER = 22;
const FOUL_X = 150;
const HEAD_X = 740;          // head pin
const PIT_X = 880;
const BALL_R = 14;
const PIN_R = 8;
const PIN_GAP = 34;
const PHYS = { ballM: 3, pinM: 1.4, e: 0.5, knock: 45 };

let frames, frameIdx, rollInFrame, pins, ball, phase, aim, spinVal, spinDir, powerVal, powerDir, settleT, msg, msgT, time, sweepT;

function pinSpots() {
  const spots = [];
  for (let r = 0; r < 4; r++)
    for (let i = 0; i <= r; i++) spots.push({ x: HEAD_X + r * PIN_GAP * 0.87, y: CY + (i - r / 2) * PIN_GAP });
  return spots;
}

function rackPins() {
  pins = pinSpots().map((s, n) => ({ n: n + 1, x: s.x, y: s.y, ox: s.x, oy: s.y, vx: 0, vy: 0, down: false, gone: false, ang: 0, spin: 0 }));
}

function newGame() {
  frames = Array.from({ length: 10 }, () => []);
  frameIdx = 0;
  rollInFrame = 0;
  aim = { y: CY, angle: 0 };
  rackPins();
  readyBall();
  updateHud();
}

function readyBall() {
  ball = { x: FOUL_X - 30, y: aim.y, vx: 0, vy: 0, spin: 0, roll: 0, gutter: false, active: false };
  phase = "aim";
  spinVal = 0; spinDir = 1;
  powerVal = 0; powerDir = 1;
}

// ---------- scoring ----------
function flatRolls() {
  return frames.flat();
}
function scoreFrames() {
  // returns cumulative totals per frame (null when not yet known)
  const out = [];
  const rolls = [];
  const frameStart = [];
  frames.forEach((f) => { frameStart.push(rolls.length); rolls.push(...f); });
  let total = 0;
  for (let i = 0; i < 10; i++) {
    const f = frames[i], s = frameStart[i];
    if (!f.length) { out.push(null); continue; }
    let val = null;
    if (i < 9) {
      if (f[0] === 10) val = rolls[s + 1] !== undefined && rolls[s + 2] !== undefined ? 10 + rolls[s + 1] + rolls[s + 2] : null;
      else if (f.length === 2) val = f[0] + f[1] === 10 ? (rolls[s + 2] !== undefined ? 10 + rolls[s + 2] : null) : f[0] + f[1];
    } else {
      const done = f.length === 3 || (f.length === 2 && f[0] + f[1] < 10);
      if (done) val = f.reduce((a, b) => a + b, 0);
    }
    if (val === null) { out.push(null); for (let k = i + 1; k < 10; k++) out.push(null); break; }
    total += val;
    out.push(total);
  }
  return out;
}
function runningTotal() {
  const s = scoreFrames().filter((v) => v !== null);
  return s.length ? s[s.length - 1] : 0;
}
function marks(i) {
  const f = frames[i];
  const m = [];
  for (let k = 0; k < f.length; k++) {
    const v = f[k];
    if (i < 9) {
      if (k === 0 && v === 10) { m.push("", "X"); break; }
      if (k === 1 && f[0] + v === 10) m.push("/");
      else m.push(v === 0 ? "-" : String(v));
    } else {
      const prev = f[k - 1];
      const freshRack = k === 0 || prev === 10 || (k === 2 && f[0] !== 10 && f[0] + f[1] === 10) || (k === 2 && f[0] === 10 && f[1] === 10);
      if (v === 10 && freshRack) m.push("X");
      else if (!freshRack && prev + v === 10) m.push("/");
      else m.push(v === 0 ? "-" : String(v));
    }
  }
  return m;
}

function updateHud() {
  Kit.hud(`Score ${runningTotal()}<small>Frame ${Math.min(10, frameIdx + 1)} · Best ${Kit.best(ID) ?? 0}</small>`);
}

// ---------- input ----------
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("pointermove", (e) => {
  if (phase !== "aim") return;
  const p = Kit.pointer(canvas, e);
  if (p.x < FOUL_X + 40) aim.y = Kit.clamp(p.y, CY - HALF + BALL_R, CY + HALF - BALL_R);
  else aim.angle = Kit.clamp(Math.atan2(p.y - aim.y, p.x - FOUL_X), -0.12, 0.12);
  ball.y = aim.y;
});
canvas.addEventListener("pointerdown", () => advance());
Kit.onKey((code) => { if (code === "Space" || code === "Enter") advance(); });

function advance() {
  if (phase === "aim") { phase = "spin"; Kit.sfx("click"); }
  else if (phase === "spin") { phase = "power"; Kit.sfx("click"); }
  else if (phase === "power") throwBall();
}

function throwBall() {
  phase = "rolling";
  settleT = 0;
  const speed = 420 + powerVal * 520;
  ball.x = FOUL_X;
  ball.vx = Math.cos(aim.angle) * speed;
  ball.vy = Math.sin(aim.angle) * speed;
  ball.spin = spinVal;
  ball.active = true;
  ball.fresh = pins.length === 10 && pins.every((p) => !p.down);
  Kit.sfx("jump");
}

// ---------- physics ----------
function collide(a, b, ma, mb, minD) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  if (d >= minD || d === 0) return 0;
  const nx = dx / d, ny = dy / d;
  const overlap = minD - d;
  const tot = ma + mb;
  a.x -= nx * overlap * (mb / tot); a.y -= ny * overlap * (mb / tot);
  b.x += nx * overlap * (ma / tot); b.y += ny * overlap * (ma / tot);
  const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (rv >= 0) return 0;
  const e = PHYS.e;
  const j = (-(1 + e) * rv) / (1 / ma + 1 / mb);
  a.vx -= (j / ma) * nx; a.vy -= (j / ma) * ny;
  b.vx += (j / mb) * nx; b.vy += (j / mb) * ny;
  return -rv;
}

function knock(p, impact) {
  if (!p.down && impact > PHYS.knock) {
    p.down = true;
    p.ang = Math.atan2(p.vy, p.vx);
    p.spin = Kit.rand(-8, 8);
    if (impact > 60) Kit.sfx("hit");
  }
}

function step(dt) {
  if (ball.active) {
    // hook kicks in once the ball leaves the oily front of the lane
    if (!ball.gutter) {
      const hook = Kit.clamp((ball.x - 420) / 280, 0, 1);
      ball.vy += ball.spin * 380 * hook * dt;
    }
    ball.vx *= 1 - 0.05 * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.roll += Math.hypot(ball.vx, ball.vy) * dt / BALL_R;
    if (!ball.gutter && ball.x < HEAD_X - 20 && Math.abs(ball.y - CY) > HALF) {
      ball.gutter = true;
      ball.y = CY + Math.sign(ball.y - CY) * (HALF + GUTTER / 2);
      ball.vy = 0;
      Kit.sfx("lose");
    }
    if (!ball.gutter && Math.abs(ball.y - CY) > HALF + GUTTER - BALL_R) {
      ball.y = CY + Math.sign(ball.y - CY) * (HALF + GUTTER - BALL_R);
      ball.vy *= -0.3;
    }
    if (ball.x > PIT_X + 40) ball.active = false;
  }
  for (const p of pins) {
    if (p.gone) continue;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const drag = p.down ? 2.2 : 6;
    p.vx *= Math.exp(-drag * dt);
    p.vy *= Math.exp(-drag * dt);
    p.ang += p.spin * dt;
    p.spin *= Math.exp(-2 * dt);
    // kickback walls on the pin deck sides
    const edge = HALF + GUTTER;
    if (Math.abs(p.y - CY) > edge - PIN_R) { p.y = CY + Math.sign(p.y - CY) * (edge - PIN_R); p.vy *= -0.6; knock(p, 40); }
    if (p.x > PIT_X) { p.gone = true; p.down = true; }
    if (!p.down && Math.hypot(p.x - p.ox, p.y - p.oy) > 7) knock(p, 99);
  }
  if (ball.active && !ball.gutter) {
    for (const p of pins) {
      if (p.gone) continue;
      const imp = collide(ball, p, PHYS.ballM, PHYS.pinM, BALL_R + PIN_R);
      if (imp) knock(p, imp);
    }
  }
  for (let i = 0; i < pins.length; i++)
    for (let j = i + 1; j < pins.length; j++) {
      const a = pins[i], b = pins[j];
      if (a.gone || b.gone) continue;
      const imp = collide(a, b, PHYS.pinM, PHYS.pinM, PIN_R * 2);
      if (imp) { knock(a, imp); knock(b, imp); }
    }
}

function update(dt) {
  time += dt;
  msgT = Math.max(0, msgT - dt);
  if (phase === "aim") {
    const my = (Kit.key("ArrowDown") || Kit.key("KeyS") ? 1 : 0) - (Kit.key("ArrowUp") || Kit.key("KeyW") ? 1 : 0);
    const ma = (Kit.key("ArrowRight") || Kit.key("KeyD") ? 1 : 0) - (Kit.key("ArrowLeft") || Kit.key("KeyA") ? 1 : 0);
    aim.y = Kit.clamp(aim.y + my * 110 * dt, CY - HALF + BALL_R, CY + HALF - BALL_R);
    aim.angle = Kit.clamp(aim.angle + ma * 0.12 * dt, -0.12, 0.12);
    ball.y = aim.y;
  } else if (phase === "spin") {
    spinVal += spinDir * dt * 1.6;
    if (spinVal > 1) { spinVal = 1; spinDir = -1; }
    if (spinVal < -1) { spinVal = -1; spinDir = 1; }
  } else if (phase === "power") {
    powerVal += powerDir * dt * 1.25;
    if (powerVal > 1) { powerVal = 1; powerDir = -1; }
    if (powerVal < 0) { powerVal = 0; powerDir = 1; }
  } else if (phase === "rolling") {
    const SUB = 8;
    for (let i = 0; i < SUB; i++) step(dt / SUB);
    settleT += dt;
    const moving = pins.some((p) => !p.gone && Math.hypot(p.vx, p.vy) > 6);
    if ((!ball.active && !moving && settleT > 1) || settleT > 7) endRoll();
  } else if (phase === "sweep") {
    sweepT += dt;
    if (sweepT > 0.9) afterSweep();
  }
}

let pendingRack = false;
function endRoll() {
  const knocked = pins.filter((p) => p.down && !p.counted);
  knocked.forEach((p) => (p.counted = true));
  const count = knocked.length;
  const f = frames[frameIdx];
  f.push(count);
  const tenth = frameIdx === 9;
  const cleared = pins.every((p) => p.down);
  const strike = cleared && ball.fresh;
  if (strike) { msg = "STRIKE!"; Kit.sfx("win"); }
  else if (cleared) { msg = "Spare!"; Kit.sfx("score"); }
  else { msg = count === 0 ? (ball.gutter ? "Gutter ball" : "Miss") : `${count} pin${count === 1 ? "" : "s"}`; if (count) Kit.sfx("coin"); }
  msgT = 1.6;
  let frameOver;
  if (!tenth) frameOver = strike || rollInFrame === 1;
  else frameOver = f.length === 3 || (f.length === 2 && f[0] + f[1] < 10);
  pendingRack = cleared || frameOver;
  rollInFrame++;
  if (frameOver) { frameIdx++; rollInFrame = 0; }
  updateHud();
  phase = "sweep";
  sweepT = 0;
}

async function afterSweep() {
  if (frameIdx >= 10) {
    phase = "done";
    const total = runningTotal();
    const best = Kit.finish(ID, total);
    const strikes = flatRolls().length ? frames.reduce((a, f, i) => a + marks(i).filter((m) => m === "X").length, 0) : 0;
    Kit.sfx("win");
    await Kit.overlay("Game over", `Final score: ${total}\nStrikes: ${strikes}\nBest game: ${best}`, "Bowl again");
    newGame();
    return;
  }
  if (pendingRack) rackPins();
  else pins = pins.filter((p) => !p.down);
  readyBall();
}

// ---------- drawing ----------
function drawLane() {
  ctx.fillStyle = "#1f2430";
  ctx.fillRect(0, 0, W, H);
  // side walls / masking
  ctx.fillStyle = "#2b3140";
  ctx.fillRect(0, 100, W, 40);
  ctx.fillRect(0, CY + HALF + GUTTER + 6, W, H);
  ctx.fillStyle = "rgba(255,255,255,.04)";
  for (let x = 0; x < W; x += 60) ctx.fillRect(x + 2, CY + HALF + GUTTER + 12, 56, 60);
  // approach
  ctx.fillStyle = "#b78450";
  ctx.fillRect(0, CY - HALF - GUTTER, FOUL_X, (HALF + GUTTER) * 2);
  // lane boards
  for (let i = 0; i < 16; i++) {
    const y = CY - HALF + (i * HALF * 2) / 16;
    ctx.fillStyle = i % 2 ? "#e2b07a" : "#d9a46c";
    ctx.fillRect(FOUL_X, y, PIT_X - FOUL_X, HALF * 2 / 16 + 1);
  }
  // oil sheen on the front part
  const g = ctx.createLinearGradient(FOUL_X, 0, 560, 0);
  g.addColorStop(0, "rgba(255,255,255,.18)");
  g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g;
  ctx.fillRect(FOUL_X, CY - HALF, 410, HALF * 2);
  // pin deck
  ctx.fillStyle = "rgba(255,255,255,.12)";
  ctx.fillRect(HEAD_X - 30, CY - HALF, PIT_X - HEAD_X + 30, HALF * 2);
  // gutters
  for (const s of [-1, 1]) {
    const y = s < 0 ? CY - HALF - GUTTER : CY + HALF;
    ctx.fillStyle = "#4b5563";
    ctx.fillRect(FOUL_X - 10, y, PIT_X - FOUL_X + 10, GUTTER);
    ctx.fillStyle = "#374151";
    ctx.fillRect(FOUL_X - 10, y + GUTTER / 2 - 3, PIT_X - FOUL_X + 10, 6);
  }
  // foul line, dots and arrows
  ctx.fillStyle = "#b91c1c";
  ctx.fillRect(FOUL_X - 2, CY - HALF, 4, HALF * 2);
  ctx.fillStyle = "#3f2a14";
  for (let k = -3; k <= 3; k++) {
    const y = CY + k * 19;
    ctx.beginPath(); ctx.arc(FOUL_X + 50, y, 2.5, 0, 7); ctx.fill();
    const ax = 330 + Math.abs(k) * -14;
    ctx.beginPath(); ctx.moveTo(ax + 12, y); ctx.lineTo(ax, y - 5); ctx.lineTo(ax, y + 5); ctx.fill();
  }
  // pit
  ctx.fillStyle = "#0b0d10";
  ctx.fillRect(PIT_X, CY - HALF - GUTTER - 10, W - PIT_X, (HALF + GUTTER) * 2 + 20);
  ctx.fillStyle = "#111827";
  ctx.fillRect(PIT_X + 20, CY - HALF - GUTTER - 10, 10, (HALF + GUTTER) * 2 + 20);
}

function drawPin(p) {
  if (p.gone) return;
  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.down) {
    ctx.rotate(p.ang);
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.beginPath(); ctx.roundRect(-12, -4, 28, 12, 6); ctx.fill();
    ctx.fillStyle = "#f8fafc";
    ctx.beginPath(); ctx.roundRect(-14, -6, 28, 12, 6); ctx.fill();
    ctx.fillStyle = "#dc2626";
    ctx.fillRect(4, -6, 3, 12);
    ctx.fillRect(8, -6, 2, 12);
  } else {
    ctx.fillStyle = "rgba(0,0,0,.3)";
    ctx.beginPath(); ctx.arc(3, 4, PIN_R + 1, 0, 7); ctx.fill();
    ctx.fillStyle = "#f8fafc";
    ctx.beginPath(); ctx.arc(0, 0, PIN_R + 1, 0, 7); ctx.fill();
    ctx.strokeStyle = "#dc2626";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, PIN_R - 2.5, 0, 7); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(-1, -1, 2.5, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawBall() {
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.fillStyle = "rgba(0,0,0,.3)";
  ctx.beginPath(); ctx.arc(3, 4, BALL_R, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(-4, -5, 2, 0, 0, BALL_R);
  g.addColorStop(0, "#818cf8");
  g.addColorStop(1, "#3730a3");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, 7); ctx.fill();
  // finger holes travel with the roll
  const off = Math.sin(ball.roll) * 6;
  if (Math.cos(ball.roll) > -0.2) {
    ctx.fillStyle = "#1e1b4b";
    ctx.fillRect(off - 2, -6, 3, 3);
    ctx.fillRect(off + 3, -4, 3, 3);
    ctx.fillRect(off, 2, 4, 4);
  }
  ctx.restore();
}

function drawScorecard() {
  const x0 = 20, y0 = 14, fw = 78, fh = 70;
  const totals = scoreFrames();
  ctx.font = "bold 13px system-ui, sans-serif";
  for (let i = 0; i < 10; i++) {
    const w = i === 9 ? fw + 26 : fw;
    const x = x0 + i * fw;
    Kit.brick(ctx, x, y0, w - 4, fh, i === frameIdx && phase !== "done" ? "#334155" : "#1e293b", 6);
    ctx.fillStyle = "#94a3b8";
    ctx.textAlign = "left";
    ctx.fillText(String(i + 1), x + 6, y0 + 16);
    const m = marks(i);
    const boxes = i === 9 ? 3 : 2;
    for (let k = 0; k < boxes; k++) {
      const bx = x + w - 4 - (boxes - k) * 24;
      ctx.strokeStyle = "#475569";
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, y0 + 4, 22, 20);
      if (m[k]) {
        ctx.fillStyle = m[k] === "X" ? "#facc15" : m[k] === "/" ? "#38bdf8" : "#f2f4f5";
        ctx.textAlign = "center";
        ctx.fillText(m[k], bx + 11, y0 + 19);
      }
    }
    if (totals[i] !== null && totals[i] !== undefined) {
      ctx.fillStyle = "#fff";
      ctx.font = "900 22px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(String(totals[i]), x + (w - 4) / 2, y0 + 56);
      ctx.font = "bold 13px system-ui, sans-serif";
    }
  }
}

function drawMeters() {
  ctx.textAlign = "center";
  if (phase === "aim" || phase === "spin" || phase === "power") {
    // aim line
    ctx.save();
    ctx.translate(FOUL_X, ball.y);
    ctx.rotate(aim.angle);
    ctx.fillStyle = "rgba(255,255,255,.7)";
    for (let d = 20; d < 380; d += 18) ctx.fillRect(d, -1.5, 9, 3);
    ctx.beginPath(); ctx.moveTo(392, 0); ctx.lineTo(378, -7); ctx.lineTo(378, 7); ctx.fill();
    ctx.restore();
  }
  const bx = 300, by = 450;
  ctx.font = "bold 14px system-ui, sans-serif";
  // spin meter
  Kit.brick(ctx, bx - 160, by, 320, 26, "#111827", 6);
  ctx.fillStyle = "#334155";
  ctx.fillRect(bx - 150, by + 8, 300, 10);
  ctx.fillStyle = "#64748b";
  ctx.fillRect(bx - 1, by + 4, 2, 18);
  const sv = phase === "aim" ? 0 : spinVal;
  ctx.fillStyle = phase === "spin" ? "#facc15" : "#94a3b8";
  ctx.fillRect(bx + sv * 150 - 5, by + 3, 10, 20);
  ctx.fillStyle = "#cbd5e1";
  ctx.fillText("HOOK  up        straight        down", bx, by + 46);
  // power meter
  const px = 700;
  Kit.brick(ctx, px - 110, by, 220, 26, "#111827", 6);
  const pv = phase === "power" ? powerVal : phase === "rolling" || phase === "sweep" ? powerVal : 0;
  const g = ctx.createLinearGradient(px - 100, 0, px + 100, 0);
  g.addColorStop(0, "#22c55e"); g.addColorStop(0.7, "#facc15"); g.addColorStop(1, "#ef4444");
  ctx.fillStyle = g;
  ctx.fillRect(px - 100, by + 7, 200 * pv, 12);
  ctx.fillStyle = "#cbd5e1";
  ctx.fillText("POWER", px, by + 46);
  // prompt
  const prompt = {
    aim: "Up/Down or mouse (left of the foul line) to position, Left/Right or mouse to aim. Click / Space",
    spin: "Lock the hook: click / Space",
    power: "Lock the power and bowl: click / Space",
  }[phase];
  if (prompt) {
    ctx.font = "bold 15px system-ui, sans-serif";
    ctx.fillStyle = "#e2e8f0";
    ctx.fillText(prompt, W / 2, 125);
  }
}

function draw() {
  drawLane();
  for (const p of pins) if (p.down) drawPin(p);
  for (const p of pins) if (!p.down) drawPin(p);
  if (phase !== "sweep" || ball.x < PIT_X) drawBall();
  if (phase === "sweep") {
    const t = Math.min(1, sweepT / 0.9);
    ctx.fillStyle = "rgba(15,23,42,.85)";
    ctx.fillRect(HEAD_X - 40, CY - HALF - GUTTER, 12, (HALF + GUTTER) * 2);
    ctx.globalAlpha = t;
    ctx.fillStyle = "#1f2430";
    ctx.globalAlpha = 1;
  }
  drawScorecard();
  drawMeters();
  if (msgT > 0) {
    ctx.globalAlpha = Math.min(1, msgT * 2);
    ctx.textAlign = "center";
    ctx.font = "900 50px system-ui, sans-serif";
    ctx.fillStyle = "rgba(0,0,0,.6)";
    ctx.fillText(msg, 523, 183);
    ctx.fillStyle = msg === "STRIKE!" ? "#facc15" : msg === "Spare!" ? "#38bdf8" : "#fff";
    ctx.fillText(msg, 520, 180);
    ctx.globalAlpha = 1;
  }
}

time = 0;
msg = ""; msgT = 0;
newGame();
const game = Kit.loop(update, draw);
game.start();
Kit.overlay("Block Bowling",
  "Ten frames of bowling with real scoring: strikes and spares earn bonus pins.\n\n1. Position and aim: Up/Down moves the ball, Left/Right angles it (or use the mouse)\n2. Lock the hook amount (the ball curves late down the lane)\n3. Lock the power to bowl\n\nClick or Space confirms each step.",
  "Bowl").then(() => {});
</script>
</body>
</html>
