<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Brick Plaza</title><link rel="stylesheet" href="../kit.css">
<style>
  #prompt { position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); z-index: 15; display: none;
    background: rgba(20, 22, 25, .86); border: 1px solid #3a3f46; padding: 8px 16px; border-radius: 10px; font-weight: 800; white-space: nowrap; }
  #prompt b { display: inline-block; background: #facc15; color: #111; border-radius: 6px; padding: 0 8px; margin-right: 8px; }
  #emotes { position: fixed; left: 12px; bottom: 12px; z-index: 15; display: flex; gap: 6px; }
  #emotes button { border: 0; border-radius: 8px; padding: 7px 11px; font: inherit; font-size: 13px; font-weight: 800; color: #fff;
    background: rgba(20, 22, 25, .8); cursor: pointer; }
  #emotes button span { color: #facc15; margin-right: 5px; }
  #emotes button.on { background: #3b82f6; }
  #banner { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 16; display: none; text-align: center;
    background: rgba(20, 22, 25, .86); border: 2px solid #3a3f46; padding: 6px 18px; border-radius: 12px; font-weight: 800; font-size: 18px; }
  #banner.it { border-color: #ef4444; color: #fecaca; }
  #banner small { display: block; font-size: 12px; color: #a7adb4; font-weight: 700; }
  #arc { position: fixed; left: 50%; top: 58%; transform: translate(-50%, -50%); z-index: 40; display: none; width: 380px;
    background: #1e1b4b; border: 3px solid #22d3ee; border-radius: 14px; padding: 14px 18px; text-align: center; box-shadow: 0 0 40px rgba(34, 211, 238, .35); }
  #arc h2 { margin: 0 0 4px; font-size: 20px; color: #f0abfc; letter-spacing: 1px; }
  #arc p { margin: 4px 0 10px; color: #c7d2fe; font-size: 13px; font-weight: 700; }
  #arcbar { position: relative; height: 34px; background: #0f0d2e; border-radius: 8px; overflow: hidden; border: 2px solid #4338ca; }
  #arczone { position: absolute; top: 0; bottom: 0; background: #22c55e; }
  #arcmark { position: absolute; top: -2px; bottom: -2px; width: 10px; margin-left: -5px; background: #facc15; border-radius: 3px; box-shadow: 0 0 10px #facc15; }
  #arcdots { margin-top: 10px; display: flex; gap: 6px; justify-content: center; }
  #arcdots i { width: 16px; height: 16px; border-radius: 4px; background: #312e81; }
  #arcdots i.hit { background: #22c55e; } #arcdots i.miss { background: #ef4444; }
</style>
</head>
<body>
<div id="prompt"></div>
<div id="banner"></div>
<div id="emotes"></div>
<div id="arc"><h2>BRICK STRIKER</h2><p id="arctext">Press E when the block is in the green!</p><div id="arcbar"><div id="arczone"></div><div id="arcmark"></div></div><div id="arcdots"></div></div>
<script src="../kit.js"></script>
<script type="module">
import { World, THREE } from "../kit3d.js";

const ID = "brick-plaza";
const world = new World({ sky: "#8fd3ff", fogNear: 200, fogFar: 520 });
window.world = world;
const net = Kit.net(ID, { room: "main" });
const now = () => performance.now();
const $ = (id) => document.getElementById(id);

// ======================================================================= helpers
const occluders = [];
function P(size, pos, color, o) {
  const m = world.part(Object.assign({ size, pos, color }, o || {}));
  if (o && o.occ) occluders.push(m);
  return m;
}
const deco = (size, pos, color, o) => P(size, pos, color, Object.assign({ collide: false, studs: false, shadow: false }, o));
const OCC = { occ: true };

const matCache = new Map();
const lam = (c) => { if (!matCache.has(c)) matCache.set(c, new THREE.MeshLambertMaterial({ color: c })); return matCache.get(c); };
const basic = (c) => { const k = "b" + c; if (!matCache.has(k)) matCache.set(k, new THREE.MeshBasicMaterial({ color: c })); return matCache.get(k); };
function mesh(geo, mat, x, y, z) { const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); m.castShadow = true; return m; }

let actx = null;
function tone(freqs, len, type, vol, gap) {
  try { if (localStorage.getItem("blockos.muted") === "1") return; } catch (_) {}
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    for (const f of freqs) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(vol || 0.1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + len);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + len);
      t += gap || 0;
    }
  } catch (_) {}
}
const save = (k, v) => { try { localStorage.setItem("brick-plaza." + k, JSON.stringify(v)); } catch (_) {} };
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem("brick-plaza." + k)); return v == null ? d : v; } catch (_) { return d; } };
const badge = (id, name, desc) => Kit.badge(ID, id, name, desc);

// ======================================================================= interactables & seats
const interacts = [];
function addInteract(pos, r, label, act, extra) {
  const it = Object.assign({ pos: new THREE.Vector3(pos[0], pos[1], pos[2]), r, label, act }, extra || {});
  interacts.push(it);
  return it;
}
const YAW = { n: 0, s: Math.PI, e: -Math.PI / 2, w: Math.PI / 2 };
const DIR = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0] };
// A bench: the sitter looks toward `face`.
function bench(x, z, face, base, color, label) {
  base = base ?? 0;
  color = color || "#9a5b2e";
  const along = face === "n" || face === "s";
  const d = DIR[face];
  P(along ? [6, 0.6, 2] : [2, 0.6, 6], [x, base + 1.7, z], color, { material: "wood" });
  for (const s of [-2.3, 2.3]) P([0.6, 1.4, 1.6], [x + (along ? s : 0), base + 0.7, z + (along ? 0 : s)], "#4b5563", { shadow: false });
  P(along ? [6, 2.4, 0.5] : [0.5, 2.4, 6], [x - d[0] * 1.25, base + 3.2, z - d[1] * 1.25], color, { material: "wood" });
  addInteract([x, base + 2, z], 3.2, label || "Sit on bench", () => sitAt([x, base + 2, z], YAW[face]));
}
function seatSpot(x, y, z, face, label, r) {
  addInteract([x, y, z], r || 3, label, () => sitAt([x, y, z], YAW[face]));
}

// ======================================================================= the world
const GRASS = "#5cae4c";
function ground(x0, x1, z0, z1) { P([x1 - x0, 2, z1 - z0], [(x0 + x1) / 2, -1, (z0 + z1) / 2], GRASS); }
// The ground has a hole where the swimming pool is.
ground(-160, 58, -160, 160); ground(92, 160, -160, 160); ground(58, 92, -160, 43); ground(58, 92, 77, 160);

// Lamps glow at night (they share one material, so recoloring it changes them all).
const LAMP = "#fff0a6", WIN = "#fde7a0";
let lampMat = null, winMat = null;
function lamp(x, z, base) {
  base = base || 0;
  P([0.6, 9, 0.6], [x, base + 4.5, z], "#374151", { shadow: false });
  P([2, 0.4, 2], [x, base + 10.9, z], "#374151", { studs: false });
  const b = P([1.4, 1.4, 1.4], [x, base + 9.9, z], LAMP, { material: "neon", collide: false, shadow: false });
  lampMat = b.material[0];
}
function tree(x, z, s) {
  s = s || 1;
  P([1.6, 7 * s, 1.6], [x, 3.5 * s, z], "#7c4a23", { material: "wood" });
  P([7 * s, 4.5 * s, 7 * s], [x, 7 * s + 2, z], "#2f8f3a");
  P([4.4 * s, 3 * s, 4.4 * s], [x, 7 * s + 2 + 3.7 * s, z], "#3fa34d");
}

// ---------------- plaza + fountain

P([30, 0.1, 30], [0, 0.25, 0], "#bdb4a5");

P([16, 0.2, 24], [0, 0.1, 50], "#cfc8bb");         // path to the stage

P([2, 5, 2], [0, FB + 2.5, 0], "#f1f5f9");

for (let i = 0; i < 8; i++) drops.push(deco([0.5, 0.5, 0.5], [0, 8, 0], "#bae6fd", { material: "neon" }));

addInteract([0, FB, -9.8], 4, "Toss a coin in the fountain", () => tossCoin());

// ---------------- bell tower
P([7, 1, 7], [-28, 0.7, -28], "#9ca3af");

P([8, 1.4, 1.6], [-28, 14.9, -28], "#57534e");
P([9, 0.8, 3.4], [-28, 16, -28], "#b91c1c");
const bell = new THREE.Group();
bell.position.set(-28, 14.2, -28);
bell.add(mesh(new THREE.CylinderGeometry(0.6, 1.6, 2.6, 14), lam("#eab308"), 0, -1.3, 0));
bell.add(mesh(new THREE.SphereGeometry(0.35, 8, 6), lam("#78350f"), 0, -2.8, 0));
world.scene.add(bell);
let bellSwing = 0;
addInteract([-28, 1.2, -28], 5.5, "Ring the bell", () => ringBell(true));

// ---------------- Tag sign + teleport pads
P([0.5, 4, 0.5], [16, 2.2, 24], "#374151");
P([6, 3, 0.4], [16, 5.5, 24], "#dc2626");
world.label("TAG", { pos: [16, 5.5, 24.5], height: 2.2 });

P([5, 0.3, 5], [-16, 0.35, 24], "#a855f7", { material: "neon", onTouch: () => teleport(82, 0.5, -85, -Math.PI / 2) });
world.label("To Tag Court", { pos: [-16, 4, 24], height: 1.2 });

// ---------------- shops
function shop(cx, o) {
  const z0 = -79, z1 = -55, H = 12, zc = (z0 + z1) / 2;

  const fz = z1 - 0.5;
  for (const s of [-1, 1]) {
    P([11, 3, 1], [cx + s * 9.5, 1.5, fz], o.wall, OCC);
    P([11, 5, 1], [cx + s * 9.5, 5.5, fz], "#cfeeff", { material: "glass" });
    P([11, 4, 1], [cx + s * 9.5, 10, fz], o.wall, OCC);
  }
  P([8, 4, 1], [cx, 10, fz], o.wall, OCC);
  P([32, 1, 26], [cx, H + 0.5, zc], o.roof, OCC);
  P([32, 0.8, 1], [cx, H + 1.4, z1 + 0.5], o.trim, { studs: false });
  P([12, 0.4, 3], [cx, 8.4, z1 + 1.5], o.trim, { studs: false });
  deco([10, 0.15, 6], [cx, H - 0.1, zc], "#fffbe6", { material: "neon" });
  world.label(o.name, { pos: [cx, H + 3, z1 + 0.5], height: 2.6, color: o.label || "#ffffff" });
}
// Cafe
shop(-45, { name: "CAFE", wall: "#f3d7a6", roof: "#7c2d12", floor: "#fef3c7", trim: "#dc2626" });
P([16, 3.2, 2.4], [-45, 1.8, -69], "#8b5a2b", { material: "wood" });
P([16.8, 0.4, 3], [-45, 3.6, -69], "#f5f5f4", { studs: false });
P([2.4, 2.2, 1.6], [-50, 4.9, -69.4], "#64748b");
deco([4, 1.6, 2], [-40, 4.6, -69], "#e0f2fe", { material: "glass" });
deco([1, 0.6, 1], [-40.8, 4.2, -69], "#f472b6"); deco([1, 0.6, 1], [-39.2, 4.2, -69], "#a16207");
P([12, 4, 0.3], [-45, 7.5, -78.3], "#1f2937", { studs: false });
world.label("MENU", { pos: [-45, 8.6, -77.2], height: 1.3, color: "#fde68a" });
world.label("Ice cream  Donut  Soda", { pos: [-45, 6.9, -77.2], height: 0.8 });
for (const tx of [-54, -36]) {
  P([0.8, 2.8, 0.8], [tx, 1.6, -61], "#4b5563", { shadow: false });
  P([4.4, 0.4, 4.4], [tx, 3.2, -61], "#f8fafc", { studs: false });
  for (const s of [-1, 1]) {
    P([1.6, 1.8, 1.6], [tx + s * 3.6, 1.1, -61], "#ef4444");
    seatSpot(tx + s * 3.6, 2, -61, s < 0 ? "e" : "w", "Sit on stool", 2.4);
  }
}
addInteract([-45, 0.2, -66.3], 4, "Buy a snack", () => buySnack());
// Clothing shop
const HATS = ["Party Hat", "Top Hat", "Royal Crown", "Halo", "Chef Hat", "Bunny Ears"];
shop(0, { name: "THREADS", wall: "#f9a8d4", roof: "#6b21a8", floor: "#fdf2f8", trim: "#a855f7" });
const hatDisplays = [];
HATS.forEach((name, i) => {
  const x = -10 + i * 4;
  P([2.4, 3, 2.4], [x, 1.7, -75], "#f8fafc", { studs: false });
  const h = makeHat(i);
  h.scale.setScalar(1.5);
  h.position.set(x, 3.25, -75);
  world.scene.add(h);
  hatDisplays.push(h);
  addInteract([x, 0.2, -72.6], 2.1, "", () => toggleHat(i), { hat: i });
});
const paintPad = deco([5, 0.2, 5], [-10, 0.32, -61], "#ec4899", { material: "neon" });
world.label("Shirt Paint", { pos: [-10, 8.5, -62], height: 1.1 });
addInteract([-10, 0.2, -61], 3, "Paint your shirt", () => paintShirt());
P([0.3, 6, 6], [14.2, 4, -63], "#e2e8f0", { studs: false });
deco([0.2, 6.6, 6.6], [14.35, 4, -63], "#a855f7");
P([6, 0.3, 0.3], [4, 6.5, -64], "#9ca3af", { collide: false });
["#ef4444", "#3b82f6", "#22c55e", "#facc15"].forEach((c, i) => deco([1.2, 2.2, 0.3], [1.8 + i * 1.5, 5.2, -64], c));
// Arcade
shop(45, { name: "ARCADE", wall: "#3730a3", roof: "#1e1b4b", floor: "#1e1b4b", trim: "#22d3ee", label: "#67e8f9" });
const CAB = ["#be185d", "#0e7490", "#7c3aed", "#ea580c"];
const SCREEN = ["#22d3ee", "#f472b6", "#a3e635", "#facc15"];
CAB.forEach((c, i) => {
  const x = 35 + i * 6;
  P([3.6, 6.4, 2.6], [x, 3.4, -76], c);
  deco([2.8, 2, 0.2], [x, 4.6, -74.62], SCREEN[i], { material: "neon" });
  deco([3.6, 0.8, 0.3], [x, 6.2, -74.6], "#fef08a", { material: "neon" });
  P([3.6, 0.5, 1.2], [x, 3, -74.2], "#111827", { studs: false });
  addInteract([x, 0.2, -72], 2.6, "Play Brick Striker", () => startArcade());
});
world.label("BRICK STRIKER", { pos: [44, 9, -76], height: 1.2, color: "#f0abfc" });
P([2.4, 3.4, 10], [55.2, 1.9, -63], "#a855f7");
P([3, 0.4, 10.6], [55.2, 3.8, -63], "#f5f3ff", { studs: false });
deco([24, 0.05, 0.6], [45, 0.23, -66], "#22d3ee", { material: "neon" });
deco([24, 0.05, 0.6], [45, 0.23, -70], "#f472b6", { material: "neon" });

// ---------------- the house (two stories, front door and balcony facing the plaza)
const HW = "#f6e3c3", HR = "#b91c1c";
P([26, 0.2, 26], [70, 0.1, 0], "#c08a52", { material: "wood", studs: false });
P([28, 10, 1], [70, 5, -13.5], HW, OCC); P([28, 10, 1], [70, 5, 13.5], HW, OCC);
P([1, 10, 26], [83.5, 5, 0], HW, OCC);
P([1, 10, 10], [56.5, 5, -8], HW, OCC); P([1, 10, 10], [56.5, 5, 8], HW, OCC); P([1, 2, 6], [56.5, 9, 0], HW, OCC);
// second floor (with a hole over the stairs)

P([4, 1, 6], [82, 10.5, -11], "#a8743f", { material: "wood", occ: true });
P([24, 1, 1], [68, 10.5, -13.5], HW, OCC);
P([1, 1, 5], [56.5, 10.5, -10.5], HW, OCC);
for (let k = 1; k <= 11; k++) P([2, k, 5], [57 + 2 * k, k / 2, -10.5], "#d6a46a", { material: "wood" });
P([22, 2.6, 0.4], [67, 12.3, -7.8], "#7c4a23", { material: "wood" });
P([28, 9, 1], [70, 15.5, -13.5], HW, OCC); P([28, 9, 1], [70, 15.5, 13.5], HW, OCC);
P([1, 9, 26], [83.5, 15.5, 0], HW, OCC);
P([1, 9, 10], [56.5, 15.5, -8], HW, OCC); P([1, 9, 10], [56.5, 15.5, 8], HW, OCC); P([1, 2, 6], [56.5, 19, 0], HW, OCC);

P([3, 5, 3], [78, 23, -8], "#78716c", OCC);
// balcony
P([7, 1, 14], [52.5, 10.5, 0], "#a8743f", { material: "wood" });
P([0.4, 2.6, 14], [49.2, 12.3, 0], "#f8fafc"); P([7, 2.6, 0.4], [52.5, 12.3, -6.8], "#f8fafc"); P([7, 2.6, 0.4], [52.5, 12.3, 6.8], "#f8fafc");
P([1, 10, 1], [49.5, 5, -6.5], "#f8fafc"); P([1, 10, 1], [49.5, 5, 6.5], "#f8fafc");
deco([6, 0.1, 6], [70, 9.92, 4], "#fffbe6", { material: "neon" });

// windows (they light up at night)
for (const y of [5, 15.5]) {

}
// furniture
P([7, 1.6, 2], [70, 1, 12.4], "#57534e");
P([6, 3.5, 0.6], [70, 3.6, 12.7], "#111827");
deco([5.4, 3, 0.1], [70, 3.6, 12.35], "#60a5fa", { material: "neon" });
P([8, 1.4, 3], [70, 0.9, 4], "#2563eb"); P([8, 3.4, 1], [70, 1.9, 2], "#1d4ed8");
P([1, 2.2, 4], [65.5, 1.3, 3.5], "#1d4ed8"); P([1, 2.2, 4], [74.5, 1.3, 3.5], "#1d4ed8");
seatSpot(70, 1.6, 4, "s", "Sit on couch", 3.5);
deco([12, 0.05, 9], [70, 0.23, 6.5], "#7c3aed");
P([1.4, 6, 6], [82.3, 3.2, 5], "#8b5a2b", { material: "wood" });
P([6, 1.6, 8], [77, 11.8, 7], "#3b82f6"); P([5, 0.6, 1.6], [77, 12.9, 10], "#f8fafc"); P([6.4, 3, 0.6], [77, 12.5, 11.4], "#8b5a2b", { material: "wood" });
seatSpot(77, 12.6, 6, "n", "Sit on bed", 3.5);
P([5, 0.4, 2.4], [62, 13.6, 11.6], "#8b5a2b", { material: "wood" }); P([0.5, 2.2, 2], [60, 12.2, 11.6], "#57534e"); P([0.5, 2.2, 2], [64, 12.2, 11.6], "#57534e");
P([1.8, 1.8, 1.8], [62, 11.9, 9.4], "#ef4444");
seatSpot(62, 12.8, 9.4, "s", "Sit on chair", 2.4);

// Wraps a character so emotes can move an inner "body" without fighting the kit's positioning.
function rig(model) {
  if (model.userData.fx) return model.userData.fx;
  const body = new THREE.Group();
  for (const c of [...model.children]) if (c !== model.userData.nameTag) body.add(c);
  model.add(body);
  const head = body.children.find((c) => c.isGroup && Math.abs(c.position.y - 4.6) < 0.01);
  const torso = body.children.find((c) => c.isMesh && Math.abs(c.position.y - 3) < 0.01);
  const fx = { em: 0, seq: null, t: 0, hat: -1, hatObj: null, shirt: -1, snack: 0, snackObj: null, body, head, torso,
    origTorso: torso && Array.isArray(torso.material) ? torso.material[0].color.getHex() : 0, L: model.userData.limbs, label: null };
  model.userData.fx = fx;
  const orig = model.userData.animate;
  model.userData.animate = (dt, speed, air) => { fx.t += dt; orig(dt, speed, air); pose(fx); };
  return fx;
}
function pose(fx) {
  const b = fx.body, t = fx.t, L = fx.L;
  b.position.set(0, 0, 0); b.rotation.set(0, 0, 0);
  L.armL.rotation.z = L.armR.rotation.z = 0;
  switch (fx.em) {
    case 1: L.armR.rotation.x = Math.PI * 0.92; L.armR.rotation.z = 0.25 + Math.sin(t * 11) * 0.35; break;
    case 2: {
      const s = Math.sin(t * 8);
      L.armL.rotation.x = 1.6 + s * 0.9; L.armR.rotation.x = 1.6 - s * 0.9;
      L.armL.rotation.z = -0.5; L.armR.rotation.z = 0.5;
      L.legL.rotation.x = Math.max(0, s) * 0.7; L.legR.rotation.x = Math.max(0, -s) * 0.7;
      b.rotation.y = Math.sin(t * 4) * 0.5; b.position.y = Math.abs(Math.sin(t * 8)) * 0.35;
      break;
    }
    case 3: {
      const j = Math.abs(Math.sin(t * 7));
      L.armL.rotation.x = L.armR.rotation.x = Math.PI * 0.9;
      L.armL.rotation.z = -0.35 - j * 0.25; L.armR.rotation.z = 0.35 + j * 0.25;
      L.legL.rotation.x = L.legR.rotation.x = 0;
      b.position.y = j * 1.3;
      break;
    }
    case 4: L.legL.rotation.x = L.legR.rotation.x = Math.PI / 2; L.armL.rotation.x = L.armR.rotation.x = 0.35; b.position.y = -1.5; break;
  }
  if (fx.snack) { L.armR.rotation.x = 1.9 + Math.max(0, Math.sin(t * 5)) * 0.7; L.armR.rotation.z = -0.3; }
}
function setHat(fx, i) {
  if (fx.hat === i || !fx.head) return;
  if (fx.hatObj) { fx.head.remove(fx.hatObj); fx.hatObj = null; }
  fx.hat = i;
  const orig = fx.head.children.find((c) => c.isGroup);
  if (orig) orig.visible = i < 0;
  if (i >= 0) { fx.hatObj = makeHat(i); fx.hatObj.position.y = 0.6; fx.head.add(fx.hatObj); }
}
function setShirt(fx, i) {
  if (fx.shirt === i || !fx.torso) return;
  fx.shirt = i;
  fx.torso.material[0].color.setHex(i < 0 ? fx.origTorso : SHIRTS[i]);
}
function setSnack(fx, i) {
  if (fx.snack === i) return;

// Simple NPC physics (same rules as the player: boxes, step up 1 stud, gravity).
function boxNear(m, x0, x1, z0, z1) { const b = m.userData.part.box; return b.max.x > x0 && b.min.x < x1 && b.max.z > z0 && b.min.z < z1; }
function npcCollide(n, axis, solids) {
  let hit = false;
  for (const m of solids) {
    const b = m.userData.part.box;
    if (n.pos.x + 0.95 <= b.min.x || n.pos.x - 0.95 >= b.max.x || n.pos.y + 5.2 <= b.min.y || n.pos.y >= b.max.y || n.pos.z + 0.95 <= b.min.z || n.pos.z - 0.95 >= b.max.z) continue;
    if (axis === "y") {
      if (n.vy > 0) n.pos.y = b.min.y - 5.2; else { n.pos.y = b.max.y; n.onGround = true; }
      n.vy = 0;
    } else {
      const rise = b.max.y - n.pos.y;
      if (rise > 0 && rise <= 1.1 && n.onGround) { n.pos.y = b.max.y; continue; }
      if (axis === "x") n.pos.x = n.pos.x > (b.min.x + b.max.x) / 2 ? b.max.x + 0.951 : b.min.x - 0.951;
      else n.pos.z = n.pos.z > (b.min.z + b.max.z) / 2 ? b.max.z + 0.951 : b.min.z - 0.951;
      hit = true;
    }
  }
  return hit;
}
function npcMove(n, vx, vz, dt) {
  const steps = Math.ceil(dt / (1 / 60));
  let blocked = false;
  for (let i = 0; i < steps; i++) {
    const h = dt / steps;

function startTag(it, dur, ids, mode) {
  Object.assign(tag, { active: true, mode, it, endAt: now() + dur * 1000, ids, freezeUntil: now() + 3000, noBack: null, roundTags: 0 });
  if (ids.includes(myKey())) {

  Kit.sfx("score");

}
function applyTagged(by, to) {
  if (!tag.active) return;
  tag.it = to; tag.noBack = by; tag.noBackUntil = now() + 3000; tag.freezeUntil = now() + 1500;
  if (by === myKey()) {
    myTags++; tag.roundTags++;
    Kit.sfx("score");
    if (tag.roundTags >= 3) badge("tag-3", "Tag Master", "Tagged 3 players in one round of Tag.");
  } else {

  }
  if (to === myKey()) { Kit.sfx("hit"); showBanner("You're IT!", `${nameOf(by)} tagged you. Go get someone!`, 1800); }
  placeIt();
}
function doTag(by, to) {
  if (tag.mode === "online") net.event({ k: "tg", by, to });
  applyTagged(by, to);
}
function endTag(silent) {
  if (!tag.active) return;
  tag.active = false;
  placeIt();
  if (silent || !tag.ids.includes(myKey())) return;
  if (tag.it !== myKey()) {
    Kit.sfx("win");
    showBanner("You win! You weren't IT at the end.", `You tagged ${tag.roundTags} this round`, 4000);
    badge("tag-win", "Can't Catch Me", "Finished a round of Tag without being IT.");
  } else {
    Kit.sfx("lose");
    showBanner("You were IT when time ran out!", `You tagged ${tag.roundTags} this round`, 4000);
  }
  Kit.finish(ID, tag.roundTags);
}
function tagStep(dt) {
  if (!tag.active) return;
  const t = now();
  if (t > tag.endAt) { endTag(); return; }
  if (tag.mode === "online" && (!net.online || tag.ids.length < 2)) { endTag(); return; }
  const mine = tag.ids.includes(myKey());
  // Stay inside the court during a round.
  if (mine && (me.pos.x < COURT.x0 - 3 || me.pos.x > COURT.x1 + 3 || me.pos.z < COURT.z0 - 3 || me.pos.z > COURT.z1 + 3)) {
    const [x, z] = Kit.pick(COURT_SPOTS);
    teleport(x, 0.5, z);
    showBanner("Stay in the Tag Court!", "", 1500);
  }
  // You're IT: touch someone.
  if (mine && tag.it === myKey() && t > tag.freezeUntil) {
    for (const k of tag.ids) {
      if (k === myKey() || (k === tag.noBack && t < tag.noBackUntil)) continue;
      const p = posOf(k);
      if (p && Math.hypot(p.x - me.pos.x, p.z - me.pos.z) < 4 && Math.abs(p.y - me.pos.y) < 4.5) { doTag(myKey(), k); break; }
    }
  }
  const left = Math.max(0, Math.ceil((tag.endAt - t) / 1000));
  if (!bannerHold) {
    const itMe = tag.it === myKey();
    const frozen = t < tag.freezeUntil;
    setBanner(itMe ? (frozen ? "You're IT! Get ready..." : "You're IT! Tag someone!") : `${nameOf(tag.it)} ${tag.it === myKey() ? "are" : "is"} IT - run!`,
      `Tag  ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")} left  -  your tags: ${tag.roundTags}${mine ? "" : "  (watching)"}`, itMe);
  }
}
function botStep(b, dt) {
  const t = now();
  let vx = 0, vz = 0, speed = 0;
  if (tag.active && tag.mode === "bots") {
    if (tag.it === b.key) {
      if (t > tag.freezeUntil) {
        let best = null, bd = 1e9;
        for (const k of tag.ids) {
          if (k === b.key || (k === tag.noBack && t < tag.noBackUntil)) continue;
          const p = posOf(k);
          if (!p) continue;
          const d = Math.hypot(p.x - b.pos.x, p.z - b.pos.z);
          if (d < bd) { bd = d; best = { k, p }; }
        }
        if (best) {
          vx = (best.p.x - b.pos.x) / (bd || 1); vz = (best.p.z - b.pos.z) / (bd || 1); speed = 15;
          if (bd < 3.6 && Math.abs(best.p.y - b.pos.y) < 4.5) doTag(b.key, best.k);
          else if (best.p.y > b.pos.y + 2 && bd < 7 && b.onGround && t > b.jumpAt) { b.vy = 52; b.jumpAt = t + 900; }
        }
      }
    } else {
      const ip = posOf(tag.it);
      const d = ip ? Math.hypot(ip.x - b.pos.x, ip.z - b.pos.z) : 999;
      if (d < 26) {
        vx = (b.pos.x - ip.x) / (d || 1) + (-(ip.z - b.pos.z) / (d || 1)) * 0.45 * b.side;
        vz = (b.pos.z - ip.z) / (d || 1) + ((ip.x - b.pos.x) / (d || 1)) * 0.45 * b.side;
        const m = 9;
        if (b.pos.x < COURT.x0 + m) vx += (COURT.x0 + m - b.pos.x) / 3;
        if (b.pos.x > COURT.x1 - m) vx -= (b.pos.x - COURT.x1 + m) / 3;
        if (b.pos.z < COURT.z0 + m) vz += (COURT.z0 + m - b.pos.z) / 3;
        if (b.pos.z > COURT.z1 - m) vz -= (b.pos.z - COURT.z1 + m) / 3;
        const l = Math.hypot(vx, vz) || 1; vx /= l; vz /= l;
        speed = 14;
      }
    }
  }
  if (!speed) {
    if (!b.wp || Math.hypot(b.wp[0] - b.pos.x, b.wp[1] - b.pos.z) < 2) b.wp = [Kit.rand(COURT.x0 + 4, COURT.x1 - 4), Kit.rand(COURT.z0 + 4, COURT.z1 - 4)];
    const d = Math.hypot(b.wp[0] - b.pos.x, b.wp[1] - b.pos.z) || 1;
    vx = (b.wp[0] - b.pos.x) / d; vz = (b.wp[1] - b.pos.z) / d;
    speed = tag.active ? 8 : 5;
  }
  vx *= speed; vz *= speed;
  const blocked = npcMove(b, vx, vz, dt);
  if (blocked) {
    if (b.onGround && t > b.jumpAt) { b.vy = 52; b.jumpAt = t + 1100; }
    b.side = -b.side;
    if (Math.random() < 0.05) b.wp = null;
  }
  if (b.pos.y < -20) b.pos.set(105, 1, -85);
  b.pos.x = Kit.clamp(b.pos.x, COURT.x0, COURT.x1); b.pos.z = Kit.clamp(b.pos.z, COURT.z0, COURT.z1);
  b.model.position.copy(b.pos);
  faceDir(b, vx, vz, dt);
  b.model.userData.animate(dt, speed, !b.onGround);
}

const DAY_LEN = 360;
let dayT = 0.06;
const SKY_DAY = new THREE.Color("#8fd3ff"), SKY_SET = new THREE.Color("#ff9a6b"), SKY_NIGHT = new THREE.Color("#0b1433");
const LAMP_OFF = new THREE.Color("#d6d0b8"), LAMP_ON = new THREE.Color(LAMP), WIN_OFF = new THREE.Color("#8fb3c9"), WIN_ON = new THREE.Color(WIN);
const HEMI_DAY = new THREE.Color("#ffffff"), HEMI_NIGHT = new THREE.Color("#8ea6ff");
const skyCol = new THREE.Color();
function clock() {
  const h = (dayT * 24 + 6) % 24, hh = Math.floor(h), mm = Math.floor((h - hh) * 60 / 10) * 10;
  return `${hh % 12 || 12}:${String(mm).padStart(2, "0")} ${hh < 12 ? "AM" : "PM"}`;
}
function skyStep(dt) {
  dayT = (dayT + dt / DAY_LEN) % 1;
  const sh = Math.sin(dayT * Math.PI * 2);
  const day = Kit.clamp((sh + 0.2) / 0.5, 0, 1);
  const dusk = Kit.clamp(1 - Math.abs(sh) / 0.3, 0, 1);
  skyCol.copy(SKY_NIGHT).lerp(SKY_DAY, day).lerp(SKY_SET, dusk * 0.55);
  world.scene.background.copy(skyCol);
  world.scene.fog.color.copy(skyCol);
  world.hemi.intensity = 0.35 + 0.8 * day;
  world.hemi.color.copy(HEMI_NIGHT).lerp(HEMI_DAY, day);
  world.sun.intensity = 0.05 + 1.55 * day;
  const night = 1 - day;
  if (lampMat) lampMat.color.copy(LAMP_OFF).lerp(LAMP_ON, night);
  if (winMat) winMat.color.copy(WIN_OFF).lerp(WIN_ON, night);
  starMat.opacity = Kit.clamp(night * 1.2 - 0.2, 0, 1);
  stars.position.set(me.pos.x, 0, me.pos.z);
}

world.online(net);
const rawState = net.state;
net.state = (o) => rawState(Object.assign(o, { e: emote.id, es: emote.seq, h: myFx.hat, c: myFx.shirt, sn: myFx.snack, tg: myTags }));
const int = (v, lo, hi, d) => (Number.isInteger(v) && v >= lo && v <= hi ? v : d);
net.on("join", (pl) => {
  const r = world.remotes.get(pl.id);
  if (r) rig(r.model);
  if (net.isHost) net.event({ k: "time", v: +dayT.toFixed(4) });
});
net.on("state", (pl) => {
  const r = world.remotes.get(pl.id), s = pl.state;
  if (!r || !s) return;
  const fx = rig(r.model);
  const em = int(s.e, 0, 4, 0);
  if (em !== fx.em || s.es !== fx.seq) { fx.em = em; fx.seq = s.es; fx.t = 0; }
  setHat(fx, int(s.h, -1, HATS.length - 1, -1));
  setShirt(fx, int(s.c, -1, SHIRTS.length - 1, -1));
  setSnack(fx, int(s.sn, 0, 3, 0));
});
net.on("leave", (pl) => {
  if (!tag.active || tag.mode !== "online") return;
  tag.ids = tag.ids.filter((k) => k !== pl.id);
  if (tag.it === pl.id && net.isHost && tag.ids.length >= 2) {
    const to = Kit.pick(tag.ids);
    net.event({ k: "tg", by: null, to });
    applyTagged(null, to);
  }
  if (tag.it === pl.id) placeIt();
});
net.on("status", (on) => { if (!on && tag.active && tag.mode === "online") endTag(true); });
net.on("event", (pl, e) => {
  if (!e || typeof e !== "object") return;
  if (e.k === "tr") { if (net.isHost && !tag.active) hostStartTag(); }
  else if (e.k === "ts" && Array.isArray(e.ids) && e.ids.length <= 30) {
    if (tag.active) endTag(true);
    startTag(e.it, Kit.clamp(+e.d || 90, 10, 180), e.ids, "online");
  } else if (e.k === "tg") { if (tag.active && tag.mode === "online") applyTagged(e.by, e.to); }
  else if (e.k === "bell") ringBell(false);
  else if (e.k === "time" && typeof e.v === "number" && !net.isHost) dayT = ((e.v % 1) + 1) % 1;
});

// ======================================================================= camera: pull in when a wall is in the way
const ray = new THREE.Raycaster();
const camTarget = new THREE.Vector3(), camDir = new THREE.Vector3();
const baseCamera = world.updateCamera.bind(world);
world.updateCamera = function () {
  baseCamera();
  camTarget.set(me.pos.x, me.pos.y + 4.5, me.pos.z);
  camDir.copy(world.camera.position).sub(camTarget);
  const dist = camDir.length();
  if (dist < 0.01) return;
  camDir.divideScalar(dist);
  ray.set(camTarget, camDir);
  ray.far = dist;
  const hit = ray.intersectObjects(occluders, false)[0];
  if (hit) world.camera.position.copy(camTarget).addScaledVector(camDir, Math.max(0.8, hit.distance - 0.5));
};

// ======================================================================= input
let started = false;
let current = null;
Kit.onKey((code) => {
  if (!started) return;
  if (code === "KeyE") {
    if (arcade.on) arcPress();
    else if (current) current.act();
    return;
  }
  if (arcade.on) return;
  const n = { Digit1: 1, Digit2: 2, Digit3: 3, Digit4: 4, Numpad1: 1, Numpad2: 2, Numpad3: 3, Numpad4: 4 }[code];
  if (n) {
    if (n === 4 && seat) { standUp(); return; }
    setEmote(n);
  }
});
const moving = () => ["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowDown", "Space"].some((k) => Kit.key(k));

// ======================================================================= main loop
let time = 0, slowT = 0, hostT = 0, sliding = false;
function rampStep(dt) {
  sliding = false;
  if (seat) return;
  for (const r of ramps) {
    const a = r.axis === "x" ? me.pos.x : me.pos.z, c = r.axis === "x" ? me.pos.z : me.pos.x;
    if (c < r.c0 - 0.8 || c > r.c1 + 0.8) continue;
    const t = (a - r.a0) / (r.a1 - r.a0);
    if (t < 0 || t > 1) continue;
    const h = r.h0 + (r.h1 - r.h0) * t;
    if (me.pos.y > h + 0.8 || me.pos.y < h - 2.2 || me.vel.y > 2) continue;
    me.pos.y = h; me.vel.y = 0;
    const dir = Math.sign(r.a1 - r.a0);
    const mid = (r.c0 + r.c1) / 2, k = Math.min(1, dt * 8);   // the slide's rails keep you in the middle
    if (r.axis === "x") { me.pos.x += dir * 26 * dt; me.pos.z += (mid - me.pos.z) * k; }
    else { me.pos.z += dir * 26 * dt; me.pos.x += (mid - me.pos.x) * k; }
    sliding = true;
    if (Kit.key("Space")) me.vel.y = 40;
  }
}
function update(dt) {
  time += dt;
  const t = now();
  me.frozen = !started || arcade.on || !!seat || (tag.active && tag.it === myKey() && t < tag.freezeUntil && tag.ids.includes(myKey()));
  prevVy = me.vel.y;

  // seats & swings
  if (seat) {
    if (moving()) standUp();
    else {
      seat.t += dt;
      me.pos.copy(seat.anchor); me.vel.set(0, 0, 0); me.yaw = seat.yaw;
      if (seat.swing) {
        const a = Math.sin(seat.t * 2.3) * Math.min(0.75, seat.t * 0.15);
        seat.swing.group.rotation.x = a;
        me.pos.y = 10 - 7.75 * Math.cos(a);
        me.pos.z = 82 - 7.75 * Math.sin(a);
      }
    }
  }
  // emotes end when you move
  if (emote.id) {
    emote.t += dt;
    if ((emote.id === 1 || emote.id === 3) && emote.t > 2.6) clearEmote();
    else if ((emote.id === 2 || emote.id === 3 || (emote.id === 4 && !seat)) && emote.t > 0.15 && moving()) clearEmote();
  }
  if (myFx.snack && t > snackUntil) setSnack(myFx, 0);

  rampStep(dt);
  // the pool: slow, floaty, no danger
  if (me.pos.x > POOL.x0 && me.pos.x < POOL.x1 && me.pos.z > POOL.z0 && me.pos.z < POOL.z1 && me.pos.y < POOL.top) {
    if (me.speed !== 8) { me.speed = 8; if (prevVy < -25) tone([180, 120], 0.25, "sine", 0.1, 0.08); }
    me.vel.y += 196.2 * 0.65 * dt;
    if (me.vel.y < -14) me.vel.y = -14;
    if (Kit.key("Space") && !me.frozen) me.vel.y = me.pos.y > -3.2 ? 45 : Math.max(me.vel.y, 12);
  } else me.speed = 16;
  // trampoline
  if (me.pos.y > 40 && Math.abs(me.pos.x + 75) < 12 && Math.abs(me.pos.z - 82) < 12) badge("sky-high", "Sky High", "Bounced 40 studs high on the trampoline.");
  if (me.pos.y > bestBounce && Math.abs(me.pos.x + 75) < 12 && Math.abs(me.pos.z - 82) < 12) bestBounce = me.pos.y;

  if (arcade.on) arcStep(dt);
  tagStep(dt);

  // fountain, bell, coins, stage lights, hats on display, swings at rest
  spout.scale.y = 1 + Math.sin(time * 6) * 0.15;
  drops.forEach((d, i) => {
    const u = (time * 0.8 + i / 8) % 1, a = (i / 8) * Math.PI * 2;
    d.position.set(Math.cos(a) * (0.5 + 6 * u), FB + 8 + 4 * u - 10.7 * u * u, Math.sin(a) * (0.5 + 6 * u));
  });
  if (bellSwing > 0.001) { bellSwing *= Math.pow(0.4, dt); bell.rotation.z = Math.sin(time * 9) * 0.5 * bellSwing; }
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.t += dt * 1.4;
    c.m.position.lerpVectors(c.from, c.to, Math.min(1, c.t));
    c.m.position.y += Math.sin(Math.min(1, c.t) * Math.PI) * 5;
    c.m.rotation.x += dt * 12;
    if (c.t >= 1) { world.scene.remove(c.m); coins.splice(i, 1); tone([1320, 1760], 0.25, "sine", 0.06, 0.08); }
  }
  const beat = Math.floor(time * 2.2);
  tiles.forEach((m, i) => (m.material = TILE_COLORS[(i * 7 + beat) % TILE_COLORS.length]));
  spots.forEach((m, i) => (m.material = TILE_COLORS[(i + beat) % TILE_COLORS.length]));
  paintPad.material = TILE_COLORS[Math.floor(time * 1.5) % TILE_COLORS.length];
  hatDisplays.forEach((h, i) => (h.rotation.y = time * 0.8 + i));
  for (const sw of swings) if (!seat || seat.swing !== sw) sw.group.rotation.x *= 0.95;

  // NPCs
  for (const m of statics) m.userData.animate(dt, 0, false);
  for (const fx of statics.map((m) => m.userData.fx)) if (fx.em === 1 && fx.t > 2.5) fx.em = 0;
  for (const w of walkers) {
    let vx = 0, vz = 0;
    if (w.waveT > 0) { w.waveT -= dt; if (w.waveT <= 0) w.fx.em = 0; }
    if (w.pause > 0) w.pause -= dt;
    else {
      const a = (w.i / 8) * Math.PI * 2, tx = Math.cos(a) * 22, tz = Math.sin(a) * 22;
      const d = Math.hypot(tx - w.pos.x, tz - w.pos.z);
      if (d < 1.5) { w.i = (w.i + 1) % 8; if (Math.random() < 0.3) w.pause = Kit.rand(1, 3); }
      else { vx = ((tx - w.pos.x) / d) * 7; vz = ((tz - w.pos.z) / d) * 7; }
    }
    npcMove(w, vx, vz, dt);
    w.model.position.copy(w.pos);
    if (w.waveT > 0) faceDir(w, me.pos.x - w.pos.x, me.pos.z - w.pos.z, dt); else faceDir(w, vx, vz, dt);
    w.model.userData.animate(dt, Math.hypot(vx, vz), !w.onGround);
  }
  const showBots = botsMode();
  for (const b of bots) {
    b.model.visible = showBots;
    if (showBots) botStep(b, dt);
  }

  // what can I interact with?
  current = null;
  if (started && !arcade.on && !seat && me.alive) {
    let bd = 1e9;
    for (const it of interacts) {
      const p = it.follow ? it.follow.pos : it.pos;
      if (it.follow && !it.follow.model.visible) continue;
      const d = Math.hypot(p.x - me.pos.x, p.z - me.pos.z);
      if (d < it.r && d < bd && Math.abs(p.y - me.pos.y) < 4) { bd = d; current = it; }
    }
  }
  const pr = $("prompt");
  const label = current ? (current.hat !== undefined ? (myFx.hat === current.hat ? "Take off " : "Try on ") + HATS[current.hat] : current.label) : seat ? "Move or jump to stand up" : "";
  if (label) { pr.style.display = "block"; pr.innerHTML = current ? `<b>E</b>${label}` : label; } else pr.style.display = "none";

  if (started) areaStep();
  skyStep(dt);

  // host shares the time of day now and then
  if (net.online && net.isHost && net.players.size > 0 && (hostT += dt) > 10) { hostT = 0; net.event({ k: "time", v: +dayT.toFixed(4) }); }

  if (bannerHold && t > bannerHold) { bannerHold = 0; if (!tag.active) $("banner").style.display = "none"; }
  if (!tag.active && !bannerHold) $("banner").style.display = "none";

  if ((slowT += dt) > 0.4) {
    slowT = 0;
    Kit.hud(`${clock()}<small>Areas ${visited.size}/${AREAS.length}  -  ${tickets} tickets</small>`);
    const it = (k) => (tag.active && tag.it === k ? " (IT)" : "");
    const rows = [{ name: me.name + it(myKey()), values: [myTags], me: true }];
    for (const pl of net.players.values()) rows.push({ name: pl.name + it(pl.id), values: [(pl.state && +pl.state.tg) || 0] });
    if (showBots && (tag.active || bots.some((b) => b.tags))) bots.forEach((b) => rows.push({ name: b.name + it(b.key), values: [b.tags] }));
    rows.sort((a, b) => b.values[0] - a.values[0]);
    Kit.leaderboard(["Tags"], rows);
  }
}
world.start(update);
window.net = net;
window.game = { get bellSwing() { return bellSwing; }, get myTags() { return myTags; }, tag, bots, me, emote, arcade, interacts, setEmote, requestTag, teleport, get dayT() { return dayT; }, set dayT(v) { dayT = v; }, myFx, visited, startArcade, arcPress };

Kit.overlay("Brick Plaza",
  "Hang out with friends in a blocky town!\n\n" +
  "WASD move, Space jump, drag or arrow keys to look, Shift lock\n" +
  "E to interact: benches, cafe snacks, hats, arcade, the bell\n" +
  "Emotes: 1 Wave  2 Dance  3 Cheer  4 Sit\n" +
  "Press E at the TAG sign to play Tag. Online, everyone joins in!", "Hang out").then(() => { started = true; });
</script>
</body></html>
