<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a2b"/><stop offset="1" stop-color="#0d0f14"/></linearGradient>
    <pattern id="studs" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="4" fill="#fff" fill-opacity=".04"/></pattern>
    <g id="b"><rect width="50" height="20" rx="4"/><rect x="3" y="2" width="44" height="3" fill="#fff" fill-opacity=".22"/><rect x="3" y="15" width="44" height="3" fill="#000" fill-opacity=".22"/><circle cx="25" cy="10" r="4" fill="#fff" fill-opacity=".3"/></g>
  </defs>
  <rect width="480" height="270" fill="url(#bg)"/><rect width="480" height="270" fill="url(#studs)"/>
  <g fill="#ef4444"><use href="#b" x="22" y="24"/><use href="#b" x="78" y="24"/><use href="#b" x="134" y="24"/><use href="#b" x="190" y="24"/><use href="#b" x="246" y="24"/><use href="#b" x="302" y="24"/><use href="#b" x="358" y="24"/><use href="#b" x="414" y="24"/></g>
  <g fill="#fb923c"><use href="#b" x="22" y="50"/><use href="#b" x="78" y="50"/><use href="#b" x="190" y="50"/><use href="#b" x="246" y="50"/><use href="#b" x="302" y="50"/><use href="#b" x="414" y="50"/></g>
  <g fill="#facc15"><use href="#b" x="22" y="76"/><use href="#b" x="134" y="76"/><use href="#b" x="190" y="76"/><use href="#b" x="358" y="76"/><use href="#b" x="414" y="76"/></g>
  <g fill="#22c55e"><use href="#b" x="78" y="102"/><use href="#b" x="134" y="102"/><use href="#b" x="302" y="102"/><use href="#b" x="358" y="102"/></g>
  <g fill="#8b939e"><use href="#b" x="246" y="102"/></g>
  <!-- flying fragments -->
  <g fill="#fb923c"><rect x="146" y="58" width="8" height="8" transform="rotate(20 150 62)"/><rect x="170" y="70" width="6" height="6"/><rect x="128" y="48" width="5" height="5"/></g>
  <!-- ball trail and ball -->
  <g fill="#fff"><circle cx="230" cy="200" r="4" opacity=".15"/><circle cx="210" cy="172" r="5" opacity=".25"/><circle cx="190" cy="144" r="6" opacity=".4"/></g>
  <circle cx="172" cy="118" r="14" fill="#fff" opacity=".12"/><circle cx="172" cy="118" r="9" fill="#f8fafc"/><circle cx="175" cy="121" r="4" fill="#cbd5e1"/>
  <!-- capsule -->
  <rect x="330" y="170" width="44" height="20" rx="10" fill="#a855f7"/><rect x="336" y="172" width="32" height="4" fill="#fff" opacity=".3"/>
  <g fill="#fff"><circle cx="344" cy="180" r="3"/><circle cx="352" cy="180" r="3"/><circle cx="360" cy="180" r="3"/></g>
  <!-- paddle -->
  <g fill="#60a5fa"><rect x="200" y="236" width="12" height="6" rx="2"/><rect x="226" y="236" width="12" height="6" rx="2"/><rect x="252" y="236" width="12" height="6" rx="2"/><rect x="278" y="236" width="12" height="6" rx="2"/></g>
  <rect x="190" y="240" width="110" height="18" rx="7" fill="#3b82f6"/><rect x="195" y="242" width="100" height="3" fill="#fff" opacity=".25"/>
</svg>
