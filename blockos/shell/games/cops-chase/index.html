<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getaway</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<script src="../kit.js"></script>
<script>
"use strict";
const ID = "cops-chase";
const T = 32, COLS = 31, ROWS = 19;
const { canvas, ctx, W, H } = Kit.stage(COLS * T, ROWS * T);
const FONT = "'Noto Sans', 'DejaVu Sans', 'Segoe UI', sans-serif";

const DIRS = [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }];
const STOP = { dx: 0, dy: 0 };

let road, blocks, player, cops, bags, pickups, particles, cash, time, alive, spawnTimer, shake, popups;
let distPlayer, distAhead, distTimer, mouseTarget = null, queued = null, queuedT = 0;

// ---------- map ----------
const isRoad = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && road[y][x];

function buildMap() {
  road = Array.from({ length: ROWS }, (_, y) => Array.from({ length: COLS }, (_, x) => (x % 4 === 1 && y >= 1 && y <= ROWS - 2) || (y % 4 === 1 && x >= 1 && x <= COLS - 2)));
  // remove some street segments for variety while keeping every intersection at degree >= 2 and the map connected
  const segs = [];
  // only inner streets can be removed so the outer ring road stays intact
  for (let y = 5; y < ROWS - 2; y += 4) for (let x = 1; x + 4 < COLS - 1; x += 4) segs.push({ x, y, h: true });
  for (let x = 5; x < COLS - 2; x += 4) for (let y = 1; y + 4 < ROWS - 1; y += 4) segs.push({ x, y, h: false });
  segs.sort(() => Math.random() - 0.5);
  let removed = 0;
  for (const s of segs) {
    if (removed >= 9) break;
    const tiles = [1, 2, 3].map((i) => (s.h ? [s.x + i, s.y] : [s.x, s.y + i]));
    tiles.forEach(([x, y]) => (road[y][x] = false));
    const a = [s.x, s.y], b = s.h ? [s.x + 4, s.y] : [s.x, s.y + 4];
    if (degree(...a) < 2 || degree(...b) < 2 || !connected()) tiles.forEach(([x, y]) => (road[y][x] = true));
    else removed++;
  }
  // blocks: group non-road tiles into flood-filled lots and give each a style
  blocks = [];
  const seen = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      if (road[y][x] || seen[y][x]) continue;
      const tiles = [];
      const st = [[x, y]];
      seen[y][x] = true;
      while (st.length) {
        const [cx, cy] = st.pop();
        tiles.push([cx, cy]);
        for (const d of DIRS) {
          const nx = cx + d.dx, ny = cy + d.dy;
          if (nx >= 0 && ny >= 0 && nx < COLS && ny < ROWS && !road[ny][nx] && !seen[ny][nx]) { seen[ny][nx] = true; st.push([nx, ny]); }
        }
      }
      const border = tiles.some(([tx, ty]) => tx === 0 || ty === 0 || tx === COLS - 1 || ty === ROWS - 1);
      blocks.push({ tiles, style: border ? "edge" : Kit.pick(["office", "office", "house", "park", "shop", "lot"]), hue: Kit.pick(["#60a5fa", "#f472b6", "#fbbf24", "#a78bfa", "#34d399", "#fb7185"]) });
    }
}
function degree(x, y) { return DIRS.filter((d) => isRoad(x + d.dx, y + d.dy)).length; }
function connected() {
  const d = bfs(1, 1);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (road[y][x] && d[y][x] < 0) return false;
  return true;
}
function bfs(sx, sy) {
  const dist = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
  if (!isRoad(sx, sy)) return dist;
  const q = [[sx, sy]];
  dist[sy][sx] = 0;
  for (let i = 0; i < q.length; i++) {
    const [x, y] = q[i];
    for (const d of DIRS) {
      const nx = x + d.dx, ny = y + d.dy;
      if (isRoad(nx, ny) && dist[ny][nx] < 0) { dist[ny][nx] = dist[y][x] + 1; q.push([nx, ny]); }
    }
  }
  return dist;
}
function roadTiles() {
  const out = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (road[y][x]) out.push([x, y]);
  return out;
}

// ---------- entities ----------
function makeCar(x, y, speed) { return { tx: x, ty: y, dir: STOP, t: 0, speed, angle: 0 }; }
const posX = (e) => (e.tx + e.dir.dx * e.t) * T + T / 2;
const posY = (e) => (e.ty + e.dir.dy * e.t) * T + T / 2;
const aheadTile = (e) => (e.t > 0.5 ? [e.tx + e.dir.dx, e.ty + e.dir.dy] : [e.tx, e.ty]);

function reset() {
  buildMap();
  const mid = [Math.floor(COLS / 2 / 4) * 4 + 1, Math.floor(ROWS / 2 / 4) * 4 + 1];
  player = makeCar(mid[0], mid[1], 6);
  player.nitro = 0;
  cops = [];
  bags = [];
  pickups = [];
  particles = [];
  popups = [];
  cash = 0;
  time = 0;
  alive = true;
  spawnTimer = 2;
  shake = 0;
  queued = null;
  mouseTarget = null;
  distPlayer = bfs(player.tx, player.ty);
  distAhead = distPlayer;
  distTimer = 0;
  spawnCop();
  spawnCop();
  for (let i = 0; i < 4; i++) spawnBag();
  updateHud();
}

function freeTileFarFrom(minDist) {
  const d = bfs(...aheadTile(player));
  const options = roadTiles().filter(([x, y]) => d[y][x] >= minDist && !bags.some((b) => b.x === x && b.y === y) && !cops.some((c) => c.tx === x && c.ty === y));
  return options.length ? Kit.pick(options) : Kit.pick(roadTiles());
}

function spawnCop() {
  const [x, y] = freeTileFarFrom(16);
  const kinds = ["chaser", "ambusher", "chaser", "wanderer"];
  const c = makeCar(x, y, 0);
  c.kind = kinds[cops.length % kinds.length];
  c.warm = 1.5;   // flashes before it starts driving
  cops.push(c);
}

function spawnBag() {
  const [x, y] = freeTileFarFrom(6);
  const gold = Math.random() < 0.15;
  bags.push({ x, y, value: gold ? 500 : 100, gold, life: gold ? 10 : Infinity, bob: Math.random() * 6 });
}

function updateHud() {
  Kit.hud(`$${cash}<small>${Math.floor(time)}s · ${cops.length} cops · Best $${Kit.best(ID) ?? 0}</small>`);
}

// ---------- input ----------
const KEYS = {
  ArrowUp: DIRS[3], KeyW: DIRS[3], ArrowDown: DIRS[2], KeyS: DIRS[2],
  ArrowLeft: DIRS[1], KeyA: DIRS[1], ArrowRight: DIRS[0], KeyD: DIRS[0],
};
Kit.onKey((code) => {
  const d = KEYS[code];
  if (!d || !alive) return;
  queued = d;
  queuedT = 0.8;
  mouseTarget = null;
  // instant U-turn
  if (player.dir.dx === -d.dx && player.dir.dy === -d.dy && (d.dx || d.dy) && player.t > 0) {
    player.tx += player.dir.dx;
    player.ty += player.dir.dy;
    player.t = 1 - player.t;
    player.dir = d;
  }
});
canvas.addEventListener("pointerdown", (e) => {
  if (!alive) return;
  const p = Kit.pointer(canvas, e);
  const x = Math.floor(p.x / T), y = Math.floor(p.y / T);
  // snap to the nearest road tile
  let best = null, bd = 1e9;
  for (const [rx, ry] of roadTiles()) {
    const d = Math.abs(rx - x) + Math.abs(ry - y);
    if (d < bd) { bd = d; best = [rx, ry]; }
  }
  mouseTarget = best;
  queued = null;
});

// ---------- movement ----------
function canGo(e, d) { return isRoad(e.tx + d.dx, e.ty + d.dy); }

function choosePlayerDir() {
  if (queued && canGo(player, queued)) { player.dir = queued; queued = null; return; }
  if (mouseTarget) {
    if (player.tx === mouseTarget[0] && player.ty === mouseTarget[1]) { mouseTarget = null; player.dir = STOP; return; }
    const d = bfs(mouseTarget[0], mouseTarget[1]);
    let best = null, bd = 1e9;
    for (const dir of DIRS) {
      const nx = player.tx + dir.dx, ny = player.ty + dir.dy;
      if (isRoad(nx, ny) && d[ny][nx] >= 0 && d[ny][nx] < bd) { bd = d[ny][nx]; best = dir; }
    }
    player.dir = best || STOP;
    return;
  }
  if (!canGo(player, player.dir)) player.dir = STOP;
}

function chooseCopDir(c) {
  const map = c.kind === "ambusher" ? distAhead : distPlayer;
  const options = DIRS.filter((d) => canGo(c, d));
  const forward = options.filter((d) => !(d.dx === -c.dir.dx && d.dy === -c.dir.dy && (d.dx || d.dy)));
  const pool = forward.length ? forward : options;
  const random = c.kind === "wanderer" ? 0.35 : 0.08;
  if (Math.random() < random) { c.dir = Kit.pick(pool); return; }
  let best = pool[0], bd = 1e9;
  for (const d of pool) {
    const v = map[c.ty + d.dy][c.tx + d.dx];
    const score = v < 0 ? 1e6 : v + Math.random() * 0.5;
    if (score < bd) { bd = score; best = d; }
  }
  c.dir = best;
}

function advance(e, dt, chooser) {
  let move = e.speed * dt;
  let guard = 0;
  while (move > 0 && guard++ < 8) {
    if (e.t === 0) {
      chooser(e);
      if (!e.dir.dx && !e.dir.dy) return;
    }
    const step = Math.min(move, 1 - e.t);
    e.t += step;
    move -= step;
    if (e.t >= 1 - 1e-6) {
      e.tx += e.dir.dx;
      e.ty += e.dir.dy;
      e.t = 0;
      if (e === player) onPlayerTile();
    }
  }
  if (e.dir.dx || e.dir.dy) {
    const target = Math.atan2(e.dir.dy, e.dir.dx);
    let diff = target - e.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    e.angle += diff * Math.min(1, dt * 18);
  }
}

function onPlayerTile() {
  for (const b of bags) {
    if (b.x === player.tx && b.y === player.ty && !b.got) {
      b.got = true;
      cash += b.value;
      Kit.sfx(b.gold ? "score" : "coin");
      popups.push({ x: posX(player), y: posY(player) - 10, text: `+$${b.value}`, life: 1, color: b.gold ? "#facc15" : "#86efac" });
      burst(posX(player), posY(player), 12, b.gold ? ["#facc15", "#fde68a"] : ["#22c55e", "#86efac"], 160);
    }
  }
  for (const p of pickups) {
    if (p.x === player.tx && p.y === player.ty && !p.got) {
      p.got = true;
      player.nitro = 3.5;
      Kit.sfx("win");
      popups.push({ x: posX(player), y: posY(player) - 10, text: "NITRO!", life: 1, color: "#38bdf8" });
    }
  }
}

function burst(x, y, n, colors, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: Kit.rand(0.3, 0.8), size: Kit.randInt(3, 7), color: Kit.pick(colors) });
  }
}

// ---------- update ----------
function update(dt) {
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.94; q.vy *= 0.94; q.life -= dt; }
  particles = particles.filter((q) => q.life > 0);
  for (const p of popups) { p.y -= 30 * dt; p.life -= dt; }
  popups = popups.filter((p) => p.life > 0);
  shake = Math.max(0, shake - dt * 2);
  if (!alive) return;

  time += dt;
  queuedT -= dt;
  if (queuedT <= 0) queued = null;
  player.nitro = Math.max(0, player.nitro - dt);
  player.speed = player.nitro > 0 ? 9.5 : 6;
  advance(player, dt, choosePlayerDir);
  if (player.nitro > 0 && (player.dir.dx || player.dir.dy)) {
    particles.push({ x: posX(player) - player.dir.dx * 14, y: posY(player) - player.dir.dy * 14, vx: -player.dir.dx * 60, vy: -player.dir.dy * 60, life: 0.35, size: 6, color: Kit.pick(["#38bdf8", "#e0f2fe"]) });
  }

  distTimer -= dt;
  if (distTimer <= 0) {
    distTimer = 0.2;
    const [ax, ay] = aheadTile(player);
    distPlayer = bfs(ax, ay);
    // the ambusher aims a few tiles ahead of where you're heading
    let fx = ax, fy = ay;
    for (let i = 0; i < 4 && (player.dir.dx || player.dir.dy) && isRoad(fx + player.dir.dx, fy + player.dir.dy); i++) { fx += player.dir.dx; fy += player.dir.dy; }
    distAhead = bfs(fx, fy);
  }

  const copSpeed = Math.min(6.4, 4.3 + time * 0.012);
  for (const c of cops) {
    if (c.warm > 0) { c.warm -= dt; continue; }
    c.speed = copSpeed * (c.kind === "wanderer" ? 1.08 : 1);
    advance(c, dt, chooseCopDir);
    const dx = posX(c) - posX(player), dy = posY(c) - posY(player);
    if (dx * dx + dy * dy < (T * 0.72) ** 2) return busted();
  }

  // spawns
  spawnTimer -= dt;
  const maxCops = Math.min(8, 2 + Math.floor(time / 20));
  if (spawnTimer <= 0 && cops.length < maxCops) { spawnCop(); spawnTimer = 3; Kit.sfx("hit"); }
  for (const b of bags) { b.bob += dt; if (b.gold) b.life -= dt; }
  bags = bags.filter((b) => !b.got && b.life > 0);
  while (bags.length < 4) spawnBag();
  pickups = pickups.filter((p) => !p.got && (p.life -= dt) > 0);
  if (pickups.length === 0 && Math.random() < dt / 12) {
    const [x, y] = freeTileFarFrom(5);
    pickups.push({ x, y, life: 10 });
  }
  updateHud();
}

async function busted() {
  alive = false;
  shake = 1;
  Kit.sfx("hit");
  burst(posX(player), posY(player), 30, ["#ef4444", "#3b82f6", "#f2f4f5"], 260);
  const best = Kit.finish(ID, cash);
  updateHud();
  setTimeout(async () => {
    Kit.sfx("lose");
    await Kit.overlay("Busted!", `You got away with $${cash} in ${Math.floor(time)} seconds.\nBest: $${best}`, "Drive again");
    reset();
  }, 1100);
}

// ---------- drawing ----------
function drawMap() {
  ctx.fillStyle = "#374151";
  ctx.fillRect(0, 0, W, H);
  // lane dashes
  ctx.fillStyle = "rgba(250,204,21,.35)";
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      if (!road[y][x]) continue;
      const h = isRoad(x - 1, y) && isRoad(x + 1, y), v = isRoad(x, y - 1) && isRoad(x, y + 1);
      if (h && !v) ctx.fillRect(x * T + 10, y * T + T / 2 - 1, 12, 2);
      if (v && !h) ctx.fillRect(x * T + T / 2 - 1, y * T + 10, 2, 12);
      if (h && v) {   // crosswalk stripes at intersections
        ctx.fillStyle = "rgba(255,255,255,.12)";
        for (let i = 4; i < T - 4; i += 6) ctx.fillRect(x * T + i, y * T + 3, 3, 4);
        ctx.fillStyle = "rgba(250,204,21,.35)";
      }
    }
  for (const b of blocks) drawBlock(b);
}

function drawBlock(b) {
  let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
  for (const [x, y] of b.tiles) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const px = x0 * T, py = y0 * T, pw = (x1 - x0 + 1) * T, ph = (y1 - y0 + 1) * T;
  // sidewalk
  ctx.fillStyle = "#9ca3af";
  for (const [x, y] of b.tiles) ctx.fillRect(x * T, y * T, T, T);
  if (b.style === "edge") {
    for (const [x, y] of b.tiles) {
      ctx.fillStyle = (x + y) % 2 ? "#1f2937" : "#273244";
      ctx.fillRect(x * T + 2, y * T + 2, T - 4, T - 4);
    }
    return;
  }
  // a block that lost a street becomes one large lot; draw one building per 3x3 tile area
  for (let gy = y0; gy <= y1; gy += 4)
    for (let gx = x0; gx <= x1; gx += 4) {
      const w = Math.min(3, x1 - gx + 1), h = Math.min(3, y1 - gy + 1);
      drawLot(gx * T, gy * T, w * T, h * T, b, gx + gy);
    }
  if (pw > 3 * T || ph > 3 * T) {
    // fill the gap where a street was removed
    ctx.fillStyle = "#84cc16";
    for (const [x, y] of b.tiles) if (x % 4 === 1 || y % 4 === 1) ctx.fillRect(x * T + 3, y * T + 3, T - 6, T - 6);
  }
}

function drawLot(x, y, w, h, b, seed) {
  const s = b.style;
  if (s === "park") {
    ctx.fillStyle = "#4ade80";
    ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
    for (let i = 0; i < 4; i++) {
      const tx = x + 12 + ((seed * 7 + i * 29) % (w - 30)), ty = y + 12 + ((seed * 13 + i * 17) % (h - 30));
      Kit.brick(ctx, tx, ty, 18, 18, "#16a34a", 5);
    }
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(x + w / 2 - 8, y + h / 2 - 6, 16, 12);
  } else if (s === "lot") {
    ctx.fillStyle = "#6b7280";
    ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
    ctx.fillStyle = "#e5e7eb";
    for (let i = x + 12; i < x + w - 8; i += 18) ctx.fillRect(i, y + 8, 2, 20);
    Kit.brick(ctx, x + 14, y + h - 34, 14, 24, b.hue, 3);
  } else {
    const color = s === "house" ? "#b91c1c" : s === "shop" ? b.hue : "#475569";
    Kit.brick(ctx, x + 4, y + 4, w - 8, h - 8, color, 6);
    ctx.fillStyle = "rgba(0,0,0,.2)";
    ctx.fillRect(x + 4, y + h - 10, w - 8, 6);
    if (s === "office") {
      ctx.fillStyle = b.hue + "88";
      for (let wy = y + 14; wy < y + h - 18; wy += 14) for (let wx = x + 14; wx < x + w - 16; wx += 14) ctx.fillRect(wx, wy, 8, 6);
      ctx.fillStyle = "#94a3b8";
      ctx.fillRect(x + w - 26, y + 10, 12, 12);
    } else if (s === "house") {
      ctx.fillStyle = "#7f1d1d";
      ctx.fillRect(x + 6, y + h / 2 - 2, w - 12, 4);
      ctx.fillStyle = "#57534e";
      ctx.fillRect(x + w - 26, y + 12, 10, 14);
    } else {
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(x + 10, y + h - 26, w - 20, 10);
      ctx.fillStyle = "rgba(255,255,255,.25)";
      for (let i = x + 10; i < x + w - 10; i += 16) ctx.fillRect(i, y + 10, 8, 30);
    }
  }
}

function drawCar(e, body, roof, siren) {
  const x = posX(e), y = posY(e);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(e.angle);
  ctx.fillStyle = "rgba(0,0,0,.3)";
  ctx.fillRect(-12, -7, 28, 18);
  Kit.brick(ctx, -14, -10, 28, 20, body, 5);
  ctx.fillStyle = roof;
  ctx.fillRect(-6, -7, 12, 14);
  ctx.fillStyle = "#93c5fd";
  ctx.fillRect(6, -7, 4, 14);               // windshield
  ctx.fillStyle = "#fef08a";
  ctx.fillRect(12, -8, 2, 4);
  ctx.fillRect(12, 4, 2, 4);
  if (siren) {
    const on = Math.floor(time * 8) % 2 === 0;
    ctx.fillStyle = on ? "#ef4444" : "#7f1d1d";
    ctx.fillRect(-4, -7, 4, 6);
    ctx.fillStyle = on ? "#1e3a8a" : "#3b82f6";
    ctx.fillRect(-4, 1, 4, 6);
  }
  ctx.restore();
  if (siren) {
    // soft siren glow
    const on = Math.floor(time * 8) % 2 === 0;
    ctx.fillStyle = on ? "rgba(239,68,68,.12)" : "rgba(59,130,246,.12)";
    ctx.fillRect(x - 24, y - 24, 48, 48);
  }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(Kit.rand(-6, 6) * shake, Kit.rand(-6, 6) * shake);
  drawMap();
  // mouse destination marker
  if (mouseTarget) {
    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 3;
    ctx.strokeRect(mouseTarget[0] * T + 4, mouseTarget[1] * T + 4, T - 8, T - 8);
  }
  for (const b of bags) {
    const x = b.x * T + T / 2, y = b.y * T + T / 2 + Math.sin(b.bob * 4) * 2;
    if (b.gold && b.life < 3 && Math.floor(b.life * 6) % 2) continue;
    Kit.brick(ctx, x - 10, y - 8, 20, 18, b.gold ? "#facc15" : "#16a34a", 5);
    ctx.fillStyle = b.gold ? "#a16207" : "#14532d";
    ctx.fillRect(x - 5, y - 12, 10, 5);
    // banded stack of bills peeking out of the bag
    ctx.fillStyle = b.gold ? "#fef3c7" : "#bbf7d0";
    ctx.fillRect(x - 7, y - 1, 14, 6);
    ctx.fillStyle = b.gold ? "#a16207" : "#15803d";
    ctx.fillRect(x - 2, y - 1, 4, 6);
  }
  for (const p of pickups) {
    const x = p.x * T + T / 2, y = p.y * T + T / 2;
    Kit.brick(ctx, x - 9, y - 11, 18, 22, "#0ea5e9", 4);
    ctx.fillStyle = "#e0f2fe";
    ctx.beginPath();
    ctx.moveTo(x + 2, y - 8); ctx.lineTo(x - 5, y + 1); ctx.lineTo(x, y + 1); ctx.lineTo(x - 2, y + 8); ctx.lineTo(x + 5, y - 1); ctx.lineTo(x, y - 1);
    ctx.fill();
  }
  for (const c of cops) {
    if (c.warm > 0) {
      if (Math.floor(c.warm * 8) % 2) continue;
    }
    drawCar(c, "#f8fafc", "#111827", true);
  }
  if (alive || Math.floor(performance.now() / 100) % 2) drawCar(player, player.nitro > 0 ? "#38bdf8" : "#f97316", "#7c2d12", false);
  for (const q of particles) {
    ctx.globalAlpha = Kit.clamp(q.life * 2, 0, 1);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  ctx.font = `800 16px ${FONT}`;
  ctx.textAlign = "center";
  for (const p of popups) {
    ctx.globalAlpha = Kit.clamp(p.life * 2, 0, 1);
    ctx.fillStyle = "#000";
    ctx.fillText(p.text, p.x + 1, p.y + 1);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

const game = Kit.loop(update, draw);
reset();
draw();
Kit.overlay("Getaway", "Grab the cash bags scattered around the city\nand don't get caught! More police join the chase over time.\nGold bags are worth $500 but vanish quickly.\nBlue bolts give you a burst of nitro.\n\nArrows / WASD to steer (turns are remembered),\nor click a street to drive there.", "Drive").then(() => game.start());
</script>
